vm_role: UAC
vm_id: uac-local
uac_ext_start: 4001000
uac_ext_end: 4001004
uas_ext_start: 4001005
uas_ext_end: 4001009
sbc_host: 10.133.63.117
sbc_port: 5060
sip_transport: TCP
domain: avaya.com
sip_password: "123456"
cps: 1
hold_time_seconds: 5
ramp_up_seconds: 5
metrics_port: 8082
coordinator_url: http://localhost:8080
