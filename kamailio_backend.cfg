	}
	return;
}

# Load SHA-256 HA1 from DB only (no cache read). Used on auth failure to refresh and retry.
# Updates htable cache when WITH_HTABLE. Sets $avp(ha1_sha256).
route[AUTH_LOAD_HA1_SHA256_FROM_DB] {
	$avp(ha1_sha256) = $null;
#!ifdef WITH_HTABLE
	$var(ha1_key) = $fU + ":" + $fd;
#!endif
#!ifdef WITH_MULTIDOMAIN
	sql_query("location_db", "SELECT ha1_sha256 FROM subscriber WHERE username='$fU' AND domain='$fd'", "ra_sha256");
#!else
	sql_query("location_db", "SELECT ha1_sha256 FROM subscriber WHERE username='$fU'", "ra_sha256");
#!endif
	if ($dbr(ra_sha256=>rows) > 0) {
		$avp(ha1_sha256) = $dbr(ra_sha256=>[0,0]);
		if ($var(auth_load_retry) == 1) {
			xlog("L_DBG", "AUTH_LOAD_HA1_SHA256_FROM_DB: Reading credentials from database (auth retry refresh) for user=$fU@$fd\n");
		} else {
			xlog("L_DBG", "AUTH_LOAD_HA1_SHA256_FROM_DB: Reading credentials from database for user=$fU@$fd\n");
		}
#!ifdef WITH_HTABLE
		$sht(ha1_sha256=>$var(ha1_key)) = $avp(ha1_sha256);
#!endif
	} else {
#!ifdef WITH_HTABLE
		# Subscriber no longer in DB; remove stale cache entry if present (e.g. after REGISTER for deleted user)
		sht_rm("ha1_sha256", $var(ha1_key));
#!endif
	}
	sql_result_free("ra_sha256");
	return;
}

# Load MD5 HA1 from DB only (no cache read). Used on auth failure to refresh and retry.
# Updates htable cache when WITH_HTABLE. Sets $avp(ha1_md5).
route[AUTH_LOAD_HA1_MD5_FROM_DB] {
	$avp(ha1_md5) = $null;
#!ifdef WITH_HTABLE
	$var(ha1_key) = $fU + ":" + $fd;
#!endif
#!ifdef WITH_MULTIDOMAIN
	sql_query("location_db", "SELECT ha1 FROM subscriber WHERE username='$fU' AND domain='$fd'", "ra_md5");
#!else
	sql_query("location_db", "SELECT ha1 FROM subscriber WHERE username='$fU'", "ra_md5");
#!endif
	if ($dbr(ra_md5=>rows) > 0) {
		$avp(ha1_md5) = $dbr(ra_md5=>[0,0]);
		if ($var(auth_load_retry) == 1) {
			xlog("L_DBG", "AUTH_LOAD_HA1_MD5_FROM_DB: Reading credentials from database (auth retry refresh) for user=$fU@$fd\n");
		} else {
			xlog("L_DBG", "AUTH_LOAD_HA1_MD5_FROM_DB: Reading credentials from database for user=$fU@$fd\n");
		}
#!ifdef WITH_HTABLE
		$sht(ha1_md5=>$var(ha1_key)) = $avp(ha1_md5);
#!endif
	} else {
#!ifdef WITH_HTABLE
		# Subscriber no longer in DB; remove stale cache entry if present (e.g. after REGISTER for deleted user)
		sht_rm("ha1_md5", $var(ha1_key));
#!endif
	}
	sql_result_free("ra_md5");
	return;
}

# Send authentication challenge with configured algorithms
# Per RFC 7616, multiple WWW-Authenticate/Proxy-Authenticate headers can be sent
# for different algorithms. The order indicates preference (first is preferred).
route[AUTH_CHALLENGE] {
	# Determine which algorithms are allowed
	# AUTH_ALGORITHMS format: "SHA-256,MD5" or "SHA-256" or "MD5"
	$var(sha256_allowed) = 0;
	$var(md5_allowed) = 0;
	$var(sha256_first) = 0;
	
	if (AUTH_ALGORITHMS =~ "SHA-256") {
		$var(sha256_allowed) = 1;
	}
	if (AUTH_ALGORITHMS =~ "MD5") {
		$var(md5_allowed) = 1;
	}
	# Check if SHA-256 is the preferred algorithm (appears first)
	if (AUTH_ALGORITHMS =~ "^SHA-256") {
		$var(sha256_first) = 1;
	}
	
	xlog("L_DBG", "AUTH_CHALLENGE: Sending challenge for $fd (SHA-256=$var(sha256_allowed), MD5=$var(md5_allowed), SHA256_first=$var(sha256_first))\n");
	
	# For single algorithm, use built-in challenge functions
	if ($var(sha256_allowed) == 1 && $var(md5_allowed) == 0) {
		# SHA-256 only - set algorithm before challenge
		auth_algorithm("SHA-256");
		if ($var(use_proxy_auth) == 1) {
			proxy_challenge("$fd", "1");
		} else {
			www_challenge("$fd", "1");
		}
		return;
	}
	if ($var(sha256_allowed) == 0 && $var(md5_allowed) == 1) {
		# MD5 only - use built-in challenge (MD5 is default)
		auth_algorithm("MD5");
		if ($var(use_proxy_auth) == 1) {
			proxy_challenge("$fd", "1");
		} else {
			www_challenge("$fd", "1");
		}
		return;
	}
	
	# Both algorithms enabled - send two headers in preference order
	# Use Kamailio's native nonce generation via auth_get_www_authenticate()
	# This ensures proper nonce expiry validation (controlled by nonce_expire param)
	
	# Generate challenge headers using auth_algorithm() to set each algorithm
	# then auth_get_www_authenticate() to build the header with proper nonce
	# Flags: 4 = qop=auth
	
	# Generate SHA-256 challenge header
	auth_algorithm("SHA-256");
	if (!auth_get_www_authenticate("$fd", "4", "$var(sha256_hdr)")) {
		xlog("L_ERR", "AUTH_CHALLENGE: Failed to generate SHA-256 header\n");
	}
	xlog("L_DBG", "AUTH_CHALLENGE: SHA-256 header generated: [$var(sha256_hdr)]\n");
	
	# Generate MD5 challenge header
	auth_algorithm("MD5");
	if (!auth_get_www_authenticate("$fd", "4", "$var(md5_hdr)")) {
		xlog("L_ERR", "AUTH_CHALLENGE: Failed to generate MD5 header\n");
	}
	xlog("L_DBG", "AUTH_CHALLENGE: MD5 header generated: [$var(md5_hdr)]\n");
	
	# Determine reply code based on request type
	if ($var(use_proxy_auth) == 1) {
		$var(reply_code) = 407;
		$var(reply_reason) = "Proxy Authentication Required";
		# Convert WWW-Authenticate to Proxy-Authenticate
		$var(sha256_hdr) = $(var(sha256_hdr){re.subst,/^WWW-Authenticate/Proxy-Authenticate/});
		$var(md5_hdr) = $(var(md5_hdr){re.subst,/^WWW-Authenticate/Proxy-Authenticate/});
	} else {
		$var(reply_code) = 401;
		$var(reply_reason) = "Unauthorized";
	}
	
	xlog("L_DBG", "AUTH_CHALLENGE: About to append headers\n");
	
	# Add headers in preference order (first header = preferred algorithm)
	# Use append_to_reply() to add headers to the REPLY (not to the request)
	# Note: auth_get_www_authenticate includes trailing CRLF
	if ($var(sha256_first) == 1) {
		# SHA-256 preferred - add SHA-256 first, then MD5
		append_to_reply("$var(sha256_hdr)");
		append_to_reply("$var(md5_hdr)");
		xlog("L_DBG", "AUTH_CHALLENGE: Added dual headers (SHA-256 preferred) for $fd\n");
	} else {
		# MD5 preferred - add MD5 first, then SHA-256
		append_to_reply("$var(md5_hdr)");
		append_to_reply("$var(sha256_hdr)");
		xlog("L_DBG", "AUTH_CHALLENGE: Added dual headers (MD5 preferred) for $fd\n");
	}
	
	# Send the reply with the appended headers
	sl_send_reply($var(reply_code), "$var(reply_reason)");
	return;
}

# Send authentication challenge with stale=true (nonce expired)
route[AUTH_CHALLENGE_STALE] {
	xlog("L_DBG", "AUTH_CHALLENGE_STALE: Sending stale challenge for $fd\n");
	
	# Determine which algorithms are allowed
	$var(sha256_allowed) = 0;
	$var(md5_allowed) = 0;
	$var(sha256_first) = 0;
	
	if (AUTH_ALGORITHMS =~ "SHA-256") {
		$var(sha256_allowed) = 1;
	}
	if (AUTH_ALGORITHMS =~ "MD5") {
		$var(md5_allowed) = 1;
	}
	if (AUTH_ALGORITHMS =~ "^SHA-256") {
		$var(sha256_first) = 1;
	}
	
	# For single algorithm, use built-in challenge with stale flag
	if (!($var(sha256_allowed) == 1 && $var(md5_allowed) == 1)) {
		# Set algorithm before challenge
		if ($var(sha256_allowed) == 1) {
			auth_algorithm("SHA-256");
		} else {
			auth_algorithm("MD5");
		}
		# Flags: 1 = qop=auth, 16 = stale=true, so 17 = qop + stale
		if ($var(use_proxy_auth) == 1) {
			proxy_challenge("$fd", "17");
		} else {
			www_challenge("$fd", "17");
		}
		return;
	}
	
	# Both algorithms enabled - send two headers with stale=true
	# Use Kamailio's native nonce generation via auth_get_www_authenticate()
	# Flags: 4 = qop=auth, 16 = stale=true, so 20 = qop=auth + stale=true
	
	# Generate SHA-256 challenge header with stale=true
	auth_algorithm("SHA-256");
	if (!auth_get_www_authenticate("$fd", "20", "$var(sha256_hdr)")) {
		xlog("L_ERR", "AUTH_CHALLENGE_STALE: Failed to generate SHA-256 header\n");
	}
	
	# Generate MD5 challenge header with stale=true
	auth_algorithm("MD5");
	if (!auth_get_www_authenticate("$fd", "20", "$var(md5_hdr)")) {
		xlog("L_ERR", "AUTH_CHALLENGE_STALE: Failed to generate MD5 header\n");
	}
	
	# Determine reply code based on request type
	if ($var(use_proxy_auth) == 1) {
		$var(reply_code) = 407;
		$var(reply_reason) = "Proxy Authentication Required";
		# Convert WWW-Authenticate to Proxy-Authenticate
		$var(sha256_hdr) = $(var(sha256_hdr){re.subst,/^WWW-Authenticate/Proxy-Authenticate/});
		$var(md5_hdr) = $(var(md5_hdr){re.subst,/^WWW-Authenticate/Proxy-Authenticate/});
	} else {
		$var(reply_code) = 401;
		$var(reply_reason) = "Unauthorized";
	}
	
	# Add headers in preference order with stale=true
	# Use append_to_reply() to add headers to the REPLY (not to the request)
	# Note: auth_get_www_authenticate includes trailing CRLF
	if ($var(sha256_first) == 1) {
		append_to_reply("$var(sha256_hdr)");
		append_to_reply("$var(md5_hdr)");
	} else {
		append_to_reply("$var(md5_hdr)");
		append_to_reply("$var(sha256_hdr)");
	}
	
	sl_send_reply($var(reply_code), "$var(reply_reason)");
	return;
}
#!endif

# HA-aware Record-Route using cluster FQDN for failover support
# Uses $avp(ha_fqdn) which is set by LOAD_HA_FQDN route at request start
# Adds origip parameter to help load balancer route in-dialog requests
# to the original server that handled the initial request
route[HA_RECORD_ROUTE] {
	# Use the AVP set by LOAD_HA_FQDN (called at start of request_route)
	if (!strempty($avp(ha_fqdn))) {
		# Use cluster FQDN for Record-Route (enables failover via DNS)
		# Include transport parameter (tcp/tls) for proper routing
		# Include origip parameter with this server's IP for LB routing hints
		# Format: sip:fqdn:port;transport=tcp;origip=SERVER_IP;lr
		$var(rr_uri) = $avp(ha_fqdn) + ":" + $sel(cfg_get.ha.srv_port)
		             + ";transport=" + $sel(cfg_get.ha.srv_transport)
		             + ";origip=" + $Ri;
		record_route_preset("$var(rr_uri)");
		xlog("L_DBG", "HA_RECORD_ROUTE: Using cluster FQDN with origip: $var(rr_uri)\n");
	} else {
		# Fallback to local IP (no failover for in-dialog requests)
		# Still add origip parameter for consistency
		xlog("L_WARN", "HA_RECORD_ROUTE: HEADLESS_FQDN not set, falling back to local IP\n");
		record_route();
		add_rr_param(";origip=$Ri");
	}
	return;
}

# ============================================================================
# Set destination for direct endpoint routing (no LB)
# ============================================================================
# When routing directly to endpoint (no LB discovered), we need to set $du
# explicitly to ensure the transport from R-URI is honored.
# 
# Without setting $du, Kamailio may select UDP over TCP even when R-URI
# specifies transport=tcp, depending on socket configuration and routing.
#
# This route extracts transport from R-URI and sets $du accordingly.
# If no transport specified in R-URI, defaults to TCP for reliability.
# ============================================================================
route[SET_ENDPOINT_DESTINATION] {
	# Extract transport from Request-URI
	$var(ruri_transport) = $(ru{uri.param,transport});
	
	if (strempty($var(ruri_transport))) {
		# No transport specified - check if incoming was TCP, use same
		if ($proto == "tcp" || $proto == "tls") {
			$var(ruri_transport) = $proto;
			xlog("L_DBG", "SET_ENDPOINT_DST: No transport in R-URI, using incoming proto: $var(ruri_transport)\n");
		} else {
			# Default to TCP for SIP reliability
			$var(ruri_transport) = "tcp";
			xlog("L_DBG", "SET_ENDPOINT_DST: No transport in R-URI, defaulting to TCP\n");
		}
	}
	
	# Build destination URI from R-URI components with explicit transport
	# This ensures the transport is properly set in $du for socket selection
	$du = "sip:" + $rd;
	if ($rp != $null && $rp != "" && $rp != "5060") {
		$du = $du + ":" + $rp;
	} else {
		$du = $du + ":5060";
	}
	$du = $du + ";transport=" + $var(ruri_transport);
	
	xlog("L_INFO", "SET_ENDPOINT_DST: Set destination to $du (R-URI=$ru)\n");
	return;
}

# Dialog event callbacks - for tracking dialog state changes (HA debugging)
event_route[dialog:start] {
	xlog("L_INFO", "DIALOG_EVENT: Dialog CONFIRMED (200 OK) - Call-ID=$ci, leg=$dlg_var(leg_type), From=$dlg(from_uri), To=$dlg(to_uri)\n");
}

event_route[dialog:end] {
	xlog("L_INFO", "DIALOG_EVENT: Dialog ENDED - Call-ID=$ci, leg=$dlg_var(leg_type), duration=$DLG_lifetime sec\n");
}

event_route[dialog:failed] {
	xlog("L_INFO", "DIALOG_EVENT: Dialog FAILED (no 200 OK) - Call-ID=$ci, leg=$dlg_var(leg_type)\n");
}

# Caller NAT detection
route[NATDETECT] {
#!ifdef WITH_NAT
	if (nat_uac_test("19")) {
		if (is_method("REGISTER")) {
			fix_nated_register();
		} else {
			if(is_first_hop()) {
				set_contact_alias();
			}
		}
		setflag(FLT_NATS);
	}
#!endif
	return;
}

# RTP relaying management and signaling updates for NAT traversal
route[NATMANAGE] {
#!ifdef WITH_NAT
	if (is_request()) {
		if(has_totag()) {
			if(check_route_param("nat=yes")) {
				setbflag(FLB_NATB);
			}
		}
	}
	if (!(isflagset(FLT_NATS) || isbflagset(FLB_NATB))) return;

#!ifdef WITH_RTPENGINE
	if(nat_uac_test("8")) {
		rtpengine_manage("SIP-source-address replace-origin replace-session-connection");
	} else {
		rtpengine_manage("replace-origin replace-session-connection");
	}
#!else
	if(nat_uac_test("8")) {
		rtpproxy_manage("co");
	} else {
		rtpproxy_manage("cor");
	}
#!endif

	if (is_request()) {
		if (!has_totag()) {
			if(t_is_branch_route()) {
				add_rr_param(";nat=yes");
			}
		}
	}
	if (is_reply()) {
		if(isbflagset(FLB_NATB)) {
			if(is_first_hop())
				set_contact_alias();
		}
	}

	if(isbflagset(FLB_NATB)) {
		# no connect message in a dialog involving NAT traversal
		if (is_request()) {
			if(has_totag()) {
				set_forward_no_connect();
			}
		}
	}
#!endif
	return;
}

# URI update for dialog requests
route[DLGURI] {
#!ifdef WITH_NAT
	if(!isdsturiset()) {
		handle_ruri_alias();
	}
#!endif
	return;
}

# Routing to foreign domains
route[SIPOUT] {
	if (uri==myself) return;
	# Treat as local if Request-URI domain is in domain table
	if (is_domain_local("$rd")) {
		xlog("L_DBG", "SIPOUT: Domain $rd is local (domain table), treating as local\n");
		return;
	}
	append_hf("P-Hint: outbound\r\n");
	route(RELAY);
	exit;
}

# PSTN GW routing
route[PSTN] {
#!ifdef WITH_PSTN
	# check if PSTN GW IP is defined
	if (strempty($sel(cfg_get.pstn.gw_ip))) {
		xlog("SCRIPT: PSTN routing enabled but pstn.gw_ip not defined\n");
		return;
	}

	# route to PSTN dialed numbers starting with '+' or '00'
	#     (international format)
	# - update the condition to match your dialing rules for PSTN routing
	if(!($rU=~"^(\+|00)[1-9][0-9]{3,20}$")) return;

	# only local users allowed to call
	if(from_uri!=myself) {
		sl_send_reply("403", "Not Allowed");
		exit;
	}

	# normalize target number for pstn gateway
	# - convert leading 00 to +
	if (starts_with("$rU", "00")) {
		strip(2);
		prefix("+");
	}

	if (strempty($sel(cfg_get.pstn.gw_port))) {
		$ru = "sip:" + $rU + "@" + $sel(cfg_get.pstn.gw_ip);
	} else {
		$ru = "sip:" + $rU + "@" + $sel(cfg_get.pstn.gw_ip) + ":"
					+ $sel(cfg_get.pstn.gw_port);
	}

	route(RELAY);
	exit;
#!endif

	return;
}

# JSONRPC over HTTP(S) routing and REST API
#!ifdef WITH_JSONRPC
event_route[xhttp:request] {
	set_reply_close();
	set_reply_no_connect();
	
	# Security: Allow localhost and local network
	# Adjust this to match your security requirements
	if(src_ip!=127.0.0.1 && src_ip!=10.0.0.0/8 && src_ip!=192.168.0.0/16) {
		xhttp_reply("403", "Forbidden", "application/json",
				"{\"error\": \"access denied from $si\"}");
		exit;
	}
	
	# JSON-RPC endpoint
	if ($hu =~ "^/RPC") {
		jsonrpc_dispatch();
		exit;
	}

#!ifdef WITH_CM
	# ============================================================
	# REST API endpoints for av_esc module
	# URL format uses path parameters: /api/v1/resource/user/domain
	# ============================================================
	
	# GET /api/v1/registrations/{user}/{domain}
	# Example: /api/v1/registrations/alice/avaya.com
	# Returns registration info for a user in JSON format
	if ($hu =~ "^/api/v1/registrations/[^/]+/[^/]+$" && $rm == "GET") {
		# Extract user and domain from URL path
		# Path: /api/v1/registrations/user/domain
		# Index: 0=empty, 1=api, 2=v1, 3=registrations, 4=user, 5=domain
		$var(user) = $(hu{s.select,4,/});
		$var(domain) = $(hu{s.select,5,/});
		$var(aor) = $var(user) + "@" + $var(domain);
		
		xlog("L_INFO", "REST API: GET registrations for aor=$var(aor)\n");
		
		# Call av_esc module function - sets $avp(rest_response)
		if (av_esc_rest_get_registrations("$var(aor)")) {
			xhttp_reply("200", "OK", "application/json", "$avp(rest_response)");
		} else {
			xhttp_reply("500", "Internal Server Error", "application/json",
				"{\"error\": \"failed to get registrations\"}");
		}
		exit;
	}
	
	# GET /api/v1/subscriptions/{user}/{domain}
	# Example: /api/v1/subscriptions/alice/avaya.com
	# Returns subscription info for a user in JSON format
	if ($hu =~ "^/api/v1/subscriptions/[^/]+/[^/]+$" && $rm == "GET") {
		# Extract user and domain from URL path
		# Path: /api/v1/subscriptions/user/domain
		# Index: 0=empty, 1=api, 2=v1, 3=subscriptions, 4=user, 5=domain
		$var(user) = $(hu{s.select,4,/});
		$var(domain) = $(hu{s.select,5,/});
		$var(aor) = $var(user) + "@" + $var(domain);
		
		xlog("L_INFO", "REST API: GET subscriptions for aor=$var(aor)\n");
		
		# Call av_esc module function - sets $avp(rest_response)
		if (av_esc_rest_get_subscriptions("$var(aor)")) {
			xhttp_reply("200", "OK", "application/json", "$avp(rest_response)");
		} else {
			xhttp_reply("500", "Internal Server Error", "application/json",
				"{\"error\": \"failed to get subscriptions\"}");
		}
		exit;
	}
	
	# POST /api/v1/internal/notify - Cross-server NOTIFY (HA/clustering support)
	# This endpoint is called by peer Kamailio server to trigger NOTIFY
	# for subscriptions owned by this server
	if ($hu == "/api/v1/internal/notify" && $rm == "POST") {
		# Security: Only allow from peer server or load balancer
		# Check direct source IP
		$var(allowed) = 0;
		# Allow from discovered load balancers (peer requests may come through LB)
#!ifdef WITH_HTABLE
		if ($sht(lbs=>$si) != $null) $var(allowed) = 1;
#!endif
		# Allow localhost for testing
		if ($si == "127.0.0.1") $var(allowed) = 1;
		
		if ($var(allowed) == 0) {
			xlog("L_WARN", "REST API: Internal NOTIFY rejected from untrusted source $si\n");
			xhttp_reply("403", "Forbidden", "application/json",
				"{\"error\": \"internal API access denied from $si\"}");
			exit;
		}
		
		xlog("L_INFO", "REST API: Internal NOTIFY from peer server $si\n");
		if (av_esc_rest_internal_notify()) {
			xhttp_reply("200", "OK", "application/json", "$avp(rest_response)");
		} else {
			xhttp_reply("500", "Internal Server Error", "application/json",
				"{\"error\": \"failed to process internal notify\"}");
		}
		exit;
	}
	
	# GET /api/v1/health - Health check endpoint
	if ($hu == "/api/v1/health" && $rm == "GET") {
		xhttp_reply("200", "OK", "application/json",
			"{\"status\": \"healthy\", \"service\": \"kamailio-av_esc\"}");
		exit;
	}
	
	# Help endpoint - shows available API endpoints
	if ($hu == "/api/v1" || $hu == "/api/v1/") {
		xhttp_reply("200", "OK", "application/json",
			"{\"endpoints\": [\"/api/v1/health\", \"/api/v1/registrations/{user}/{domain}\", \"/api/v1/subscriptions/{user}/{domain}\", \"/api/v1/internal/notify\"]}");
		exit;
	}
	
	# API endpoint not found
	if ($hu =~ "^/api/") {
		xhttp_reply("404", "Not Found", "application/json",
			"{\"error\": \"endpoint not found\", \"path\": \"$hu\"}");
		exit;
	}
#!endif

	xhttp_reply("200", "OK", "text/html",
				"<html><body>Kamailio HTTP Server</body></html>");
	exit;
}
#!endif

# Routing to CM server
# Note: SUBSCRIBE handling is now done by av_esc module in route[PRESENCE]
# Note: INVITE handling is now done by route[INVITE_SEQUENCING]
# This route is kept for backward compatibility when WITH_CM is not defined
# If LB is configured, routes via LB with Route header to CM
route[TOCM] {
#!ifdef WITH_CM
	xlog("L_INFO", "TOCM: Entered route, method=$rm, ruri=$ru\n");

	# check if CM server IP is defined
	if (strempty($avp(cm_ip))) {
		xlog("SCRIPT: CM routing enabled but IP not defined\n");
		return;
	}

	# Use source-aware LB selection with failover
	route(LB_SELECT_DESTINATION);
	
	# If routing via LB, add Route header to CM
	if ($var(using_lb) == 1) {
		$var(cm_route) = "<sip:" + $avp(cm_ip) + ":" + $avp(cm_port) 
			+ ";transport=" + $avp(cm_proto) + ";lr>";
		append_hf("Route: $var(cm_route)\r\n");
		xlog("L_INFO", "TOCM: Routing via LB $du with Route to CM $var(cm_route)\n");
	} else {
		xlog("L_INFO", "TOCM: Routing directly to CM, du=$du, ru=$ru\n");
	}
	
	# Enable LB failover for this request
	if (!strempty($avp(alt_lb_uri))) {
		t_on_failure("LB_FAILOVER");
	}
	
	route(RELAY);
	exit;
#!endif
	return;
}

# ============================================================================
# LB Source-Aware Destination Selection (Dynamic LB Discovery)
# ============================================================================
# This route selects an LB for outbound routing using dynamically discovered
# LBs from the htable. Requests go out through the same LB they came in on,
# with failover to an alternate LB if the source LB fails.
#
# LBs are discovered from incoming OPTIONS messages - see route[LB_REGISTER].
#
# Sets:
#   $du - Destination URI (source LB if request came from LB, else first available)
#   $avp(alt_lb_uri) - Alternate LB URI for failover
#   $var(source_lb) - 1 if from known LB, 0 otherwise
#   $var(using_lb) - 1 if routing via LB, 0 if direct to CM
#
# Call this route before setting $du for any LB-routed request
# ============================================================================
route[LB_SELECT_DESTINATION] {
	$var(source_lb) = 0;
	$var(stored_lb_ip) = "";
	$var(using_lb) = 0;
	$var(lb_switched) = 0;
	$avp(alt_lb_uri) = $null;
	
	# =========================================================================
	# LB Selection with Dynamic Discovery and Dialog Affinity
	#
	# Priority: 
	# 1. If request came from a known LB, use that LB (affinity)
	# 2. If dialog has stored LB preference, use that
	# 3. Otherwise, use first available discovered LB
	# =========================================================================
	
	# Check if we have any discovered LBs
#!ifdef WITH_HTABLE
	route(LB_GET_FIRST);
	if ($avp(selected_lb_ip) == $null) {
		# No LBs discovered - route directly to CM
		$du = "sip:" + $avp(cm_ip) + ":" + $avp(cm_port)
			+ ";transport=" + $avp(cm_proto);
		xlog("L_INFO", "LB_SELECT: No LBs discovered, routing direct to CM: $du\n");
		return;
	}
	
	$var(using_lb) = 1;
	
	# Get stored dialog preference (if any)
	if (!strempty($dlg_var(source_lb_ip))) {
		$var(stored_lb_ip) = $dlg_var(source_lb_ip);
	}
	
	# Get the current incoming LB (set by DETECT_SOURCE_LB in request_route)
	if ($avp(incoming_lb) != $null && $avp(incoming_lb) > 0 && $avp(incoming_lb_ip) != $null) {
		$var(source_lb) = 1;
		
		# Check if incoming LB differs from stored preference (failover detection)
		if (!strempty($var(stored_lb_ip)) && $avp(incoming_lb_ip) != $var(stored_lb_ip)) {
			$var(lb_switched) = 1;
			xlog("L_WARN", "LB_SELECT: LB FAILOVER DETECTED for Call-ID=$ci - "
				"stored=$var(stored_lb_ip), incoming=$avp(incoming_lb_ip). Updating.\n");
		}
		
		# Update/store dialog LB preference
		$dlg_var(source_lb_ip) = $avp(incoming_lb_ip);
		
		# Use the incoming LB
		$var(use_lb_ip) = $avp(incoming_lb_ip);
		$var(lb_data) = $sht(lbs=>$var(use_lb_ip));
		if ($var(lb_data) != $null) {
			$var(use_lb_port) = $(var(lb_data){s.select,0,:});
			$var(use_lb_proto) = $(var(lb_data){s.select,1,:});
		} else {
			# LB entry expired, use defaults
			$var(use_lb_port) = "5060";
			$var(use_lb_proto) = "tcp";
		}
		
		xlog("L_DBG", "LB_SELECT: Using incoming LB: $var(use_lb_ip):$var(use_lb_port)\n");
	} else if (!strempty($var(stored_lb_ip))) {
		# No incoming LB but have stored preference
		$var(use_lb_ip) = $var(stored_lb_ip);
		$var(lb_data) = $sht(lbs=>$var(use_lb_ip));
		if ($var(lb_data) != $null) {
			$var(use_lb_port) = $(var(lb_data){s.select,0,:});
			$var(use_lb_proto) = $(var(lb_data){s.select,1,:});
			xlog("L_DBG", "LB_SELECT: Using stored LB preference: $var(use_lb_ip):$var(use_lb_port)\n");
		} else {
			# Stored LB expired, use first available
			$var(use_lb_ip) = $avp(selected_lb_ip);
			$var(use_lb_port) = $avp(selected_lb_port);
			$var(use_lb_proto) = $avp(selected_lb_proto);
			xlog("L_INFO", "LB_SELECT: Stored LB expired, using first available: $var(use_lb_ip)\n");
		}
	} else {
		# No preference - use first available LB
		$var(use_lb_ip) = $avp(selected_lb_ip);
		$var(use_lb_port) = $avp(selected_lb_port);
		$var(use_lb_proto) = $avp(selected_lb_proto);
		xlog("L_DBG", "LB_SELECT: No preference, using first available LB: $var(use_lb_ip)\n");
	}
	
	# Validate port and protocol - use defaults if invalid
	# This catches cases where htable data is malformed or incomplete
	if ($var(use_lb_port) == $null || $var(use_lb_port) == "" || $var(use_lb_port) == "0") {
		xlog("L_WARN", "LB_SELECT: Invalid LB port ($var(use_lb_port)), using default 5060\n");
		$var(use_lb_port) = "5060";
	}
	if ($var(use_lb_proto) == $null || $var(use_lb_proto) == "") {
		xlog("L_WARN", "LB_SELECT: Invalid LB protocol ($var(use_lb_proto)), using default tcp\n");
		$var(use_lb_proto) = "tcp";
	}
	
	# Set destination URI
	$du = "sip:" + $var(use_lb_ip) + ":" + $var(use_lb_port)
		+ ";transport=" + $var(use_lb_proto);
	
	# Store for Route header generation
	$avp(selected_lb_ip) = $var(use_lb_ip);
	$avp(selected_lb_port) = $var(use_lb_port);
	$avp(selected_lb_proto) = $var(use_lb_proto);
	
	# Get alternate LB for failover
	route(LB_GET_ALT);
	if ($avp(alt_lb_ip) != $null) {
		$avp(alt_lb_uri) = "sip:" + $avp(alt_lb_ip) + ":" + $avp(alt_lb_port)
			+ ";transport=" + $avp(alt_lb_proto);
		xlog("L_DBG", "LB_SELECT: Alternate LB for failover: $avp(alt_lb_uri)\n");
	}
	
	if ($var(lb_switched) == 1) {
		xlog("L_INFO", "LB_SELECT: Routing via LB (after failover): $du\n");
	} else {
		xlog("L_INFO", "LB_SELECT: Routing via LB: $du\n");
	}
#!else
	# htable not enabled - route directly to CM
	$du = "sip:" + $avp(cm_ip) + ":" + $avp(cm_port)
		+ ";transport=" + $avp(cm_proto);
	xlog("L_INFO", "LB_SELECT: htable not enabled, routing direct to CM: $du\n");
#!endif
	
	return;
}

# ============================================================================
# ADD_CM_TERM_ROUTES - Add Route headers for CM termination sequencing
# ============================================================================
# Call after route(LB_SELECT_DESTINATION). Appends:
#   - CM route with phase=imsterm
#   - LB route (if LB selected) for return path
#   - Kamailio return route with phase=termdone
#   - P-Charging-Vector if not present
# ============================================================================
route[ADD_CM_TERM_ROUTES] {
	$var(cm_route) = "<sip:" + $avp(cm_ip) + ":" + $avp(cm_port)
		+ ";transport=" + $avp(cm_proto) + ";lr;phase=imsterm>";
	append_hf("Route: $var(cm_route)\r\n");
	if ($avp(selected_lb_ip) != $null) {
		if (!strempty($avp(lb_cluster_fqdn))) {
			$var(lb_route) = "<sip:" + $avp(lb_cluster_fqdn) + ":" + $avp(lb_cluster_port)
				+ ";transport=" + $avp(lb_cluster_transport) + ";lr>";
			xlog("L_INFO", "INVITE_SEQ: LB Route (FQDN): $var(lb_route)\n");
		} else {
			$var(lb_route) = "<sip:" + $avp(selected_lb_ip) + ":" + $avp(selected_lb_port)
				+ ";transport=" + $avp(selected_lb_proto) + ";lr>";
			xlog("L_INFO", "INVITE_SEQ: LB Route (IP): $var(lb_route)\n");
		}
		append_hf("Route: $var(lb_route)\r\n");
	}
	if (!strempty($avp(ha_fqdn))) {
		$var(return_route) = "<sip:" + $avp(ha_fqdn) + ":" + $sel(cfg_get.ha.srv_port)
			+ ";transport=" + $sel(cfg_get.ha.srv_transport) + ";lr;phase=termdone>";
	} else {
		$var(return_route) = "<sip:" + $Ri + ":" + $Rp + ";transport="
			+ $avp(cm_proto) + ";lr;phase=termdone>";
	}
	append_hf("Route: $var(return_route)\r\n");
	if ($hdr(P-Charging-Vector) == $null) {
		$var(pcv) = "icid-value=\"" + $uuid(g) + "\";icid-generated-at=" + $Ri;
		append_hf("P-Charging-Vector: $var(pcv)\r\n");
		xlog("L_INFO", "INVITE_SEQ: Generated P-Charging-Vector: $var(pcv)\n");
	} else {
		xlog("L_INFO", "INVITE_SEQ: Using existing P-Charging-Vector: $hdr(P-Charging-Vector)\n");
	}
	xlog("L_INFO", "INVITE_SEQ: CM Route: $var(cm_route)\n");
	xlog("L_INFO", "INVITE_SEQ: Return Route: $var(return_route)\n");
	return;
}

# ============================================================================
# ADD_CM_ORIG_ROUTES - Add Route headers for CM origination sequencing
# ============================================================================
# Call after route(LB_SELECT_DESTINATION). Appends:
#   - CM route with phase=imsorig
#   - LB route (if LB selected) for return path
#   - Kamailio return route with phase=origdone
#   - P-Asserted-Identity (caller AOR)
#   - P-Charging-Vector if not present
# ============================================================================
route[ADD_CM_ORIG_ROUTES] {
	$var(cm_route) = "<sip:" + $avp(cm_ip) + ":" + $avp(cm_port)
		+ ";transport=" + $avp(cm_proto) + ";lr;phase=imsorig>";
	append_hf("Route: $var(cm_route)\r\n");
	if ($avp(selected_lb_ip) != $null) {
		if (!strempty($avp(lb_cluster_fqdn))) {
			$var(lb_route) = "<sip:" + $avp(lb_cluster_fqdn) + ":" + $avp(lb_cluster_port)
				+ ";transport=" + $avp(lb_cluster_transport) + ";lr>";
			xlog("L_INFO", "INVITE_SEQ: LB Route (FQDN): $var(lb_route)\n");
		} else {
			$var(lb_route) = "<sip:" + $avp(selected_lb_ip) + ":" + $avp(selected_lb_port)
				+ ";transport=" + $avp(selected_lb_proto) + ";lr>";
			xlog("L_INFO", "INVITE_SEQ: LB Route (IP): $var(lb_route)\n");
		}
		append_hf("Route: $var(lb_route)\r\n");
	}
	if (!strempty($avp(ha_fqdn))) {
		$var(return_route) = "<sip:" + $avp(ha_fqdn) + ":" + $sel(cfg_get.ha.srv_port)
			+ ";transport=" + $sel(cfg_get.ha.srv_transport) + ";lr;phase=origdone>";
	} else {
		$var(return_route) = "<sip:" + $Ri + ":" + $Rp + ";transport="
			+ $avp(cm_proto) + ";lr;phase=origdone>";
	}
	append_hf("Route: $var(return_route)\r\n");
	remove_hf("P-Asserted-Identity");
	append_hf("P-Asserted-Identity: <$fu>\r\n");
	if ($hdr(P-Charging-Vector) == $null) {
		$var(pcv) = "icid-value=\"" + $uuid(g) + "\";icid-generated-at=" + $Ri;
		append_hf("P-Charging-Vector: $var(pcv)\r\n");
		xlog("L_INFO", "INVITE_SEQ: Generated P-Charging-Vector: $var(pcv)\n");
	} else {
		xlog("L_INFO", "INVITE_SEQ: Using existing P-Charging-Vector: $hdr(P-Charging-Vector)\n");
	}
	xlog("L_INFO", "INVITE_SEQ: Added origination Route headers\n");
	xlog("L_INFO", "INVITE_SEQ: CM Route: $var(cm_route)\n");
	xlog("L_INFO", "INVITE_SEQ: Return Route: $var(return_route)\n");
	xlog("L_INFO", "INVITE_SEQ: P-Asserted-Identity: $fu\n");
	return;
}

# Dialplan-based routing when R-URI does not reference a known subscriber
# Match R-URI user part (digits) against dialplan dpid 1; attrs = destination URI ($avp(dialplan_dest))
# No match -> 404 Not Found
#!ifdef WITH_DIALPLAN
#!ifdef WITH_MYSQL
route[DIALPLAN_ROUTE] {
	if (!dp_match("1", "$rU")) {
		xlog("L_INFO", "DIALPLAN_ROUTE: No dialplan match for R-URI user=$rU - sending 404\n");
		sl_send_reply("404", "Not Found");
		exit;
	}
	if (strempty($avp(dialplan_dest))) {
		xlog("L_WARN", "DIALPLAN_ROUTE: Match for $rU but attrs (destination) empty - sending 404\n");
		sl_send_reply("404", "Not Found");
		exit;
	}
	$du = $avp(dialplan_dest);
	xlog("L_INFO", "DIALPLAN_ROUTE: R-URI $rU matched dialplan -> $du\n");
	route(HA_RECORD_ROUTE);
	setflag(FLT_ACC);
	route(RELAY);
	exit;
}
#!endif
#!endif

# Termination sequencing for INVITEs when destination is a known subscriber but caller is not
# from local (e.g. CM-originated or external caller to our subscriber). Same logic as the
# CM-originated block: shortcut to contact resolution or full term sequencing to CM.
#!ifdef WITH_CM
route[INVITE_TERMINATION_SEQ] {
	# Check if Accept-Contact header contains avaya-cm-term-reaction=shortcut
	$var(skip_term_seq) = 0;
	if ($hdr(Accept-Contact) != $null) {
		$var(ac_term_reaction) = $(hdr(Accept-Contact){param.value,avaya-cm-term-reaction});
		if ($var(ac_term_reaction) == "shortcut") {
			xlog("L_INFO", "INVITE_TERMINATION_SEQ: Accept-Contact has avaya-cm-term-reaction=shortcut, skipping termination sequencing\n");
			$var(skip_term_seq) = 1;
		}
	}
	
	if ($var(skip_term_seq) == 1) {
		xlog("L_INFO", "INVITE_TERMINATION_SEQ: Shortcut - proceeding to contact resolution\n");
		remove_hf("Route");
		dlg_manage();
		$dlg_var(leg_type) = "termination";
		$dlg_var(orig_caller) = $fU;
		$dlg_var(orig_callee) = $tU;
		if ($avp(incoming_lb) > 0) {
			$dlg_var(source_lb) = $avp(incoming_lb);
		}
		$avp(oexten) = $rU;
		$var(location_found) = 0;
		if (lookup("location")) {
			$var(location_found) = 1;
		} else {
			$var(rc) = $rc;
		}
#!ifdef WITH_PUSH_NOTIFICATIONS
		route(PUSH_CHECK_AND_RINGING);
#!else
		if ($var(location_found) == 0) {
			sl_send_reply("404", "Not Found");
			exit;
		}
#!endif
#!ifdef WITH_HTABLE
		route(LB_GET_FIRST);
		if ($avp(selected_lb_ip) != $null) {
			route(LB_SELECT_DESTINATION);
			if (!strempty($avp(alt_lb_uri))) { t_on_failure("LB_FAILOVER"); }
		} else {
			route(SET_ENDPOINT_DESTINATION);
		}
#!else
		route(SET_ENDPOINT_DESTINATION);
#!endif
		route(HA_RECORD_ROUTE);
		setflag(FLT_ACC);
		setflag(FLT_ACCMISSED);
		route(RELAY);
		exit;
	}
	
	# Normal termination sequencing to CM
	xlog("L_INFO", "INVITE_TERMINATION_SEQ: Starting termination sequencing to CM\n");
	remove_hf("Route");
	route(LB_SELECT_DESTINATION);
	route(ADD_CM_TERM_ROUTES);
	if (!strempty($avp(alt_lb_uri))) { t_on_failure("LB_FAILOVER"); }
	dlg_manage();
	route(HA_RECORD_ROUTE);
	$dlg_var(leg_type) = "termination";
	$dlg_var(orig_caller) = $fU;
	$dlg_var(orig_callee) = $tU;
	if ($avp(incoming_lb) > 0) {
		$dlg_var(source_lb) = $avp(incoming_lb);
	}
	setflag(FLT_ACC);
	route(RELAY);
	exit;
}
#!endif

# INVITE Sequencing through CM
# Handles origination and termination sequencing phases
# If LB is configured, routes via LB with Route headers for proper path back
route[INVITE_SEQUENCING] {
#!ifdef WITH_CM
	xlog("L_INFO", "INVITE_SEQ: Entered, Route=$hdr(Route), From=$fu, To=$tu, R-URI=$ru\n");

	# Check if CM is configured
	if (strempty($avp(cm_ip))) {
		xlog("L_WARN", "INVITE_SEQ: CM not configured (cm_ip AVP is empty), skipping sequencing\n");
		xlog("L_WARN", "INVITE_SEQ: Ensure av_esc_load_config() was called and database has cm_server_ip configured\n");
		xlog("L_WARN", "INVITE_SEQ: Check: SELECT config_value FROM av_sip_config WHERE config_key='cm_server_ip'\n");
		return;
	}
	
	xlog("L_DBG", "INVITE_SEQ: CM config loaded - cm_ip=$avp(cm_ip), cm_port=$avp(cm_port), cm_proto=$avp(cm_proto)\n");

	# Check if this INVITE has a Route header with our sequencing phase
	# The Route header format: <sip:IP:PORT;transport=PROTO;lr;phase=PHASE>
	# Extract phase parameter in two steps (Kamailio doesn't support chained transformations)
	# Step 1: Extract URI from Route header name-addr format
	$var(route_uri) = $(hdr(Route){nameaddr.uri});
	# Step 2: Extract phase parameter from the URI
	$var(route_phase) = $(var(route_uri){uri.param,phase});
	
	if ($var(route_phase) == "origdone") {
		# Origination sequencing complete; R-URI is the destination
		# If destination is not a known subscriber (in subscriber table), use dialplan or 404
#!ifdef WITH_USRLOCDB
		route(IS_RURI_SUBSCRIBER);
		if ($var(is_ruri_subscriber) != 1) {
			xlog("L_INFO", "INVITE_SEQ: Phase origdone - R-URI $rU@$rd not a subscriber\n");
#!ifdef WITH_DIALPLAN
			route(DIALPLAN_ROUTE);
			exit;
#!else
			sl_send_reply("404", "Not Found");
			exit;
#!endif
		}
#!else
		if (!is_domain_local("$rd")) {
			xlog("L_INFO", "INVITE_SEQ: Phase origdone - R-URI domain $rd not local\n");
#!ifdef WITH_DIALPLAN
			route(DIALPLAN_ROUTE);
			exit;
#!else
			sl_send_reply("404", "Not Found");
			exit;
#!endif
		}
#!endif
		# Check if Accept-Contact header contains avaya-cm-term-reaction=shortcut
		# If so, skip termination sequencing and go directly to contact resolution
		$var(skip_term_seq) = 0;
		if ($hdr(Accept-Contact) != $null) {
			$var(ac_term_reaction) = $(hdr(Accept-Contact){param.value,avaya-cm-term-reaction});
			if ($var(ac_term_reaction) == "shortcut") {
				xlog("L_INFO", "INVITE_SEQ: Phase origdone - Accept-Contact has avaya-cm-term-reaction=shortcut, skipping termination sequencing\n");
				$var(skip_term_seq) = 1;
			}
		}
		
		if ($var(skip_term_seq) == 1) {
			# Skip termination sequencing - go directly to contact resolution
			xlog("L_INFO", "INVITE_SEQ: Phase origdone - shortcut mode, proceeding to contact resolution\n");
			
			# Remove the consumed Route header (pointing to us with phase=origdone)
			remove_hf("Route");
			
			# Proceed with contact resolution (same logic as termdone)
			# Dialog tracking for TERMINATION leg
			if (is_known_dlg()) {
				xlog("L_INFO", "INVITE_SEQ: TERMINATION (shortcut) - Dialog already exists (CM proxy mode), Call-ID=$ci\n");
				$dlg_var(leg_type) = "end-to-end";
				$dlg_var(term_caller) = $fU;
				$dlg_var(term_callee) = $tU;
				# Ensure source LB is stored (may not be set if dialog was created before this feature)
				if (strempty($dlg_var(source_lb)) && $avp(incoming_lb) > 0) {
					$dlg_var(source_lb) = $avp(incoming_lb);
					xlog("L_INFO", "INVITE_SEQ: TERMINATION (shortcut) - Stored source LB preference: $dlg_var(source_lb)\n");
				}
				xlog("L_INFO", "INVITE_SEQ: TERMINATION (shortcut) - Updated existing dialog for end-to-end call\n");
			} else {
				xlog("L_INFO", "INVITE_SEQ: TERMINATION (shortcut) - New dialog (CM B2BUA mode), Call-ID=$ci\n");
				dlg_manage();
				$dlg_var(leg_type) = "termination";
				$dlg_var(term_caller) = $fU;
				$dlg_var(term_callee) = $tU;
				# Store source LB preference for consistent routing throughout dialog
				if ($avp(incoming_lb) > 0) {
					$dlg_var(source_lb) = $avp(incoming_lb);
					xlog("L_INFO", "INVITE_SEQ: TERMINATION (shortcut) - Stored source LB preference: $dlg_var(source_lb)\n");
				}
				xlog("L_INFO", "INVITE_SEQ: TERMINATION (shortcut) - New dialog created, Call-ID=$ci, From-Tag=$ft\n");
			}
			
			# Do location lookup to find registered contact(s)
			$avp(oexten) = $rU;
			$var(location_found) = 0;
			if (lookup("location")) {
				$var(location_found) = 1;
				xlog("L_INFO", "INVITE_SEQ: Location lookup successful (shortcut), contact=$ru\n");
			} else {
				$var(rc) = $rc;
				xlog("L_INFO", "INVITE_SEQ: Location lookup failed (shortcut) for $rU, rc=$var(rc)\n");
			}
			
#!ifdef WITH_PUSH_NOTIFICATIONS
			# Use consolidated push notification check
			route(PUSH_CHECK_AND_RINGING);
#!else
			if ($var(location_found) == 0) {
				xlog("L_ERR", "INVITE_SEQ: No contacts found (shortcut) (rc=$var(rc)) - sending 404\n");
				sl_send_reply("404", "Not Found");
				exit;
			}
#!endif
			
			# Route via LB if any discovered LBs available
#!ifdef WITH_HTABLE
			route(LB_GET_FIRST);
			if ($avp(selected_lb_ip) != $null) {
				route(LB_SELECT_DESTINATION);
				xlog("L_INFO", "INVITE_SEQ: Routing to endpoint via LB (shortcut), du=$du, R-URI=$ru\n");
				# Enable LB failover
				if (!strempty($avp(alt_lb_uri))) {
					t_on_failure("LB_FAILOVER");
				}
			} else {
				# No LBs - set destination explicitly to preserve transport
				route(SET_ENDPOINT_DESTINATION);
				xlog("L_INFO", "INVITE_SEQ: No LBs discovered, routing directly to endpoint (shortcut) via $du\n");
			}
#!else
			# No htable - set destination explicitly to preserve transport
			route(SET_ENDPOINT_DESTINATION);
			xlog("L_INFO", "INVITE_SEQ: htable not enabled, routing directly to endpoint (shortcut) via $du\n");
#!endif
			
			# Record-route for dialog
			route(HA_RECORD_ROUTE);
			
			# Set accounting flags
			setflag(FLT_ACC);
			setflag(FLT_ACCMISSED);
			
			route(RELAY);
			exit;
		}
		
		# Normal termination sequencing flow
		xlog("L_INFO", "INVITE_SEQ: Phase origdone - starting termination sequencing\n");
		
		# Log P-Charging-Vector (should be preserved from origination)
		if ($hdr(P-Charging-Vector) != $null) {
			xlog("L_INFO", "INVITE_SEQ: P-Charging-Vector preserved: $hdr(P-Charging-Vector)\n");
		} else {
			xlog("L_WARN", "INVITE_SEQ: P-Charging-Vector missing in origdone phase\n");
		}
		
		# Remove the consumed Route header (pointing to us with phase=origdone)
		remove_hf("Route");
		
		# Set destination using source-aware LB selection FIRST
		# This sets $var(source_lb) which we need for Route headers
		route(LB_SELECT_DESTINATION);
		xlog("L_INFO", "INVITE_SEQ: Routing termination via $du, source_lb=$var(source_lb)\n");
		
		route(ADD_CM_TERM_ROUTES);
		xlog("L_INFO", "INVITE_SEQ: Added termination Route headers, R-URI=$ru\n");
		
		# Enable LB failover for this request
		if (!strempty($avp(alt_lb_uri))) {
			t_on_failure("LB_FAILOVER");
		}
		
		# Record-route for dialog
		# Uses cluster FQDN for HA failover if configured
		route(HA_RECORD_ROUTE);
		
		# Set accounting flag
		setflag(FLT_ACC);
		
		route(RELAY);
		exit;
	}
	else if ($var(route_phase) == "termdone") {
		# Termination sequencing complete, do normal location lookup
		xlog("L_INFO", "INVITE_SEQ: Phase termdone - sequencing complete, doing location lookup\n");
		
		# Remove the consumed Route header (pointing to us with phase=termdone)
		remove_hf("Route");
		
		# Dialog tracking for TERMINATION leg
		# CM can behave in two ways:
		#   1. B2BUA mode: Creates NEW Call-ID for termination leg (two separate dialogs)
		#   2. Proxy mode: Preserves Call-ID from origination leg (one dialog)
		# We check if dialog already exists to handle both cases correctly
		
		if (is_known_dlg()) {
			# Dialog already exists - CM is proxying (same Call-ID as origination)
			# This is a single end-to-end dialog: Caller <-> Kamailio <-> Callee
			# Just update dialog variables to mark this as a full end-to-end call
			xlog("L_INFO", "INVITE_SEQ: TERMINATION - Dialog already exists (CM proxy mode), Call-ID=$ci\n");
			
			# Update leg type to indicate this is a complete end-to-end dialog
			$dlg_var(leg_type) = "end-to-end";
			$dlg_var(term_caller) = $fU;
			$dlg_var(term_callee) = $tU;
			
			# Ensure source LB is stored (may not be set if dialog was created before this feature)
			if (strempty($dlg_var(source_lb)) && $avp(incoming_lb) > 0) {
				$dlg_var(source_lb) = $avp(incoming_lb);
				xlog("L_INFO", "INVITE_SEQ: TERMINATION - Stored source LB preference: $dlg_var(source_lb)\n");
			}
			
			xlog("L_INFO", "INVITE_SEQ: TERMINATION - Updated existing dialog for end-to-end call\n");
		} else {
			# Dialog doesn't exist - CM is B2BUA (new Call-ID)
			# Create new dialog for: CM <-> Kamailio <-> Callee
			xlog("L_INFO", "INVITE_SEQ: TERMINATION - New dialog (CM B2BUA mode), Call-ID=$ci\n");
			dlg_manage();
			
			# Store leg type for HA failover identification
			$dlg_var(leg_type) = "termination";
			$dlg_var(term_caller) = $fU;
			$dlg_var(term_callee) = $tU;
			
			# Store source LB preference for consistent routing throughout dialog
			if ($avp(incoming_lb) > 0) {
				$dlg_var(source_lb) = $avp(incoming_lb);
				xlog("L_INFO", "INVITE_SEQ: TERMINATION - Stored source LB preference: $dlg_var(source_lb)\n");
			}
			
			xlog("L_INFO", "INVITE_SEQ: TERMINATION - New dialog created, Call-ID=$ci, From-Tag=$ft\n");
		}
		
		# Do location lookup to find registered contact(s)
		$avp(oexten) = $rU;
		$var(location_found) = 0;
		if (lookup("location")) {
			$var(location_found) = 1;
			xlog("L_INFO", "INVITE_SEQ: Location lookup successful, contact=$ru\n");
		} else {
			$var(rc) = $rc;
			xlog("L_INFO", "INVITE_SEQ: Location lookup failed for $rU, rc=$var(rc)\n");
		}
		
#!ifdef WITH_PUSH_NOTIFICATIONS
		# Use consolidated push notification check
		route(PUSH_CHECK_AND_RINGING);
		# If we get here, contacts exist - continue to LB routing
#!else
		if ($var(location_found) == 0) {
			# No contacts found (push notifications not enabled)
			xlog("L_ERR", "INVITE_SEQ: No contacts found (rc=$var(rc)) - sending 404\n");
			sl_send_reply("404", "Not Found");
			exit;
		}
#!endif
		
		# Route via LB if any discovered LBs available
#!ifdef WITH_HTABLE
		route(LB_GET_FIRST);
		if ($avp(selected_lb_ip) != $null) {
			route(LB_SELECT_DESTINATION);
			xlog("L_INFO", "INVITE_SEQ: Routing to endpoint via LB, du=$du, R-URI=$ru\n");
			# Enable LB failover
			if (!strempty($avp(alt_lb_uri))) {
				t_on_failure("LB_FAILOVER");
			}
		} else {
			# No LBs - set destination explicitly to preserve transport
			route(SET_ENDPOINT_DESTINATION);
			xlog("L_INFO", "INVITE_SEQ: No LBs discovered, routing directly to endpoint via $du\n");
		}
#!else
		# No htable - set destination explicitly to preserve transport
		route(SET_ENDPOINT_DESTINATION);
		xlog("L_INFO", "INVITE_SEQ: htable not enabled, routing directly to endpoint via $du\n");
#!endif
		
		# Record-route for dialog
		# Uses cluster FQDN for HA failover if configured
		route(HA_RECORD_ROUTE);
		
		# Set accounting flags
		setflag(FLT_ACC);
		setflag(FLT_ACCMISSED);
		
		route(RELAY);
		exit;
	}
	else if ($var(route_phase) == "imsorig" || $var(route_phase) == "imsterm") {
		# This shouldn't happen - these phases are for CM, not for us
		# But if we receive them, just loose_route and forward
		xlog("L_WARN", "INVITE_SEQ: Received unexpected phase in Route header\n");
		if (loose_route()) {
			route(RELAY);
			exit;
		}
		return;
	}
	else {
		# No sequencing phase in Route header
		# This could be either:
		#   1. New INVITE from a client (needs origination sequencing)
		#   2. CM-originated INVITE (e.g., click-to-dial, transfer) - needs termination sequencing
		
		# Note: $avp(is_cm_source) was set earlier in request_route by IS_FROM_CM
		if ($avp(is_cm_source) == 1) {
			# CM-originated INVITE - route for termination sequencing
			# CM is trusted, no auth required
			# R-URI must reference a known subscriber (subscriber table); else dialplan or 404
#!ifdef WITH_USRLOCDB
			route(IS_RURI_SUBSCRIBER);
			if ($var(is_ruri_subscriber) != 1) {
				xlog("L_INFO", "INVITE_SEQ: CM-originated - R-URI $rU@$rd not a subscriber\n");
#!ifdef WITH_DIALPLAN
				route(DIALPLAN_ROUTE);
				exit;
#!else
				sl_send_reply("404", "Not Found");
				exit;
#!endif
			}
#!else
			if (!is_domain_local("$rd")) {
#!ifdef WITH_DIALPLAN
				route(DIALPLAN_ROUTE);
				exit;
#!else
				sl_send_reply("404", "Not Found");
				exit;
#!endif
			}
#!endif
			route(INVITE_TERMINATION_SEQ);
			exit;
		}
		
#!ifdef WITH_TRUNK
		# Trunk-originated INVITE: never use origination sequencing; use termination only when R-URI is a known subscriber
		if ($avp(from_trunk) == 1) {
			# R-URI must be a known subscriber (subscriber table) or local domain; else dialplan or 404
#!ifdef WITH_USRLOCDB
			route(IS_RURI_SUBSCRIBER);
			if ($var(is_ruri_subscriber) != 1) {
				xlog("L_INFO", "INVITE_SEQ: Trunk-originated - R-URI $rU@$rd not a subscriber\n");
#!ifdef WITH_DIALPLAN
				route(DIALPLAN_ROUTE);
				exit;
#!else
				sl_send_reply("404", "Not Found");
				exit;
#!endif
			}
#!else
			if (!is_domain_local("$rd")) {
				xlog("L_INFO", "INVITE_SEQ: Trunk-originated - R-URI domain $rd not local\n");
#!ifdef WITH_DIALPLAN
				route(DIALPLAN_ROUTE);
				exit;
#!else
				sl_send_reply("404", "Not Found");
				exit;
#!endif
			}
#!endif
			# Check if subscriber has a registered contact (no branch creation; registered() does not modify R-URI)
			$avp(oexten) = $rU;
			if (!registered("location")) {
#!ifdef WITH_DIALPLAN
				xlog("L_INFO", "INVITE_SEQ: Trunk-originated INVITE - R-URI $rU@$rd not registered, using dialplan\n");
				route(DIALPLAN_ROUTE);
				exit;
#!else
				xlog("L_INFO", "INVITE_SEQ: Trunk-originated INVITE - R-URI $rU@$rd not registered - sending 404 (dialplan not enabled)\n");
				sl_send_reply("404", "Not Found");
				exit;
#!endif
			}
			xlog("L_INFO", "INVITE_SEQ: Trunk-originated INVITE to known user $rU - starting termination sequencing (phase=imsterm)\n");
			
			remove_hf("Route");
			route(LB_SELECT_DESTINATION);
			xlog("L_INFO", "INVITE_SEQ: Routing trunk-originated INVITE via $du, source_lb=$var(source_lb)\n");
			
			route(ADD_CM_TERM_ROUTES);
			
			if (!strempty($avp(alt_lb_uri))) {
				t_on_failure("LB_FAILOVER");
			}
			
			xlog("L_INFO", "INVITE_SEQ: TRUNK-TERMINATED - Creating dialog, Call-ID=$ci\n");
			dlg_manage();
			route(HA_RECORD_ROUTE);
			$dlg_var(leg_type) = "trunk-terminated";
			$dlg_var(orig_caller) = $fU;
			$dlg_var(orig_callee) = $tU;
			if ($avp(incoming_lb) > 0) {
				$dlg_var(source_lb) = $avp(incoming_lb);
				xlog("L_INFO", "INVITE_SEQ: TRUNK-TERMINATED - Stored source LB preference: $dlg_var(source_lb)\n");
			}
			setflag(FLT_ACC);
			route(RELAY);
			exit;
		}
#!endif
		
		# Check if the caller is from our domain (domain table)
		route(IS_FROM_LOCAL);
		if ($var(is_from_local) != 1) {
			# Caller not from local - check if destination (R-URI) is a known subscriber
#!ifdef WITH_USRLOCDB
			route(IS_RURI_SUBSCRIBER);
			if ($var(is_ruri_subscriber) != 1) {
				xlog("L_INFO", "INVITE_SEQ: Caller not local and R-URI $rU@$rd not a subscriber\n");
#!ifdef WITH_DIALPLAN
				route(DIALPLAN_ROUTE);
				exit;
#!else
				sl_send_reply("404", "Not Found");
				exit;
#!endif
			}
#!else
			if (!is_domain_local("$rd")) {
#!ifdef WITH_DIALPLAN
				route(DIALPLAN_ROUTE);
				exit;
#!else
				sl_send_reply("404", "Not Found");
				exit;
#!endif
			}
#!endif
			# Destination is subscriber - do termination sequencing (same as CM-originated)
			xlog("L_INFO", "INVITE_SEQ: Caller not local but destination $rU@$rd is subscriber - termination sequencing\n");
			route(INVITE_TERMINATION_SEQ);
			exit;
		}
		
		xlog("L_INFO", "INVITE_SEQ: New INVITE from $fu to $ru - starting origination sequencing\n");
		
		# Remove any preloaded Route headers
		remove_hf("Route");
		
		# Set destination using source-aware LB selection FIRST
		# This sets $var(source_lb) which we need for Route headers
		route(LB_SELECT_DESTINATION);
		xlog("L_INFO", "INVITE_SEQ: Routing origination via $du, source_lb=$var(source_lb)\n");
		
		route(ADD_CM_ORIG_ROUTES);
		
		# Enable LB failover for this request
		if (!strempty($avp(alt_lb_uri))) {
			t_on_failure("LB_FAILOVER");
		}
		
		# Check if this is an off-hook notification INVITE (not a real call)
		# Off-hook INVITEs have avaya-cm-fnu=off-hook in the R-URI
		# These get 484 response and should NOT create a dialog
		# The real call INVITE comes later with the same Call-ID
		# Use uri.param transformation for efficient parameter extraction
		if ($(ru{uri.param,avaya-cm-fnu}) == "off-hook") {
			xlog("L_INFO", "INVITE_SEQ: ORIGINATION - Off-hook notification INVITE, skipping dialog creation\n");
			# Still add Record-Route for proper routing
			route(HA_RECORD_ROUTE);
		} else {
			# Initialize dialog tracking for ORIGINATION leg
			# This MUST happen BEFORE record_route_preset() so dialog module can add its RR param
			#
			# Dialog tracking behavior depends on CM mode:
			#   - If CM acts as B2BUA: This tracks Caller <-> Kamailio <-> CM dialog
			#     A separate dialog will be created for the termination leg (new Call-ID)
			#   - If CM acts as Proxy: This tracks the FULL end-to-end dialog
			#     Caller <-> Kamailio <-> CM <-> Kamailio <-> Callee (same Call-ID throughout)
			#     The termdone phase will detect this and update vars instead of creating new dialog
			#
			xlog("L_INFO", "INVITE_SEQ: ORIGINATION - About to call dlg_manage(), Call-ID=$ci\n");
			dlg_manage();
			xlog("L_INFO", "INVITE_SEQ: ORIGINATION - dlg_manage() completed\n");
			
			# NOW add HA Record-Route - dialog module already added its RR with ;did= param
			# Uses cluster FQDN for HA failover if configured
			route(HA_RECORD_ROUTE);
			
			# Store leg type for HA failover identification
			# Will be updated to "end-to-end" in termdone phase if CM is in proxy mode
			$dlg_var(leg_type) = "origination";
			$dlg_var(orig_caller) = $fU;
			$dlg_var(orig_callee) = $tU;
			
			# Store source LB preference for consistent routing throughout dialog
			if ($avp(incoming_lb) > 0) {
				$dlg_var(source_lb) = $avp(incoming_lb);
				xlog("L_INFO", "INVITE_SEQ: ORIGINATION - Stored source LB preference: $dlg_var(source_lb)\n");
			}
			
			xlog("L_INFO", "INVITE_SEQ: ORIGINATION dialog created - Call-ID=$ci, From-Tag=$ft, To=$tu\n");
		}
		
		# Set accounting flag
		setflag(FLT_ACC);
		
		route(RELAY);
		exit;
	}
#!endif
	return;
}

# Routing to voicemail server
route[TOVOICEMAIL] {
#!ifdef WITH_VOICEMAIL
	if(!is_method("INVITE|SUBSCRIBE")) return;

	# check if VoiceMail server IP is defined
	if (strempty($sel(cfg_get.voicemail.srv_ip))) {
		xlog("SCRIPT: VoiceMail routing enabled but IP not defined\n");
		return;
	}
	if(is_method("INVITE")) {
		if($avp(oexten)==$null) return;

		$ru = "sip:" + $avp(oexten) + "@" + $sel(cfg_get.voicemail.srv_ip)
				+ ":" + $sel(cfg_get.voicemail.srv_port);
	} else {
		if($rU==$null) return;

		$ru = "sip:" + $rU + "@" + $sel(cfg_get.voicemail.srv_ip)
				+ ":" + $sel(cfg_get.voicemail.srv_port);
	}
	route(RELAY);
	exit;
#!endif

	return;
}


# Manage outgoing branches
branch_route[MANAGE_BRANCH] {
	xdbg("new branch [$T_branch_idx] to $ru\n");
	route(NATMANAGE);
	return;
}

# Manage incoming replies
reply_route {
	if(!sanity_check("17604", "6")) {
		xlog("Malformed SIP response from $si:$sp\n");
		drop;
	}
	return;
}

# Manage incoming replies in transaction context
onreply_route[MANAGE_REPLY] {
	xdbg("incoming reply\n");
	if(status=~"[12][0-9][0-9]") {
		route(NATMANAGE);
	}
	return;
}

# Manage failure routing cases
failure_route[MANAGE_FAILURE] {
	route(NATMANAGE);

	if (t_is_canceled()) exit;

#!ifdef WITH_BLOCK3XX
	# block call redirect based on 3xx replies.
	if (t_check_status("3[0-9][0-9]")) {
		t_reply("404", "Not found");
		exit;
	}
#!endif

#!ifdef WITH_BLOCK401407
	# block call redirect based on 401, 407 replies.
	if (t_check_status("401|407")) {
		t_reply("404", "Not found");
		exit;
	}
#!endif

#!ifdef WITH_VOICEMAIL
	# serial forking
	# - route to voicemail on busy or no answer (timeout)
	if (t_check_status("486|408")) {
		$du = $null;
		route(TOVOICEMAIL);
		exit;
	}
#!endif
	return;
}

# ============================================================================
# In-Dialog LB Failover
# ============================================================================
# This failure route handles LB failover for in-dialog requests (BYE, re-INVITE,
# NOTIFY, etc.). If the source LB fails during request processing, we try to
# route through the alternate LB.
#
# Triggered when:
# - An in-dialog request was received from one LB
# - The request to that LB failed (timeout, 503, connection refused)
# - An alternate LB is configured in $avp(alt_lb_uri)
# ============================================================================
failure_route[INDIALOG_LB_FAILOVER] {
	if (t_is_canceled()) {
		exit;
	}
	
	# Check for transport/network failures that indicate LB is unreachable
	# - 408: Request Timeout
	# - 503: Service Unavailable
	# - 504: Server Timeout
	# - t_branch_timeout(): Transaction timed out
	# - !t_branch_replied(): No response received at all
	if (t_check_status("408|503|504") || t_branch_timeout() || !t_branch_replied()) {
		xlog("L_WARN", "INDIALOG_LB_FAILOVER: Source LB failed for $rm (Call-ID=$ci), status=$rs\n");
		
		if (!strempty($avp(alt_lb_uri))) {
			# Switch destination to alternate LB
			$du = $avp(alt_lb_uri);
			xlog("L_INFO", "INDIALOG_LB_FAILOVER: Retrying via alternate LB: $du\n");
			
			# Clear the alternate to prevent infinite loop
			$avp(alt_lb_uri) = $null;
			
			# Append branch to try alternate LB
			if (t_relay()) {
				xlog("L_INFO", "INDIALOG_LB_FAILOVER: Request relayed to alternate LB successfully\n");
				exit;
			}
			xlog("L_ERR", "INDIALOG_LB_FAILOVER: Failed to relay to alternate LB: $du\n");
		} else {
			xlog("L_ERR", "INDIALOG_LB_FAILOVER: No alternate LB available for failover\n");
		}
	}
	
	# For other failure cases (4xx, 5xx responses), let them propagate normally
	return;
}

# ============================================================================
# LB Failover for Initial Requests (INVITE, REGISTER, etc.)
# ============================================================================
# This failure route handles LB failover for initial requests when the
# preferred LB fails. It tries the alternate LB stored in $avp(alt_lb_uri).
#
# This is similar to INDIALOG_LB_FAILOVER but for initial requests that
# go through CM sequencing or other LB-routed paths.
# ============================================================================
failure_route[LB_FAILOVER] {
	if (t_is_canceled()) {
		exit;
	}
	
	# Check for transport/network failures that indicate LB is unreachable
	# - 408: Request Timeout (generated by Kamailio or remote)
	# - 503: Service Unavailable
	# - 504: Server Timeout  
	# - t_branch_timeout(): Transaction timed out (no response at all)
	# - !t_branch_replied(): No response received
	#
	# Note: When there's no response at all (LB completely down), Kamailio
	# may not generate a 408 internally - t_branch_timeout() catches this case
	if (t_check_status("408|503|504") || t_branch_timeout() || !t_branch_replied()) {
		xlog("L_WARN", "LB_FAILOVER: LB failed for $rm (Call-ID=$ci), timeout/no-reply detected\n");
		
		if (!strempty($avp(alt_lb_uri))) {
			# Switch destination to alternate LB
			$du = $avp(alt_lb_uri);
			xlog("L_INFO", "LB_FAILOVER: Retrying via alternate LB: $du\n");
			
			# Clear the alternate to prevent infinite loop on next failure
			$avp(alt_lb_uri) = $null;
			
			# Retry the request via alternate LB
			if (t_relay()) {
				xlog("L_INFO", "LB_FAILOVER: Request relayed to alternate LB successfully\n");
				exit;
			}
			xlog("L_ERR", "LB_FAILOVER: Failed to relay to alternate LB: $du\n");
		} else {
			xlog("L_ERR", "LB_FAILOVER: No alternate LB available for failover\n");
		}
	}
	
	# For other failure cases, fall through to MANAGE_FAILURE behavior
	route(NATMANAGE);
	
#!ifdef WITH_VOICEMAIL
	if (t_check_status("486|408")) {
		$du = $null;
		route(TOVOICEMAIL);
		exit;
	}
#!endif

	return;
}
