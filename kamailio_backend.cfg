#!ifdef WITH_CM
/* CM Server Configuration
 *
 * CM server settings are loaded dynamically from the av_sip_config database table
 * via the av_config module. The av_esc_load_config() function is called early in
 * request_route to populate AVPs ($avp(cm_ip), $avp(cm_port), $avp(cm_proto))
 * with the current database values.
 *
 * Database table: av_sip_config
 * Relevant entries: cm_server_ip, cm_server_port, cm_server_protocol
 *
 * The av_config module periodically reloads from the database (default: 60 seconds)
 * allowing configuration changes without server restart.
 */

/* Load Balancer Discovery (Dynamic)
 *
 * LB servers are NOT configured statically. Instead, they are discovered dynamically
 * from incoming SIP OPTIONS messages. When a load balancer sends OPTIONS to Kamailio
 * for health checking, Kamailio registers that LB in an in-memory hash table.
 *
 * Discovery mechanism:
 * - LBs send periodic OPTIONS to Kamailio for health checks
 * - route[LB_REGISTER] detects these and adds the LB to the "lbs" htable
 * - LB entries auto-expire after 10 seconds of no OPTIONS received
 * - The htable can hold multiple LBs (not limited to 2)
 *
 * Htable structure:
 *   $sht(lbs=>IP) = "port:protocol:timestamp"
 *   $sht(lb_idx=>N) = "IP" (index for iteration)
 *
 * Routes that use LB discovery:
 * - route[LB_REGISTER] - Registers LBs from OPTIONS
 * - route[DETECT_SOURCE_LB] - Checks if source is a known LB
 * - route[LB_SELECT_DESTINATION] - Selects LB for outbound routing
 * - route[LB_GET_FIRST] / route[LB_GET_ALT] - Retrieves LB addresses
 * - route[ADD_CM_TERM_ROUTES] - Appends Route headers for CM termination (phase=imsterm); call after LB_SELECT_DESTINATION
 * - route[ADD_CM_ORIG_ROUTES] - Appends Route headers for CM origination (phase=imsorig); call after LB_SELECT_DESTINATION
 */

/* ===========================================================================
 * HA FAILOVER CONFIGURATION FOR RECORD-ROUTE
 * ===========================================================================
 *
 * For SM behind LB architecture, Record-Route strategy:
 *
 * OPTION 1: Use pod-specific FQDN
 *   ha.srv_fqdn = "kamailio-sm-0.kamailio-backend-headless.cci.svc.cluster.local"
 *   - Mid-dialog requests route to the SAME SM that handled the initial request
 *   - If pod dies, in-dialog requests fail until pod is recreated
 *   - Use only if session affinity is required
 *
 * OPTION 2: Use headless service FQDN (RECOMMENDED)
 *   ha.srv_fqdn = "kamailio-backend-headless.cci.svc.cluster.local"
 *   - Mid-dialog requests can go to ANY SM pod via LB
 *   - LB can route to any available backend on pod failure
 *   - Requires db_mode for dialog/location state sharing
 *
 * For SM behind LB: Use headless service FQDN (Option 2)
 * This allows LB to route in-dialog requests to any available backend pod
 */
#!ifdef WITH_K8S
# K8s: Use headless service FQDN for Record-Route (enables LB failover)
# HEADLESS_FQDN is the backend cluster DNS: kamailio-backend-headless.cci.svc.cluster.local
# This allows LB to route in-dialog requests to any available backend pod
# NOTE: Using HEADLESS_FQDN_VALUE which is substituted via #!substdef from HEADLESS_FQDN env var
ha.srv_fqdn = "HEADLESS_FQDN_VALUE" desc "Headless service FQDN for Record-Route (LB failover)"
#!else
ha.srv_fqdn = "kamailio-sm.dr.avaya.com" desc "Cluster FQDN for Record-Route (empty = use local IP)"
#!endif
ha.srv_port = "5060" desc "Cluster SIP port for Record-Route"
ha.srv_transport = "tcp" desc "Cluster transport for Record-Route (tcp or tls)"

/* Load Balancer Cluster Configuration
 *
 * lb_cluster_fqdn - The DNS name for the load balancer cluster
 * This FQDN is used in Route headers when sequencing INVITEs to CM.
 * The CM uses this Route header to send responses back through the LB.
 *
 * If empty, the discovered LB IP address will be used instead.
 * 
 * This setting is loaded from the database at runtime:
 *   UPDATE av_sip_config SET config_value='lb-kamailio-sm.dr.avaya.com' 
 *          WHERE module='global' AND config_key='lb_cluster_fqdn';
 *
 * The value is loaded into $avp(lb_cluster_fqdn) at the start of each request.
 */
lb.cluster_fqdn = "" desc "LB cluster FQDN for Route headers (empty = use discovered LB IP)"
lb.cluster_port = "5060" desc "LB cluster SIP port"
lb.cluster_transport = "tcp" desc "LB cluster transport (tcp or tls)"

/* X-Forwarded-For Configuration
 *
 * Trusted LB IPs for X-Forwarded-For header processing are determined
 * dynamically based on discovered load balancers. LBs register themselves
 * by sending OPTIONS messages to Kamailio.
 *
 * The XFF_INIT route checks if the source IP is a known LB using the
 * "lbs" htable which is populated by route[LB_REGISTER].
 */

#!endif

/* ===========================================================================
 * AUTHORITATIVE DOMAIN CONFIGURATION
 * ===========================================================================
 *
 * Local (authoritative) domains are defined in the Kamailio 'domain' table.
 * The domain module (with register_myself=1) uses this table for uri==myself
 * and is_domain_local() checks. Routes IS_LOCAL_DOMAIN and IS_FROM_LOCAL use
 * the domain table to determine if REGISTER and other requests are handled locally.
 * This applies to both single-domain and multi-domain deployments.
 *
 * Add domains via SQL, then run: kamcmd domain.reload
 *   INSERT INTO domain (domain) VALUES ('sip.example.com');
 *   INSERT INTO domain (domain) VALUES ('example.com');
 */

