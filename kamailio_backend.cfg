/* ===========================================================================
 * LISTEN SOCKETS AND ADVERTISE ADDRESSES
 * ===========================================================================
 *
 * For Session Manager (SM) fronted by Kamailio Load Balancer (LB):
 *
 * ARCHITECTURE:
 *   External (SBC/CM) → LB (external IP) → SM pods (internal IPs)
 *
 * LISTEN ADDRESS:
 *   - SM listens on its own POD_IP (internal K8s IP)
 *   - This is where LB dispatcher sends traffic
 *
 * ADVERTISE ADDRESS:
 *   - For SM behind LB: Advertise the pod's own headless service FQDN
 *   - NOT the LB's external address (LB handles that)
 *   - This allows:
 *     a) SM-to-SM communication via headless DNS
 *     b) Proper Record-Route for HA failover within the cluster
 *     c) LB to route mid-dialog requests to the correct SM
 *
 * ALIAS:
 *   - Include the headless service FQDN so SM recognizes itself
 *   - Include the pod-specific FQDN for direct addressing
 *
 * RECORD-ROUTE STRATEGY:
 *   - SM adds Record-Route with headless service FQDN (cluster-wide)
 *   - This allows LB to route in-dialog requests to ANY available backend pod
 *   - Enables failover: if original pod dies, LB routes to surviving pod
 *   - Requires dialog state to be shared via database (db_mode)
 *
 * ===========================================================================
 */

/* listen sockets - if none set, Kamailio binds to all local IP addresses
 * - basic prototype (full prototype can be found in Wiki - Core Cookbook):
 *      listen=[proto]:[localip]:[lport] advertise [publicip]:[pport]
 * - it can be set many times to add more sockets to listen to */
#!ifdef WITH_K8S
# K8s: SM listens on POD_IP, advertises its own pod FQDN via headless service
# This is for internal cluster communication; LB handles external routing
#
# Required environment variables (set by kamailio-entrypoint.sh and StatefulSet):
#   POD_IP       - Pod's internal IP (from downward API)
#   POD_NAME     - Pod name e.g., kamailio-sm-0 (from downward API)
#   POD_FQDN     - Full pod FQDN e.g., kamailio-sm-0.kamailio-backend-headless.cci.svc.cluster.local
#                  (constructed by entrypoint script from POD_NAME + HEADLESS_SVC + POD_NAMESPACE)
#   HEADLESS_FQDN - Headless service FQDN for the backend cluster
#                   e.g., kamailio-backend-headless.cci.svc.cluster.local
#                   (constructed by entrypoint script from HEADLESS_SVC + POD_NAMESPACE)
#                   Used for Record-Route to allow LB to route to ANY backend pod
#   CLUSTER_FQDN - External cluster FQDN for LB (optional, from values.yaml)
#
#!defenv POD_IP
#!defenv POD_NAME
#!defenv POD_FQDN
#!defenv HEADLESS_FQDN
#!trydefenv CLUSTER_FQDN

# Substdef for HEADLESS_FQDN to enable substitution inside quoted strings
# This is needed because #!defenv creates a preprocessor define that doesn't
# expand inside quotes in cfg_define sections
#!substdef "!HEADLESS_FQDN_VALUE!HEADLESS_FQDN!g"

# Listen on pod IP, advertise pod's headless service FQDN
# This allows LB dispatcher to route to specific SM pods
listen=tcp:POD_IP:5060 advertise POD_FQDN:5060
listen=udp:POD_IP:5060 advertise POD_FQDN:5060

# HTTP REST API port (for av_esc peer communication and health checks)
listen=tcp:POD_IP:8080
#!endif

/* ===========================================================================
 * ALIAS CONFIGURATION
 * ===========================================================================
 *
 * Aliases define hostnames that Kamailio recognizes as "myself".
 * Essential for:
 *   - Route header processing (requests with Route: <sip:alias;lr>)
 *   - Determining if a request is for local processing vs forwarding
 *
 * For K8s SM behind LB:
 *   1. Pod's own headless FQDN (kamalio-backend-0.kamailio-backend-headless...)
 *   2. Headless service FQDN (kamailio-backend-headless.cci.svc.cluster.local)
 *   3. POD_IP (for direct IP-based routing from LB)
 */
#!ifdef WITH_K8S
# Pod-specific FQDN alias (matches advertise address)
# POD_FQDN is set by entrypoint script: kamalio-backend-0.kamailio-backend-headless.cci.svc.cluster.local
# NOTE: Auto-aliases are generated from listen/advertise, so we don't need to add POD_FQDN manually

# Alias the cluster FQDN from values.yaml (for Record-Route from LB)
# This allows SM to recognize requests routed via the LB's external address
# Use #!substdef to substitute before parsing so CLUSTER_FQDN is resolved
#!substdef "!ALIAS_CLUSTER_5060!CLUSTER_FQDN:5060!g"
#!substdef "!ALIAS_CLUSTER!CLUSTER_FQDN!g"
alias=ALIAS_CLUSTER_5060
alias=ALIAS_CLUSTER
#!endif

/* life time of TCP connection when there is no traffic
 * - a bit higher than registration expires to cope with UA behind NAT */
tcp_connection_lifetime=3605

/* upper limit for TCP connections (it includes the TLS connections) */
tcp_max_connections=2048

/* upper limit for TCP connections for one ip address - default 1024 */
#tcp_accept_iplimit=1024

#!ifdef WITH_JSONRPC
tcp_accept_no_cl=yes
#!endif

#!ifdef WITH_TLS
enable_tls=yes

/* upper limit for TLS connections */
tls_max_connections=2048

/* For OpenSSL 3 integration
 * functions calling libssl3 can be invoked in a transient thread
 * 0: disable threaded calls
 * 1: use thread executors for process #0 only
 * 2: no thread executors, but use atfork handler to reset thread-locals to NULL */
tls_threads_mode=2

#!endif

/* set it to yes to enable sctp and load sctp.so module */
enable_sctp=no

