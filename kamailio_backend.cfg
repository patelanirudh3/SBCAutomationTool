####### Routing Logic ########


/* Main SIP request routing logic
 * - processing of any incoming SIP request starts with this route
 * - note: this is the same as route { ... } */
request_route {

	# per request initial checks
	route(REQINIT);

	# Load dynamic CM/LB configuration from database into AVPs
	# This must be called early, before XFF_INIT which needs LB IPs for trust validation
	av_esc_load_config();
	
	# Load HA FQDN from environment variable (K8s) or config
	# This sets $avp(ha_fqdn) for use in Record-Route and Route headers
	route(LOAD_HA_FQDN);
	
	# Load LB cluster FQDN from database config
	# This sets $avp(lb_cluster_fqdn) for use in Route headers to CM
	route(LOAD_LB_FQDN);

	# Process X-Forwarded-For header from load balancer (if enabled)
	# Must be called after av_esc_load_config() to have LB IPs available
	route(XFF_INIT);

	# Detect which LB sent this request - stores in $avp(incoming_lb)
	# Must be after av_esc_load_config() and XFF_INIT
	route(DETECT_SOURCE_LB);

	# Handle OPTIONS from trusted sources via load balancer (SBC health checks)
	# Must be after XFF_INIT so we have the original source IP
	route(OPTIONS_HANDLER);

	# NAT detection
	route(NATDETECT);

#!ifdef WITH_CM
	# Detect if this request is from CM (works with direct and LB connections)
	route(IS_FROM_CM);
#!endif
#!ifdef WITH_TRUNK
	# Detect if request is from a known trunk IP (group 2 in address table)
	route(IS_FROM_TRUNK);
#!endif
#!ifdef WITH_CM
	# Handle NOTIFY from CM server using av_esc module
	if (is_method("NOTIFY") && $avp(is_cm_source) == 1) {
		xlog("L_INFO", "REQUEST_ROUTE: NOTIFY from CM server detected, using av_esc module\n");
		av_esc_handle_notify();
		exit;
	}
	
	# Handle PUBLISH from CM server using av_esc module
	if (is_method("PUBLISH") && $avp(is_cm_source) == 1) {
		xlog("L_INFO", "REQUEST_ROUTE: PUBLISH from CM server detected, using av_esc module\n");
		av_esc_handle_publish();
		exit;
	}
#!endif

	# CANCEL processing
	if (is_method("CANCEL")) {
		dlg_manage();
		if (t_check_trans()) {
			route(RELAY);
		}
		exit;
	}

	# handle retransmissions
	if (!is_method("ACK")) {
		if(t_precheck_trans()) {
			t_check_trans();
			exit;
		}
		t_check_trans();
	}

	# handle requests within SIP dialogs
	route(WITHINDLG);

	### only initial requests (no To tag)

#!ifdef WITH_CM
	# Check for INVITE sequencing BEFORE removing Route headers
	# This handles INVITEs returning from CM with phase parameter
	if (is_method("INVITE")) {
		route(INVITE_SEQUENCING);
		# If we return here, the INVITE was handled by sequencing
	}
#!endif

	# authentication
	route(AUTH);

	# record routing for dialog forming requests (in case they are routed)
	# - remove preloaded route headers
	remove_hf("Route");
	if (is_method("INVITE|SUBSCRIBE|REFER")) {
		# Record-route for dialog-forming requests
		# Uses cluster FQDN for HA failover if configured
		route(HA_RECORD_ROUTE);
	}

	# account only INVITEs
	if (is_method("INVITE")) {
		setflag(FLT_ACC); # do accounting
	}

#!ifdef WITH_PUSH_NOTIFICATIONS
	# Handle out-of-dialog NOTIFY for push notification activation
	# Client sends NOTIFY with Event: avaya-push-notification and JSON body
	# Content-Type: application/vnd.avaya.csa.pushnotificationactivationinfo.v2+json
	# Handled by av_pushnotification module
	if (is_method("NOTIFY") && $hdr(Event) == "avaya-push-notification") {
		xlog("L_INFO", "REQUEST_ROUTE: Push notification activation NOTIFY from $fu\n");
		if (av_push_handle_activation()) {
			xlog("L_INFO", "REQUEST_ROUTE: Push notification activation successful\n");
		} else {
			xlog("L_ERR", "REQUEST_ROUTE: Push notification activation failed\n");
		}
		exit;
	}
#!endif

	# dispatch requests to foreign domains
	route(SIPOUT);

	### requests for my local domains

	# handle presence related requests
	route(PRESENCE);

	# handle registrations
	route(REGISTRAR);

	if ($rU==$null) {
		# request with no Username in RURI
		sl_send_reply("484", "Address Incomplete");
		exit;
	}

	if(is_method("INVITE")) {
		# Enable dialog tracking for this call
		dlg_manage();
	}

	# dispatch destinations to PSTN
	route(PSTN);

	# user location service
	route(LOCATION);

	return;
}

# Wrapper for relaying requests
route[RELAY] {

	# enable additional event routes for forwarded requests
	# - serial forking, RTP relaying handling, a.s.o.
	if (is_method("INVITE|BYE|SUBSCRIBE|UPDATE")) {
		if(!t_is_set("branch_route")) t_on_branch("MANAGE_BRANCH");
	}
	if (is_method("INVITE|SUBSCRIBE|UPDATE")) {
		if(!t_is_set("onreply_route")) t_on_reply("MANAGE_REPLY");
	}
	if (is_method("INVITE")) {
		if(!t_is_set("failure_route")) t_on_failure("MANAGE_FAILURE");
	}

	# =========================================================================
	# Transport Consistency: Force outgoing socket to match incoming protocol
	# =========================================================================
	# If $fs (force socket) is not already set, ensure we send over the same
	# transport as the incoming request. This prevents TCP->UDP issues where
	# Kamailio might select UDP even when $du has transport=tcp.
	# =========================================================================
	if ($fs == $null) {
		if ($proto == "tcp") {
			$fs = "tcp:" + $Ri + ":5060";
			xlog("L_DBG", "RELAY: Force send socket to TCP: $fs (incoming proto=$proto)\n");
		} else if ($proto == "tls") {
			$fs = "tls:" + $Ri + ":5061";
			xlog("L_DBG", "RELAY: Force send socket to TLS: $fs (incoming proto=$proto)\n");
		}
		# For UDP incoming, let Kamailio choose (UDP is default anyway)
	}

	if (!t_relay()) {
		send_reply_error();
	}
	exit;
}

# Per SIP request initial checks
route[REQINIT] {
	# no connect for sending replies
	set_reply_no_connect();
	# enforce symmetric signaling
	# - send back replies to the source address of request
	force_rport();

#!ifdef WITH_ANTIFLOOD
	# flood detection from same IP and traffic ban for a while
	# be sure you exclude checking trusted peers, such as pstn gateways
	# - local host excluded (e.g., loop to self)
	if(src_ip!=myself) {
		if($sht(ipban=>$si)!=$null) {
			# ip is already blocked
			xdbg("request from blocked IP - $rm from $fu (IP:$si:$sp)\n");
			exit;
		}
		if (!pike_check_req()) {
			xalert("ALERT: pike blocking $rm from $fu (IP:$si:$sp)\n");
			$sht(ipban=>$si) = 1;
			exit;
		}
	}
#!endif
	if($ua =~ "friendly|scanner|sipcli|sipvicious|VaxSIPUserAgent|pplsip") {
		# silent drop for scanners - uncomment next line if want to reply
		# sl_send_reply("200", "OK");
		exit;
	}

	if (!mf_process_maxfwd_header("10")) {
		sl_send_reply("483", "Too Many Hops");
		exit;
	}

	if(is_method("OPTIONS") && uri==myself && $rU==$null) {
		# This looks like a health check OPTIONS - register source as LB
#!ifdef WITH_HTABLE
#!ifdef WITH_CM
		# Load config first so av_esc_register_lb can work
		av_esc_load_config();
		# Register this source as a discovered LB
		$var(lb_ip) = $si;
		$var(lb_port) = $sp;
		$var(lb_proto) = $pr;
		route(LB_REGISTER);
#!endif
#!endif
		xlog("L_INFO", "REQINIT: OPTIONS health check from $si:$sp, responding 200 OK\n");
		sl_send_reply("200", "Keepalive");
		exit;
	}

	if(!sanity_check("17895", "7")) {
		xlog("Malformed SIP request from $si:$sp\n");
		exit;
	}
}

# Process X-Forwarded-For header from load balancer
# Extracts original source IP and stores in $avp(xff_src_ip)
# Trusted LB IPs are discovered dynamically from OPTIONS messages (htable "lbs")
route[XFF_INIT] {
#!ifdef WITH_XFF
	# Clear any previous value
	$avp(xff_src_ip) = $null;
	
	# Only process if X-Forwarded-For header exists
	if ($hdr(X-Forwarded-For) != $null) {
		# Extract IP from X-Forwarded-For (format: "IP:port" or just "IP")
		$var(xff_value) = $hdr(X-Forwarded-For);
		
		# Check if format includes port (IP:port)
		if ($var(xff_value) =~ ":") {
			# Extract IP portion (everything before the colon)
			$avp(xff_src_ip) = $(var(xff_value){s.select,0,:});
		} else {
			# Just IP address, use as-is
			$avp(xff_src_ip) = $var(xff_value);
		}
		
		xlog("L_INFO", "XFF_INIT: Processed X-Forwarded-For from $si, original_src=$avp(xff_src_ip)\n");
		
		# Remove the X-Forwarded-For header after processing
		# This prevents accumulation of headers during multi-hop sequencing via LB
		remove_hf("X-Forwarded-For");
		xlog("L_DBG", "XFF_INIT: Removed X-Forwarded-For header from message\n");
	}
#!endif
	return;
}

# ============================================================================
# Load HA FQDN from environment variable or config
# ============================================================================
# In K8s, HEADLESS_FQDN is set by the entrypoint script from POD_NAMESPACE.
# This route loads the FQDN into an AVP for use in Record-Route and Route headers.
#
# Sets:
#   $avp(ha_fqdn) - The headless service FQDN for Record-Route headers
#
# Priority:
#   1. Environment variable HEADLESS_FQDN (K8s)
#   2. cfg_define ha.srv_fqdn
#   3. Empty (fallback to local IP)
# ============================================================================
route[LOAD_HA_FQDN] {
	# Try environment variable first (K8s entrypoint sets this)
	$avp(ha_fqdn) = $env(HEADLESS_FQDN);
	
	# If env var not set, try cfg_define
	if (strempty($avp(ha_fqdn))) {
		$avp(ha_fqdn) = $sel(cfg_get.ha.srv_fqdn);
	}
	
	# Sanity check - reject literal unsubstituted values
	if ($avp(ha_fqdn) == "HEADLESS_FQDN_VALUE" || $avp(ha_fqdn) == "HEADLESS_FQDN") {
		xlog("L_WARN", "LOAD_HA_FQDN: HEADLESS_FQDN not properly set (literal value detected)\n");
		$avp(ha_fqdn) = "";
	}
	
	if (!strempty($avp(ha_fqdn))) {
		xlog("L_DBG", "LOAD_HA_FQDN: Using FQDN: $avp(ha_fqdn)\n");
	} else {
		xlog("L_WARN", "LOAD_HA_FQDN: No FQDN configured, will use local IP for Record-Route\n");
	}
	
	return;
}

# ============================================================================
# Load LB Cluster FQDN from database config
# ============================================================================
# Loads the LB cluster FQDN from the av_sip_config database table.
# This FQDN is used in Route headers when sequencing INVITEs to CM.
#
# Sets:
#   $avp(lb_cluster_fqdn) - The LB cluster FQDN for Route headers
#
# Priority:
#   1. Database config (global.lb_cluster_fqdn via av_esc_load_config)
#   2. cfg_define lb.cluster_fqdn (fallback)
#   3. Empty (fallback to discovered LB IP address)
#
# If this is set, Route headers for CM will use this FQDN instead of
# the dynamically discovered LB IP address.
# ============================================================================
route[LOAD_LB_FQDN] {
	# av_esc_load_config() should have loaded lb_cluster_fqdn into $avp(lb_cluster_fqdn)
	# If not available from database, try cfg_define fallback
	if (strempty($avp(lb_cluster_fqdn))) {
		$avp(lb_cluster_fqdn) = $sel(cfg_get.lb.cluster_fqdn);
	}
	
	# If FQDN is configured, also load port and transport from config
	if (!strempty($avp(lb_cluster_fqdn))) {
		# Use cfg_define values for port and transport
		$avp(lb_cluster_port) = $sel(cfg_get.lb.cluster_port);
		$avp(lb_cluster_transport) = $sel(cfg_get.lb.cluster_transport);
		
		# Validate port/transport defaults
		if (strempty($avp(lb_cluster_port))) {
			$avp(lb_cluster_port) = "5060";
		}
		if (strempty($avp(lb_cluster_transport))) {
			$avp(lb_cluster_transport) = "tcp";
		}
		
		xlog("L_INFO", "LOAD_LB_FQDN: Using LB cluster FQDN: $avp(lb_cluster_fqdn):$avp(lb_cluster_port)/$avp(lb_cluster_transport)\n");
	} else {
		xlog("L_DBG", "LOAD_LB_FQDN: No LB cluster FQDN configured, will use discovered LB IP\n");
	}
	
	return;
}

# ============================================================================
# Detect Source LB
# ============================================================================
# Detects which LB sent this request and stores in $avp(incoming_lb)
# This is called ONCE per incoming message, early in request_route.
# The stored value is used for consistent LB routing throughout the dialog.
#
# Sets $avp(incoming_lb):
#   0 = Not from a known LB (direct or unknown source)
#   1 = From a discovered LB
#   $avp(incoming_lb_ip) = IP address of the LB
#
# Must be called after av_esc_load_config() to have LB IPs available.
# ============================================================================
route[DETECT_SOURCE_LB] {
	$avp(incoming_lb) = 0;
	$avp(incoming_lb_ip) = $null;
	
	# Check if source IP is a known LB (from dynamic discovery via htable)
	# LBs register themselves by sending OPTIONS - see route[LB_REGISTER]
#!ifdef WITH_HTABLE
	if ($sht(lbs=>$si) != $null) {
		$avp(incoming_lb) = 1;
		$avp(incoming_lb_ip) = $si;
		xlog("L_DBG", "DETECT_SOURCE_LB: Request from discovered LB ($si)\n");
	} else {
		xlog("L_DBG", "DETECT_SOURCE_LB: Request not from known LB, source=$si\n");
	}
#!else
	xlog("L_DBG", "DETECT_SOURCE_LB: htable not enabled, LB detection disabled\n");
#!endif
	
	return;
}

# ============================================================================
# LB Registration - Dynamic Load Balancer Discovery
# ============================================================================
# This route is called when an OPTIONS message is received that appears to be
# from a load balancer. It registers the LB in the htable for future use.
#
# LB entries are stored as:
#   $sht(lbs=>IP) = "port:protocol:timestamp"
#   $sht(lb_idx=>N) = "IP" (for iteration)
#
# Entries auto-expire after 10 seconds if no OPTIONS are received.
# ============================================================================
route[LB_REGISTER] {
#!ifdef WITH_HTABLE
	$var(lb_ip) = $si;
	
	# IMPORTANT: Use the standard SIP port (5060), NOT $sp (source port)
	# $sp is the ephemeral source port the LB uses for SENDING, not its listening port.
	# The LB listens on 5060, so we should route requests back to port 5060.
	$var(lb_port) = 5060;
	
	# Use the protocol from the incoming message
	# If the OPTIONS came over TCP, we should route back over TCP
	$var(lb_proto) = $pr;
	
	# Fallback to tcp if protocol detection fails
	if (strempty($var(lb_proto))) {
		$var(lb_proto) = "tcp";
	}
	
	$var(timestamp) = $Ts;
	
	# Build value string: "port:protocol:timestamp"
	# Note: Must start with "" to force string context, otherwise $var(lb_port) (integer)
	# causes arithmetic evaluation and ":" fails to convert to int
	$var(lb_value) = "" + $var(lb_port) + ":" + $var(lb_proto) + ":" + $var(timestamp);
	
	# Check if this is a new LB or an update
	if ($sht(lbs=>$var(lb_ip)) == $null) {
		# New LB discovered - find next available index
		$var(lb_count) = 0;
		$var(found_slot) = 0;
		
		# Count existing LBs and find a slot
		# Check indices 1-10 (supports up to 10 LBs)
		$var(idx) = 1;
		while ($var(idx) <= 10 && $var(found_slot) == 0) {
			if ($sht(lb_idx=>$var(idx)) == $null) {
				# Found empty slot
				$sht(lb_idx=>$var(idx)) = $var(lb_ip);
				$var(found_slot) = $var(idx);
			} else if ($sht(lb_idx=>$var(idx)) == $var(lb_ip)) {
				# Already has an index (race condition)
				$var(found_slot) = $var(idx);
			}
			$var(idx) = $var(idx) + 1;
		}
		
		xlog("L_INFO", "LB_REGISTER: NEW LB discovered - IP=$var(lb_ip), port=$var(lb_port), proto=$var(lb_proto), index=$var(found_slot)\n");
	} else {
		xlog("L_DBG", "LB_REGISTER: LB keepalive - IP=$var(lb_ip), port=$var(lb_port), proto=$var(lb_proto)\n");
	}
	
	# Store/update in htable (auto-refreshes expiry timer)
	$sht(lbs=>$var(lb_ip)) = $var(lb_value);
	
	# Register with av_esc module for CM-bound SUBSCRIBE routing
#!ifdef WITH_CM
	av_esc_register_lb("$var(lb_ip)", "$var(lb_port)");
#!endif
#!endif
	return;
}

# ============================================================================
# LB Helper - Check if IP is a known LB
# ============================================================================
# Sets $var(is_known_lb) = 1 if $var(check_ip) is a registered LB
# ============================================================================
route[LB_IS_KNOWN] {
	$var(is_known_lb) = 0;
#!ifdef WITH_HTABLE
	if ($sht(lbs=>$var(check_ip)) != $null) {
		$var(is_known_lb) = 1;
	}
#!endif
	return;
}

# ============================================================================
# LB Helper - Get first available LB
# ============================================================================
# Sets $avp(selected_lb_ip), $avp(selected_lb_port), $avp(selected_lb_proto)
# Returns first LB found in the htable
# ============================================================================
route[LB_GET_FIRST] {
	$avp(selected_lb_ip) = $null;
	$avp(selected_lb_port) = $null;
	$avp(selected_lb_proto) = $null;
	
#!ifdef WITH_HTABLE
	# Find first available LB
	$var(idx) = 1;
	while ($var(idx) <= 10) {
		$var(lb_ip) = $sht(lb_idx=>$var(idx));
		if ($var(lb_ip) != $null) {
			$var(lb_data) = $sht(lbs=>$var(lb_ip));
			if ($var(lb_data) != $null) {
				# Parse "port:protocol:timestamp"
				$avp(selected_lb_ip) = $var(lb_ip);
				$avp(selected_lb_port) = $(var(lb_data){s.select,0,:});
				$avp(selected_lb_proto) = $(var(lb_data){s.select,1,:});
				
				# Validate parsed values - use defaults if invalid
				if ($avp(selected_lb_port) == $null || $avp(selected_lb_port) == "" || $avp(selected_lb_port) == "0") {
					$avp(selected_lb_port) = "5060";
				}
				if ($avp(selected_lb_proto) == $null || $avp(selected_lb_proto) == "") {
					$avp(selected_lb_proto) = "tcp";
				}
				
				xlog("L_DBG", "LB_GET_FIRST: Found LB at index $var(idx): $avp(selected_lb_ip):$avp(selected_lb_port)/$avp(selected_lb_proto)\n");
				return;
			}
		}
		$var(idx) = $var(idx) + 1;
	}
#!endif
	xlog("L_DBG", "LB_GET_FIRST: No LBs available\n");
	return;
}

# ============================================================================
# LB Helper - Get alternate LB (not matching $avp(incoming_lb_ip))
# ============================================================================
# Sets $avp(alt_lb_ip), $avp(alt_lb_port), $avp(alt_lb_proto)
# Returns first LB that is NOT the incoming LB (for failover)
# ============================================================================
route[LB_GET_ALT] {
	$avp(alt_lb_ip) = $null;
	$avp(alt_lb_port) = $null;
	$avp(alt_lb_proto) = $null;
	
#!ifdef WITH_HTABLE
	# Find an LB that's not the incoming one
	$var(idx) = 1;
	while ($var(idx) <= 10) {
		$var(lb_ip) = $sht(lb_idx=>$var(idx));
		if ($var(lb_ip) != $null && $var(lb_ip) != $avp(incoming_lb_ip)) {
			$var(lb_data) = $sht(lbs=>$var(lb_ip));
			if ($var(lb_data) != $null) {
				# Parse "port:protocol:timestamp"
				$avp(alt_lb_ip) = $var(lb_ip);
				$avp(alt_lb_port) = $(var(lb_data){s.select,0,:});
				$avp(alt_lb_proto) = $(var(lb_data){s.select,1,:});
				
				# Validate parsed values - use defaults if invalid
				if ($avp(alt_lb_port) == $null || $avp(alt_lb_port) == "" || $avp(alt_lb_port) == "0") {
					$avp(alt_lb_port) = "5060";
				}
				if ($avp(alt_lb_proto) == $null || $avp(alt_lb_proto) == "") {
					$avp(alt_lb_proto) = "tcp";
				}
				
				xlog("L_DBG", "LB_GET_ALT: Found alternate LB at index $var(idx): $avp(alt_lb_ip):$avp(alt_lb_port)/$avp(alt_lb_proto)\n");
				return;
			}
		}
		$var(idx) = $var(idx) + 1;
	}
#!endif
	xlog("L_DBG", "LB_GET_ALT: No alternate LB available\n");
	return;
}

# Handle OPTIONS requests for health checks
# AKS networking ensures only trusted sources can reach us.
# 
# Direct OPTIONS from unknown sources are treated as potential LB
# health checks and the source is registered as a discovered LB.
route[OPTIONS_HANDLER] {
	if (!is_method("OPTIONS")) return;
	
#!ifdef WITH_XFF
	# Check if OPTIONS came through an LB (has X-Forwarded-For header)
	# AKS networking ensures only trusted sources can reach us, so we just
	# register the LB and respond OK
	if ($avp(xff_src_ip) != $null) {
		# The direct source is the LB - register it as a discovered LB
#!ifdef WITH_HTABLE
		route(LB_REGISTER);
#!endif
		xlog("L_INFO", "OPTIONS_HANDLER: OPTIONS via LB ($si), XFF=$avp(xff_src_ip), responding 200 OK\n");
		sl_send_reply("200", "OK");
		exit;
	}
#!endif
	
	# Direct OPTIONS from known LB (already registered)
#!ifdef WITH_HTABLE
	if ($sht(lbs=>$si) != $null) {
		# Update LB keepalive timestamp
		route(LB_REGISTER);
		xlog("L_INFO", "OPTIONS_HANDLER: OPTIONS from known LB ($si), responding 200 OK\n");
		sl_send_reply("200", "OK");
		exit;
	}
#!endif
	
	# Direct OPTIONS from unknown source - could be a new LB
	# Register as potential LB if it looks like a health check (empty R-URI user)
	if ($rU == $null || $rU == "") {
#!ifdef WITH_HTABLE
		# Register this source as a new LB
		route(LB_REGISTER);
		xlog("L_INFO", "OPTIONS_HANDLER: OPTIONS health check from new source ($si), registered as LB, responding 200 OK\n");
		sl_send_reply("200", "OK");
		exit;
#!endif
	}
	
	return;
}

# Check if message source is CM server
# Works with both direct connections and connections via load balancer (X-Forwarded-For)
# Sets $avp(is_cm_source) = 1 if from CM, 0 otherwise
route[IS_FROM_CM] {
#!ifdef WITH_CM
	$avp(is_cm_source) = 0;
	
	xlog("L_DEBUG", "IS_FROM_CM: Checking source - $rm from $si, xff_src_ip=$avp(xff_src_ip), cm_ip=$avp(cm_ip)\n");
	
#!ifdef WITH_XFF
	# First check X-Forwarded-For extracted IP (if present)
	if ($avp(xff_src_ip) != $null) {
		xlog("L_DEBUG", "IS_FROM_CM: Comparing xff_src_ip='$avp(xff_src_ip)' with cm_ip='$avp(cm_ip)'\n");
		if ($avp(xff_src_ip) == $avp(cm_ip)) {
			$avp(is_cm_source) = 1;
			xlog("L_INFO", "IS_FROM_CM: CM detected via X-Forwarded-For ($avp(xff_src_ip))\n");
			return;
		} else {
			xlog("L_DEBUG", "IS_FROM_CM: xff_src_ip does not match cm_ip\n");
		}
	} else {
		xlog("L_DEBUG", "IS_FROM_CM: No xff_src_ip set (XFF not processed or source not trusted LB)\n");
	}
#!endif
	
	# Fall back to av_esc_is_cm_source() for direct connections
	# This checks $si against configured CM IP
	xlog("L_DEBUG", "IS_FROM_CM: Checking direct connection - $si vs cm_ip=$avp(cm_ip)\n");
	if (av_esc_is_cm_source()) {
		$avp(is_cm_source) = 1;
		xlog("L_INFO", "IS_FROM_CM: CM detected via direct connection ($si)\n");
	} else {
		xlog("L_DEBUG", "IS_FROM_CM: Source $si is NOT CM (cm_ip=$avp(cm_ip))\n");
	}
#!else
	$avp(is_cm_source) = 0;
#!endif
	return;
}

# Check if request source is a known trunk (address table group 2)
# Uses X-Forwarded-For extracted IP when present (WITH_XFF), else $si.
# Sets $avp(from_trunk) = 1 if source matches, so AUTH can skip challenge for INVITEs.
route[IS_FROM_TRUNK] {
#!ifdef WITH_TRUNK
	$avp(from_trunk) = 0;
	# Logical source: XFF client IP when behind LB, else direct connection IP
	if ($avp(xff_src_ip) != $null) {
		$var(trunk_src) = $avp(xff_src_ip);
	} else {
		$var(trunk_src) = $si;
	}
	if (allow_address("2", "$var(trunk_src)", "0")) {
		$avp(from_trunk) = 1;
		xlog("L_INFO", "IS_FROM_TRUNK: Trunk IP detected (source=$var(trunk_src)), INVITE will skip auth\n");
	}
#!endif
	return;
}

# Handle requests within SIP dialogs
route[WITHINDLG] {
	if (!has_totag()) return;

#!ifdef WITH_CM
	# Handle in-dialog SUBSCRIBE (e.g., subscription refresh or termination)
	# Route ALL in-dialog SUBSCRIBEs to av_esc - it will detect if it's an unsubscribe
	# (expires=0 can be in Expires header OR Contact header parameter)
	if (is_method("SUBSCRIBE")) {
		xlog("L_INFO", "WITHINDLG: In-dialog SUBSCRIBE, routing to av_esc\n");
		if(av_esc_handle_subscribe() > 0) {
			xlog("L_INFO", "WITHINDLG: av_esc handled SUBSCRIBE\n");
			exit;
		}
		# Fallback if av_esc fails - treat as refresh
		xlog("L_INFO", "WITHINDLG: av_esc failed, routing to PRESENCE\n");
		route(PRESENCE);
		exit;
	}
#!endif

	# sequential request within a dialog should
	# take the path determined by record-routing
	if (loose_route()) {
		route(DLGURI);
		
		# HA Dialog Takeover: Ensure dialog is tracked (loads from DB if needed)
		# dlg_manage() will automatically load dialog from DB with db_mode=1
		# if the dialog exists in DB but not in local memory (HA failover scenario)
		dlg_manage();
		
		xlog("L_DBG", "WITHINDLG: Processing in-dialog $rm for Call-ID=$ci\n");
		
		# =====================================================================
		# LB-Aware Routing with Dynamic Affinity Update
		# 
		# Routes through the LB that sent the current request, detecting and
		# handling LB failover scenarios. If the incoming request arrives from
		# a different LB than the stored dialog preference, this indicates an
		# LB failover has occurred and we update the dialog's affinity.
		#
		# Priority: 
		#   1) Current incoming LB ($avp(incoming_lb)) - always trust the working path
		#   2) Dialog-stored preference ($dlg_var(source_lb)) - fallback
		#
		# The $du override takes precedence over the Route headers from
		# loose_route(), ensuring we route through the active LB.
		# =====================================================================
		$var(source_lb) = 0;  # 0=unknown, 1=from discovered LB
		$var(stored_lb_ip) = "";  # The dialog's stored LB preference (IP)
		$var(lb_switched) = 0;  # Flag to indicate LB failover detected
		$avp(alt_lb_uri) = $null;
		
		# First, get the stored dialog preference (if any)
		if (!strempty($dlg_var(source_lb_ip))) {
			$var(stored_lb_ip) = $dlg_var(source_lb_ip);
		}
		
		# Determine which LB actually sent this request using dynamic discovery
		# This takes priority - always trust the current working path
		if ($avp(incoming_lb) != $null && $avp(incoming_lb) > 0 && $avp(incoming_lb_ip) != $null) {
			$var(source_lb) = 1;
			$var(use_lb_ip) = $avp(incoming_lb_ip);
			xlog("L_DBG", "WITHINDLG: Incoming request from discovered LB ($var(use_lb_ip))\n");
		}
		
		# Detect LB failover: incoming differs from stored preference
		if ($var(source_lb) > 0 && !strempty($var(stored_lb_ip)) && $var(use_lb_ip) != $var(stored_lb_ip)) {
			$var(lb_switched) = 1;
			xlog("L_WARN", "WITHINDLG: LB FAILOVER DETECTED for Call-ID=$ci - "
				"stored=$var(stored_lb_ip), incoming=$var(use_lb_ip). Updating dialog affinity.\n");
			
			# Update dialog's LB preference to the new working LB
			$dlg_var(source_lb_ip) = $var(use_lb_ip);
			xlog("L_INFO", "WITHINDLG: Updated dialog LB affinity to $var(use_lb_ip)\n");
		} else if ($var(source_lb) > 0 && strempty($var(stored_lb_ip))) {
			# No stored preference - store the current one
			$dlg_var(source_lb_ip) = $var(use_lb_ip);
			xlog("L_INFO", "WITHINDLG: Stored initial LB preference: $var(use_lb_ip)\n");
		} else if ($var(source_lb) == 0 && !strempty($var(stored_lb_ip))) {
			# Request not from known LB but dialog has preference - use stored
			$var(use_lb_ip) = $var(stored_lb_ip);
			$var(source_lb) = 1;
			xlog("L_DBG", "WITHINDLG: Using stored LB preference: $var(use_lb_ip)\n");
		}
		
		# If we know which LB to use, set up routing using discovered LB data
#!ifdef WITH_HTABLE
		if ($var(source_lb) > 0 && !strempty($var(use_lb_ip))) {
			$var(lb_data) = $sht(lbs=>$var(use_lb_ip));
			if ($var(lb_data) != $null) {
				# Parse "port:protocol:timestamp" from htable
				$var(use_lb_port) = $(var(lb_data){s.select,0,:});
				$var(use_lb_proto) = $(var(lb_data){s.select,1,:});
			} else {
				# LB entry expired, use defaults
				$var(use_lb_port) = "5060";
				$var(use_lb_proto) = "tcp";
			}
			
			# Validate port and protocol - use defaults if invalid
			if ($var(use_lb_port) == $null || $var(use_lb_port) == "" || $var(use_lb_port) == "0") {
				xlog("L_WARN", "WITHINDLG: Invalid LB port, using default 5060\n");
				$var(use_lb_port) = "5060";
			}
			if ($var(use_lb_proto) == $null || $var(use_lb_proto) == "") {
				xlog("L_WARN", "WITHINDLG: Invalid LB protocol, using default tcp\n");
				$var(use_lb_proto) = "tcp";
			}
			
			# IMPORTANT: Preserve transport from incoming request
			# If request came in over TCP, ensure it goes out over TCP
			# This prevents TCP->UDP transport mismatch issues
			if ($proto == "tcp" || $proto == "tls") {
				if ($var(use_lb_proto) != "tcp" && $var(use_lb_proto) != "tls") {
					xlog("L_INFO", "WITHINDLG: Incoming proto=$proto, forcing outgoing to tcp (was $var(use_lb_proto))\n");
					$var(use_lb_proto) = "tcp";
				}
			}
			
			$du = "sip:" + $var(use_lb_ip) + ":" + $var(use_lb_port) 
				+ ";transport=" + $var(use_lb_proto);
			
			# Store for Route header generation
			$avp(selected_lb_ip) = $var(use_lb_ip);
			$avp(selected_lb_port) = $var(use_lb_port);
			$avp(selected_lb_proto) = $var(use_lb_proto);
			
			# Get alternate LB for failover
			route(LB_GET_ALT);
			if ($avp(alt_lb_ip) != $null) {
				$avp(alt_lb_uri) = "sip:" + $avp(alt_lb_ip) + ":" + $avp(alt_lb_port)
					+ ";transport=" + $avp(alt_lb_proto);
			}
			
			if ($var(lb_switched) == 1) {
				xlog("L_INFO", "WITHINDLG: Routing via NEW LB (after failover): $du\n");
			} else {
				xlog("L_INFO", "WITHINDLG: Routing via discovered LB: $du (incoming proto=$proto)\n");
			}
			
			if (!strempty($avp(alt_lb_uri))) {
				xlog("L_DBG", "WITHINDLG: Alternate LB for failover: $avp(alt_lb_uri)\n");
			}
		}
#!endif
		# =====================================================================
		
		if (is_method("BYE")) {
			xlog("L_INFO", "WITHINDLG: BYE received for Call-ID=$ci\n");
			setflag(FLT_ACC); # do accounting ...
			setflag(FLT_ACCFAILED); # ... even if the transaction fails
		} else if ( is_method("ACK") ) {
			# ACK is forwarded statelessly
			route(NATMANAGE);
		} else if ( is_method("NOTIFY|REFER") ) {
			# Add Record-Route for in-dialog NOTIFY and REFER (RFC6665, RFC3515)
			# Uses cluster FQDN for HA failover if configured
			route(HA_RECORD_ROUTE);
		} else if ( is_method("INVITE") ) {
			# Re-INVITE (hold, resume, codec change, etc.)
			xlog("L_INFO", "WITHINDLG: Re-INVITE received for Call-ID=$ci\n");
		} else if ( is_method("PRACK|UPDATE") ) {
			xlog("L_DBG", "WITHINDLG: $rm received for Call-ID=$ci\n");
		}
		
		# Set up LB failover for in-dialog requests (except stateless ACK)
		# If the source LB fails during request processing, try alternate LB
		if ($var(source_lb) > 0 && !strempty($avp(alt_lb_uri)) && !is_method("ACK")) {
			t_on_failure("INDIALOG_LB_FAILOVER");
		}
		
		# Transport consistency is enforced in route(RELAY) via $fs
		route(RELAY);
		exit;
	}

	if (is_method("SUBSCRIBE") && uri == myself) {
		# in-dialog subscribe requests
		route(PRESENCE);
		exit;
	}
	if ( is_method("ACK") ) {
		if ( t_check_trans() ) {
			# no loose-route, but stateful ACK;
			# must be an ACK after a 487
			# or e.g. 404 from upstream server
			route(RELAY);
			exit;
		} else {
			# ACK without matching transaction ... ignore and discard
			exit;
		}
	}
	sl_send_reply("404", "Not here");
	exit;
}

# Handle SIP registrations
route[REGISTRAR] {
	if (!is_method("REGISTER")) return;

	if(isflagset(FLT_NATS)) {
		setbflag(FLB_NATB);
#!ifdef WITH_NATSIPPING
		# do SIP NAT pinging
		setbflag(FLB_NATSIPPING);
#!endif
	}

	# Determine if this is a new registration or a refresh (for RFC 3680 compliance)
	# Query DB directly to check for existing registration (works with db_mode=3)
	$avp(reg_event_type) = "registered";
	$var(aor_user) = $tU;
	$var(aor_domain) = $td;
	sql_query("location_db", 
		"SELECT COUNT(*) FROM location WHERE username='$var(aor_user)' AND domain='$var(aor_domain)' AND expires > NOW()", 
		"reg_check");
	if ($dbr(reg_check=>rows) > 0) {
		$var(existing_count) = $dbr(reg_check=>[0,0]);
		if ($var(existing_count) > 0) {
			# User already registered - this is a refresh
			$avp(reg_event_type) = "refreshed";
			xlog("L_DBG", "REGISTRAR: Existing registration found ($var(existing_count) contacts) - this is a refresh\n");
		}
	}
	sql_result_free("reg_check");

	# Handle +sip.instance based registration replacement
	# If incoming REGISTER has +sip.instance, remove old registrations
	# with same instance but different contact (device moved/rebooted)
	route(HANDLE_SIP_INSTANCE);

	# Apply dynamic registration timeout from av_config database
	# Get the dynamic max_expires value
	av_esc_get_reg_max_expires();
	$var(dyn_max_expires) = $rc;
	
	# Check if request has Expires header exceeding dynamic limit
	if(is_present_hf("Expires")) {
		if($hdr(Expires) > $var(dyn_max_expires)) {
			xlog("L_INFO", "REGISTRAR: Capping Expires from $hdr(Expires) to $var(dyn_max_expires) (dynamic limit)\n");
			remove_hf("Expires");
			append_hf("Expires: $var(dyn_max_expires)\r\n");
		}
	}

	if (!save("location")) {
		send_reply_error();
	}
#!ifdef WITH_CM
	# Notify reg event subscribers about registration change
	# Pass event type per RFC 3680: "registered" for new, "refreshed" for refresh
	xlog("L_INFO", "REGISTRAR: Registration saved [$avp(reg_event_type)], notifying reg subscribers for $tu\n");
	av_esc_notify_reg_change("$tu", "$avp(reg_event_type)");
#!endif
	exit;
}

# Handle +sip.instance based registration deduplication
# Per RFC 5626: When a new REGISTER with same +sip.instance arrives,
# the old contact with that instance should be replaced if it's not a refresh
# This prevents duplicate registrations when a device reboots or changes network
#
# NOTE: This implementation queries the location database directly via SQL
# This works with db_mode=3 (DB only) in multi-server HA setups
route[HANDLE_SIP_INSTANCE] {
	# Skip if this is a de-registration (expires=0 in Expires header)
	if ($hdr(Expires) == "0") {
		xlog("L_DBG", "HANDLE_SIP_INSTANCE: De-registration, skipping instance check\n");
		return;
	}
	
	# Check Contact header for expires=0 (de-registration in Contact parameter)
	# Use param.value transformation for efficient header parameter extraction
	# Contact format: <sip:user@host>;expires=3600;+sip.instance="<urn:uuid:xxx>"
	$var(ct_expires) = $(ct{param.value,expires});
	if ($var(ct_expires) == "0") {
		xlog("L_DBG", "HANDLE_SIP_INSTANCE: Contact has expires=0, skipping instance check\n");
		return;
	}

	# Extract +sip.instance from incoming Contact header parameter
	# Format: <sip:user@host>;+sip.instance="<urn:uuid:xxx>"
	# Use param.value transformation - extracts header parameter value
	$var(new_instance) = $(ct{param.value,+sip.instance});
	
	if ($var(new_instance) == $null || $var(new_instance) == "") {
		xlog("L_DBG", "HANDLE_SIP_INSTANCE: No +sip.instance in Contact header\n");
		return;
	}
	
	xlog("L_INFO", "HANDLE_SIP_INSTANCE: New registration with instance=$var(new_instance) for AOR=$tu\n");
	
	# Get the incoming contact URI (the address part, without parameters)
	$var(new_contact) = $(ct{nameaddr.uri});
	xlog("L_INFO", "HANDLE_SIP_INSTANCE: New contact URI=$var(new_contact)\n");
	
	# Build the AOR for database query (username@domain format)
	$var(aor_user) = $tU;
	$var(aor_domain) = $td;
	$var(aor_db) = $var(aor_user) + "@" + $var(aor_domain);
	
	xlog("L_INFO", "HANDLE_SIP_INSTANCE: Querying database for AOR=$var(aor_db) with instance=$var(new_instance)\n");
	
	# Query the location table directly for contacts with matching instance
	# This works with db_mode=3 and multi-server HA setups
	sql_query("location_db", 
		"SELECT contact, instance FROM location WHERE username='$var(aor_user)' AND domain='$var(aor_domain)' AND instance='$var(new_instance)' AND expires > NOW()", 
		"ra");
	
	xlog("L_INFO", "HANDLE_SIP_INSTANCE: SQL query returned $dbr(ra=>rows) rows\n");
	
	if ($dbr(ra=>rows) > 0) {
		$var(i) = 0;
		while ($var(i) < $dbr(ra=>rows)) {
			$var(existing_contact) = $dbr(ra=>[$var(i),0]);
			$var(existing_instance) = $dbr(ra=>[$var(i),1]);
			
			xlog("L_INFO", "HANDLE_SIP_INSTANCE: Found existing contact=$var(existing_contact) with instance=$var(existing_instance)\n");
			
			# Extract subid_ipcs from both contacts for comparison
			# This is important when contacts go through SBC and have same IP:port
			# Use uri.param transformation for efficient URI parameter extraction
			$var(existing_subid) = $(var(existing_contact){uri.param,subid_ipcs});
			$var(new_subid) = $(var(new_contact){uri.param,subid_ipcs});
			
			# Handle null values - treat as empty string for comparison
			if ($var(existing_subid) == $null) {
				$var(existing_subid) = "";
			}
			if ($var(new_subid) == $null) {
				$var(new_subid) = "";
			}
			
			xlog("L_INFO", "HANDLE_SIP_INSTANCE: Comparing subid_ipcs: existing='$var(existing_subid)' vs new='$var(new_subid)'\n");
			
			# Determine if this is a refresh or different device
			# If subid_ipcs exists in both, use it for comparison
			# Otherwise fall back to full contact comparison
			$var(is_same_device) = 0;
			
			if ($var(existing_subid) != "" && $var(new_subid) != "") {
				# Both have subid_ipcs, compare those
				if ($var(existing_subid) == $var(new_subid)) {
					$var(is_same_device) = 1;
					xlog("L_INFO", "HANDLE_SIP_INSTANCE: Same subid_ipcs - this is a refresh\n");
				} else {
					xlog("L_INFO", "HANDLE_SIP_INSTANCE: Different subid_ipcs - device moved/changed\n");
				}
			} else {
				# Fall back to full contact comparison
				if ($var(existing_contact) == $var(new_contact)) {
					$var(is_same_device) = 1;
					xlog("L_INFO", "HANDLE_SIP_INSTANCE: Same full contact - this is a refresh\n");
				} else {
					xlog("L_INFO", "HANDLE_SIP_INSTANCE: Different full contact - device moved/changed\n");
				}
			}
			
			if ($var(is_same_device) == 0) {
				xlog("L_INFO", "HANDLE_SIP_INSTANCE: Found matching instance with DIFFERENT device\n");
				xlog("L_INFO", "HANDLE_SIP_INSTANCE: OLD contact: $var(existing_contact)\n");
				xlog("L_INFO", "HANDLE_SIP_INSTANCE: NEW contact: $var(new_contact)\n");
				
				# Store the contact URI before removal for notification
				$var(terminated_contact) = $var(existing_contact);
				
				# Delete the old contact with matching instance
				xlog("L_INFO", "HANDLE_SIP_INSTANCE: Calling unregister for old contact\n");
				if (unregister("location", "$tu", "$var(existing_contact)")) {
					xlog("L_INFO", "HANDLE_SIP_INSTANCE: unregister() SUCCESS - old registration removed\n");
#!ifdef WITH_CM
					# Notify reg event subscribers about the terminated contact
					xlog("L_INFO", "HANDLE_SIP_INSTANCE: Calling av_esc_notify_contact_terminated\n");
					$var(notify_result) = av_esc_notify_contact_terminated("$tu", "$var(terminated_contact)");
					xlog("L_INFO", "HANDLE_SIP_INSTANCE: av_esc_notify_contact_terminated returned: $var(notify_result)\n");
#!endif
				} else {
					xlog("L_WARN", "HANDLE_SIP_INSTANCE: unregister() FAILED for contact: $var(existing_contact)\n");
				}
			}
			
			$var(i) = $var(i) + 1;
		}
	} else {
		xlog("L_INFO", "HANDLE_SIP_INSTANCE: No existing contacts with matching instance found\n");
	}
	
	# Free the SQL result
	sql_result_free("ra");
	
	return;
}

#!ifdef WITH_PUSH_NOTIFICATIONS
# Push notification check and 180 Ringing for INVITEs
# Prerequisites: $var(location_found) must be set before calling
# Uses $tU/$td (To header) for push lookup since R-URI domain changes after lookup()
# Exits if: no contacts and no push (404), or no contacts but push exists (wait)
# Returns if: contacts exist (caller should continue to RELAY)
route[PUSH_CHECK_AND_RINGING] {
	# Check if user has push notification activations
	# Function returns count+1 to avoid returning 0 (which stops script), so subtract 1
	xlog("L_INFO", "PUSH_CHECK: Checking push activations for $tU@$td\n");
	if (av_push_check_activations("$tU", "$td")) {
		$var(push_activations) = $retcode - 1;
	} else {
		$var(push_activations) = 0;
	}
	xlog("L_INFO", "PUSH_CHECK: Push activations for $tU@$td: $var(push_activations)\n");
	
	# If push activations exist, always send 180 Ringing first
	# This indicates the call is being processed (mobile devices may be woken via push)
	if ($var(push_activations) > 0) {
		xlog("L_INFO", "PUSH_CHECK: Push activations exist - sending 180 Ringing\n");
		t_newtran();
		# Add Contact header with Kamailio FQDN and mobility=mobile parameter
		if (!strempty($avp(ha_fqdn))) {
			$var(contact_uri) = "<sip:" + $avp(ha_fqdn) + ":" + $sel(cfg_get.ha.srv_port) + ";transport=tcp>;mobility=mobile";
		} else {
			$var(contact_uri) = "<sip:" + $Ri + ":" + $Rp + ";transport=tcp>;mobility=mobile";
		}
		append_to_reply("Contact: $var(contact_uri)\r\n");
		t_reply("180", "Ringing");
		# TODO: Trigger push notification to wake up mobile device
	}
	
	# If no registered contacts found
	if ($var(location_found) == 0) {
		if ($var(push_activations) > 0) {
			# No contacts but push exists - 180 already sent, wait for device to register
			xlog("L_INFO", "PUSH_CHECK: No contacts but push exists - waiting for device\n");
			exit;
		}
		# No contacts and no push activations - return error
		xlog("L_ERR", "PUSH_CHECK: No contacts and no push ($var(push_activations)) - sending 404\n");
		sl_send_reply("404", "Not Found");
		exit;
	}
	
	# Contacts exist - return to caller for normal routing
	return;
}
#!endif

# User location service
route[LOCATION] {

#!ifdef WITH_SPEEDDIAL
	# search for short dialing - 2-digit extension
	if($rU=~"^[0-9][0-9]$") {
		if(sd_lookup("speed_dial")) {
			route(SIPOUT);
		}
	}
#!endif

#!ifdef WITH_ALIASDB
	# search in DB-based aliases
	if(alias_db_lookup("dbaliases")) {
		route(SIPOUT);
	}
#!endif

	$avp(oexten) = $rU;
	$var(location_found) = 0;
	if (lookup("location")) {
		$var(location_found) = 1;
	} else {
		$var(rc) = $rc;
	}

#!ifdef WITH_PUSH_NOTIFICATIONS
	# For INVITEs: Use consolidated push notification check
	if (is_method("INVITE")) {
		route(PUSH_CHECK_AND_RINGING);
		# If we get here, contacts exist - continue to RELAY
	} else {
		# Non-INVITE methods - standard handling
		if ($var(location_found) == 0) {
			xlog("L_ERR", "LOCATION: No contacts found (rc=$var(rc)) - sending 404\n");
			sl_send_reply("404", "Not Found");
			exit;
		}
	}
#!else
	if ($var(location_found) == 0) {
		xlog("L_ERR", "LOCATION: No contacts found (rc=$var(rc)) - sending 404\n");
		sl_send_reply("404", "Not Found");
		exit;
	}
#!endif

	# when routing via usrloc, log the missed calls also
	if (is_method("INVITE")) {
		setflag(FLT_ACCMISSED);
	}

	# Route via LB if any discovered LBs available
#!ifdef WITH_HTABLE
	route(LB_GET_FIRST);
	if ($avp(selected_lb_ip) != $null) {
		route(LB_SELECT_DESTINATION);
		xlog("L_INFO", "LOCATION: Routing via LB, du=$du, R-URI=$ru\n");
		
		# Enable LB failover for this request
		if (!strempty($avp(alt_lb_uri))) {
			t_on_failure("LB_FAILOVER");
		}
	} else {
		# No LBs - set destination explicitly to preserve transport
		route(SET_ENDPOINT_DESTINATION);
		xlog("L_INFO", "LOCATION: No LBs discovered, routing directly to $ru via $du\n");
	}
#!else
	# No htable - set destination explicitly to preserve transport
	route(SET_ENDPOINT_DESTINATION);
	xlog("L_INFO", "LOCATION: htable not enabled, routing directly to $ru via $du\n");
#!endif

	route(RELAY);
	exit;
}

# Presence server processing
route[PRESENCE] {
	if(!is_method("PUBLISH|SUBSCRIBE")) return;

	xlog("L_INFO", "PRESENCE: Processing $rm, Event=$hdr(Event), ruri=$ru\n");

#!ifdef WITH_CM
	# Use av_esc module for CM-bound SUBSCRIBE events and local events
	if(is_method("SUBSCRIBE")) {
		if($hdr(Event)=="avaya-cm-feature-status" ||
		   $hdr(Event)=="dialog" ||
		   $hdr(Event)=="message-summary" ||
		   $hdr(Event)=="avaya-ccs-profile" ||
		   $hdr(Event)=="reg") {
			xlog("L_INFO", "PRESENCE: Event detected [$hdr(Event)], using av_esc module\n");
			if(av_esc_handle_subscribe() > 0) {
				xlog("L_INFO", "PRESENCE: av_esc_handle_subscribe successful\n");
				exit;
			}
			# av_esc failed, send error
			xlog("L_ERR", "PRESENCE: av_esc_handle_subscribe failed\n");
			sl_send_reply("500", "Internal Server Error");
			exit;
		}
	}
#!else
	if($hdr(Event)=="avaya-cm-feature-status") {
		xlog("L_INFO", "PRESENCE: Event matches avaya-cm-feature-status, calling TOCM\n");
		route(TOCM);
		# returns here if no CM is configured
		sl_send_reply("404", "No CM service");
		exit;
	}
	else if($hdr(Event)=="dialog") {
		route(TOCM);
		# returns here if no CM is configured
		sl_send_reply("404", "No CM service");
		exit;
	}
	else if($hdr(Event)=="message-summary") {
		route(TOCM);
		# returns here if no CM is configured
		sl_send_reply("404", "No CM service");
		exit;
	}
#!endif


#!ifdef WITH_PRESENCE
#!ifdef WITH_MSGREBUILD
	# apply changes in case the request headers or body were modified
	msg_apply_changes();
#!endif
	if (!t_newtran()) {
		send_reply_error();
		exit;
	}

	if(is_method("PUBLISH")) {
		handle_publish();
		t_release();
	} else if(is_method("SUBSCRIBE")) {
		handle_subscribe();
		t_release();
	}
	exit;
#!endif

	# if presence enabled, this part will not be executed
	if (is_method("PUBLISH") || $rU==$null) {
		sl_send_reply("404", "Not here");
		exit;
	}
	return;
}

# ============================================================================
# Check if Request-URI domain is local (authoritative)
# ============================================================================
# Sets $var(is_local_domain) = 1 if:
#   1. uri==myself (domain table + static aliases), OR
#   2. is_domain_local("$rd") - Request-URI host is in domain table
#
# Local domains are defined in the Kamailio 'domain' table. Run 'kamcmd domain.reload'
# after changing the domain table. Add domains via SQL, e.g.:
#   INSERT INTO domain (domain) VALUES ('sip.example.com');
# ============================================================================
route[IS_LOCAL_DOMAIN] {
	$var(is_local_domain) = 0;
	
	if (uri==myself) {
		$var(is_local_domain) = 1;
		xlog("L_DBG", "IS_LOCAL_DOMAIN: Domain matches via myself check\n");
		return;
	}
	if (is_domain_local("$rd")) {
		$var(is_local_domain) = 1;
		xlog("L_DBG", "IS_LOCAL_DOMAIN: Domain $rd is local (domain table)\n");
		return;
	}
	xlog("L_DBG", "IS_LOCAL_DOMAIN: Domain $rd is NOT local\n");
	return;
}

# Check if From-URI domain is local (domain table + static aliases)
route[IS_FROM_LOCAL] {
	$var(is_from_local) = 0;
	if (from_uri==myself) {
		$var(is_from_local) = 1;
		return;
	}
	if (is_domain_local("$fd")) {
		$var(is_from_local) = 1;
		return;
	}
	return;
}

# ============================================================================
# Check if R-URI (destination) is a known subscriber (subscriber table)
# ============================================================================
# Sets $var(is_ruri_subscriber) = 1 if subscriber table has a row for username=$rU
# and domain=$rd; otherwise 0. Used to decide termination sequencing vs dialplan:
# only perform term sequencing when the destination is an actual subscriber.
# Requires WITH_USRLOCDB (location_db / sqlops). Eventually can be cached (e.g. htable).
# ============================================================================
#!ifdef WITH_USRLOCDB
route[IS_RURI_SUBSCRIBER] {
	$var(is_ruri_subscriber) = 0;
	# Only run SQL with whitelisted R-URI user/domain to prevent injection (trunk-originated INVITEs skip AUTH)
	if ($rU == $null || $rU == "" || !($rU =~ "^[a-zA-Z0-9._@-]+$")) {
		xlog("L_DBG", "IS_RURI_SUBSCRIBER: skip query - R-URI user invalid or unsafe\n");
		return;
	}
#!ifdef WITH_MULTIDOMAIN
	if ($rd == $null || $rd == "" || !($rd =~ "^[a-zA-Z0-9.-]+$")) {
		xlog("L_DBG", "IS_RURI_SUBSCRIBER: skip query - R-URI domain invalid or unsafe\n");
		return;
	}
	sql_query("location_db", "SELECT 1 FROM subscriber WHERE username='$rU' AND domain='$rd' LIMIT 1", "ra_ruri_sub");
#!else
	sql_query("location_db", "SELECT 1 FROM subscriber WHERE username='$rU' LIMIT 1", "ra_ruri_sub");
#!endif
	if ($dbr(ra_ruri_sub=>rows) > 0) {
		$var(is_ruri_subscriber) = 1;
		xlog("L_DBG", "IS_RURI_SUBSCRIBER: $rU@$rd is a known subscriber\n");
	} else {
		xlog("L_DBG", "IS_RURI_SUBSCRIBER: $rU@$rd is NOT in subscriber table\n");
	}
	sql_result_free("ra_ruri_sub");
	return;
}
#!endif

# IP authorization and user authentication
# Supports MD5 and SHA-256 digest authentication algorithms
# Algorithm preference controlled by AUTH_ALGORITHMS environment variable
route[AUTH] {
#!ifdef WITH_AUTH

#!ifdef WITH_TRUNK
	# INVITEs from known trunk IPs (address table group 2) skip auth and route to CM via LB
	if (is_method("INVITE") && $avp(from_trunk) == 1) {
		xlog("L_INFO", "AUTH: INVITE from trunk IP, skipping authentication\n");
		return;
	}
#!endif

#!ifdef WITH_IPAUTH
	if((!is_method("REGISTER")) && allow_source_address()) {
		# source IP allowed
		return;
	}
#!endif

	# Check if From or Request-URI is local (using dynamic domain check)
	route(IS_FROM_LOCAL);
	route(IS_LOCAL_DOMAIN);
	
	if (is_method("REGISTER") || $var(is_from_local) == 1) {
		# Authenticate requests using multi-algorithm support
		route(AUTH_DIGEST);
		if ($var(auth_result) != 1) {
			exit;
		}
		# user authenticated - remove auth header
		if(!is_method("REGISTER|PUBLISH"))
			consume_credentials();
	}
	# if caller is not local subscriber, then check if it calls
	# a local destination, otherwise deny, not an open relay here
	if ($var(is_from_local) != 1 && $var(is_local_domain) != 1) {
		xlog("L_WARN", "AUTH: Rejecting relay - from_domain=$fd, ruri_domain=$rd (not in domain table)\n");
		sl_send_reply("403", "Not relaying");
		exit;
	}

#!else

	# authentication not enabled - do not relay at all to foreign networks
	route(IS_LOCAL_DOMAIN);
	if($var(is_local_domain) != 1) {
		xlog("L_WARN", "AUTH: Rejecting - domain $rd not local (domain table)\n");
		sl_send_reply("403", "Not relaying");
		exit;
	}

#!endif
	return;
}

# ============================================================================
# Digest Authentication with MD5/SHA-256 Algorithm Support
# ============================================================================
# This route handles SIP digest authentication supporting both MD5 and SHA-256
# algorithms. It uses pre-computed HA1 hashes stored in the subscriber table:
#   - ha1: MD5-based HA1 hash (MD5(username:realm:password))
#   - ha1_sha256: SHA-256-based HA1 hash (SHA256(username:realm:password))
#
# The algorithm preference is configured via AUTH_ALGORITHMS environment variable.
# When challenging, the configured algorithms are offered to allow client choice.
# When validating, the algorithm from the client's Authorization header is used.
#
# Per RFC 7616, SHA-256 is preferred for security. The server challenges with
# all configured algorithms, and the client chooses which to use.
#
# Sets $var(auth_result) = 1 on success, handles challenge/failure internally.
# ============================================================================
#!ifdef WITH_AUTH
route[AUTH_DIGEST] {
	$var(auth_result) = 0;
	$var(auth_algorithm) = "";
	
	# Determine if we're handling REGISTER (401) or other requests (407)
	# Use is_present_hf() for reliable header existence check
	if (is_method("REGISTER")) {
		$var(use_proxy_auth) = 0;
		if (!is_present_hf("Authorization")) {
			# No credentials - send challenge with configured algorithms
			xlog("L_DBG", "AUTH_DIGEST: No Authorization header, sending challenge for $fd\n");
			route(AUTH_CHALLENGE);
			return;
		}
		$var(auth_header) = $hdr(Authorization);
	} else {
		$var(use_proxy_auth) = 1;
		if (!is_present_hf("Proxy-Authorization")) {
			# No credentials - send challenge with configured algorithms
			xlog("L_DBG", "AUTH_DIGEST: No Proxy-Authorization header, sending challenge for $fd\n");
			route(AUTH_CHALLENGE);
			return;
		}
		$var(auth_header) = $hdr(Proxy-Authorization);
	}
	
	# Extract algorithm from Authorization header (literal substring, no regex)
	# Format: Digest username="...", algorithm=SHA-256, ...
	# Default to MD5 if not specified (per RFC 2617)
	if (str_find($var(auth_header), "algorithm=SHA-256") || str_find($var(auth_header), "algorithm=\"SHA-256\"")) {
		$var(auth_algorithm) = "SHA-256";
	} else if (str_find($var(auth_header), "algorithm=MD5") || str_find($var(auth_header), "algorithm=\"MD5\"") || !str_find($var(auth_header), "algorithm=")) {
		# MD5 is default when algorithm parameter is absent (RFC 2617)
		$var(auth_algorithm) = "MD5";
	} else {
		# Unknown algorithm
		xlog("L_WARN", "AUTH_DIGEST: Unknown algorithm in Authorization header from $si\n");
		sl_send_reply("400", "Unsupported Authentication Algorithm");
		return;
	}
	
	xlog("L_DBG", "AUTH_DIGEST: Client using algorithm=$var(auth_algorithm) for user $fU@$fd\n");
	
	# Validate algorithm is allowed by configuration
	# AUTH_ALGORITHMS format: "SHA-256,MD5" or "SHA-256" or "MD5"
	$var(alg_allowed) = 0;
	if ($var(auth_algorithm) == "SHA-256") {
		if (AUTH_ALGORITHMS =~ "SHA-256") {
			$var(alg_allowed) = 1;
		}
	} else if ($var(auth_algorithm) == "MD5") {
		if (AUTH_ALGORITHMS =~ "MD5") {
			$var(alg_allowed) = 1;
		}
	}
	
	if ($var(alg_allowed) == 0) {
		xlog("L_WARN", "AUTH_DIGEST: Algorithm $var(auth_algorithm) not allowed (configured: " + AUTH_ALGORITHMS + ") from $si\n");
		sl_send_reply("400", "Authentication Algorithm Not Allowed");
		return;
	}
	
	# Perform authentication using the appropriate HA1 column
	# We use pv_www_authenticate/pv_proxy_authenticate for both algorithms
	# IMPORTANT: Must call auth_algorithm() before pv_*_authenticate to set
	# the hash algorithm for HA2 computation
	if ($var(auth_algorithm) == "SHA-256") {
		# SHA-256 authentication - load SHA-256 HA1 from database
		route(AUTH_LOAD_HA1_SHA256);
		if ($avp(ha1_sha256) == $null || $avp(ha1_sha256) == "") {
			xlog("L_WARN", "AUTH_DIGEST: SHA-256 HA1 not found for user=$fU@$fd\n");
			route(AUTH_CHALLENGE);
			return;
		}
		
		# Set algorithm before authentication - this tells pv_www_authenticate
		# to use SHA-256 for HA2 computation and response verification
		auth_algorithm("SHA-256");
		
		# Use pv_www_authenticate/pv_proxy_authenticate with SHA-256 HA1
		# Parameters: realm, password_avp, flags
		# Flag 1 = HA1 is pre-computed (not cleartext password)
		if ($var(use_proxy_auth) == 1) {
			$var(auth_rc) = pv_proxy_authenticate("$fd", "$avp(ha1_sha256)", "1");
		} else {
			$var(auth_rc) = pv_www_authenticate("$fd", "$avp(ha1_sha256)", "1");
		}
	} else {
		# MD5 authentication - load MD5 HA1 from database
		route(AUTH_LOAD_HA1_MD5);
		if ($avp(ha1_md5) == $null || $avp(ha1_md5) == "") {
			xlog("L_WARN", "AUTH_DIGEST: MD5 HA1 not found for user=$fU@$fd\n");
			route(AUTH_CHALLENGE);
			return;
		}
		
		# Set algorithm before authentication - this tells pv_www_authenticate
		# to use MD5 for HA2 computation and response verification
		auth_algorithm("MD5");
		
		# Use pv_www_authenticate/pv_proxy_authenticate with MD5 HA1
		if ($var(use_proxy_auth) == 1) {
			$var(auth_rc) = pv_proxy_authenticate("$fd", "$avp(ha1_md5)", "1");
		} else {
			$var(auth_rc) = pv_www_authenticate("$fd", "$avp(ha1_md5)", "1");
		}
	}
	
	# Process authentication result
	# Return codes: 1=success, -1=invalid password, -2=user not found, 
	#               -3=stale nonce, -4=no credentials, -5=nonce reused
	if ($var(auth_rc) == 1) {
		# Authentication successful
		xlog("L_INFO", "AUTH_DIGEST: SUCCESS - user=$fU@$fd algorithm=$var(auth_algorithm) from=$si\n");
		$var(auth_result) = 1;
		return;
	} else if ($var(auth_rc) == -3) {
		# Stale nonce - send challenge with stale=true
		xlog("L_DBG", "AUTH_DIGEST: Stale nonce for $fU@$fd, re-challenging\n");
		route(AUTH_CHALLENGE_STALE);
		return;
	} else if ($var(auth_rc) == -2) {
		# User not found
		xlog("L_WARN", "AUTH_DIGEST: User not found - user=$fU@$fd from=$si\n");
		route(AUTH_CHALLENGE);
		return;
	} else {
		# Authentication failed - re-query DB in case HA1 changed; retry once if value differs from cache
#!ifdef WITH_HTABLE
		$var(auth_load_retry) = 1;
		if ($var(auth_algorithm) == "SHA-256") {
			$var(old_ha1) = $avp(ha1_sha256);
			route(AUTH_LOAD_HA1_SHA256_FROM_DB);
			if ($avp(ha1_sha256) != $null && $avp(ha1_sha256) != "" && $avp(ha1_sha256) != $var(old_ha1)) {
				auth_algorithm("SHA-256");
				if ($var(use_proxy_auth) == 1) {
					$var(auth_rc) = pv_proxy_authenticate("$fd", "$avp(ha1_sha256)", "1");
				} else {
					$var(auth_rc) = pv_www_authenticate("$fd", "$avp(ha1_sha256)", "1");
				}
				if ($var(auth_rc) == 1) {
					xlog("L_INFO", "AUTH_DIGEST: SUCCESS after DB refresh - user=$fU@$fd algorithm=$var(auth_algorithm) from=$si\n");
					$var(auth_result) = 1;
					return;
				}
			}
		} else {
			$var(old_ha1) = $avp(ha1_md5);
			route(AUTH_LOAD_HA1_MD5_FROM_DB);
			if ($avp(ha1_md5) != $null && $avp(ha1_md5) != "" && $avp(ha1_md5) != $var(old_ha1)) {
				auth_algorithm("MD5");
				if ($var(use_proxy_auth) == 1) {
					$var(auth_rc) = pv_proxy_authenticate("$fd", "$avp(ha1_md5)", "1");
				} else {
					$var(auth_rc) = pv_www_authenticate("$fd", "$avp(ha1_md5)", "1");
				}
				if ($var(auth_rc) == 1) {
					xlog("L_INFO", "AUTH_DIGEST: SUCCESS after DB refresh - user=$fU@$fd algorithm=$var(auth_algorithm) from=$si\n");
					$var(auth_result) = 1;
					return;
				}
			}
		}
#!endif
		xlog("L_WARN", "AUTH_DIGEST: FAILED - user=$fU@$fd algorithm=$var(auth_algorithm) rc=$var(auth_rc) from=$si\n");
		route(AUTH_CHALLENGE);
		return;
	}
}

# Load SHA-256 HA1 hash from subscriber table (or htable cache when WITH_HTABLE).
# On REGISTER we always load from DB and update cache so the cache is never stale.
# On cache miss (or REGISTER) uses AUTH_LOAD_HA1_SHA256_FROM_DB for DB read and cache update.
route[AUTH_LOAD_HA1_SHA256] {
	$avp(ha1_sha256) = $null;
#!ifdef WITH_HTABLE
	$var(ha1_key) = $fU + ":" + $fd;
	# Only called from AUTH_DIGEST when SHA-256 is allowed. REGISTER always bypasses cache.
	if (!is_method("REGISTER") && $sht(ha1_sha256=>$var(ha1_key)) != $null && $sht(ha1_sha256=>$var(ha1_key)) != "") {
		$avp(ha1_sha256) = $sht(ha1_sha256=>$var(ha1_key));
		# Touch entry to reset TTL (htable resets expiry on update when updateexpire=1)
		$sht(ha1_sha256=>$var(ha1_key)) = $avp(ha1_sha256);
		xlog("L_DBG", "AUTH_LOAD_HA1_SHA256: Reading credentials from cache for user=$fU@$fd\n");
		return;
	}
#!endif
	$var(auth_load_retry) = 0;
	route(AUTH_LOAD_HA1_SHA256_FROM_DB);
	if ($avp(ha1_sha256) == $null) {
		xlog("L_DBG", "AUTH_LOAD_HA1_SHA256: No HA1 found for user=$fU@$fd\n");
	}
	return;
}

# Load MD5 HA1 hash from subscriber table (or htable cache when WITH_HTABLE).
# On REGISTER we always load from DB and update cache so the cache is never stale.
# On cache miss (or REGISTER) uses AUTH_LOAD_HA1_MD5_FROM_DB for DB read and cache update.
route[AUTH_LOAD_HA1_MD5] {
