# -----------------------------------------------------------------------------
# Dynamic Load Balancer Discovery
# -----------------------------------------------------------------------------
# LBs are discovered dynamically from incoming OPTIONS messages.
# The htable stores discovered LB instances with auto-expire after 10 seconds
# of no OPTIONS received (LB considered down if no health checks).
#
# Table structure:
#   $sht(lbs=>IP) = "port:protocol:timestamp"
#   Example: $sht(lbs=>10.129.187.13) = "5060:tcp:1704800000"
#
# The LB list is populated by route[LB_REGISTER] when OPTIONS are received.
# LB entries auto-expire after 10 seconds of inactivity.
# -----------------------------------------------------------------------------
modparam("htable", "htable", "lbs=>size=4;autoexpire=10;")

# LB index table - maps index numbers to IP addresses for iteration
# Format: $sht(lb_idx=>N) = "IP"
# Used by LB_SELECT_DESTINATION to iterate through available LBs
modparam("htable", "htable", "lb_idx=>size=4;autoexpire=10;")

# HA1 cache for digest authentication - key "$fU:$fd", value HA1 hash
# REGISTER always refreshes from DB; on auth failure we re-query DB and retry if value changed
# size is exponent: 2^14 = 16384 slots
modparam("htable", "htable", "ha1_sha256=>size=14;autoexpire=3600;")
modparam("htable", "htable", "ha1_md5=>size=14;autoexpire=3600;")
#!endif

