	# Only called from AUTH_DIGEST when MD5 is allowed. REGISTER always bypasses cache.
	if (!is_method("REGISTER") && $sht(ha1_md5=>$var(ha1_key)) != $null && $sht(ha1_md5=>$var(ha1_key)) != "") {
		$avp(ha1_md5) = $sht(ha1_md5=>$var(ha1_key));
		# Touch entry to reset TTL (htable resets expiry on update when updateexpire=1)
		$sht(ha1_md5=>$var(ha1_key)) = $avp(ha1_md5);
		xlog("L_DBG", "AUTH_LOAD_HA1_MD5: Reading credentials from cache for user=$fU@$fd\n");
		return;
	}
#!endif
	$var(auth_load_retry) = 0;
