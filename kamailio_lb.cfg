# --- HTable replication of your backend affinity ---
# Two htables with different TTLs:
#   - dlg_backend_sub: SUBSCRIBE dialogs (default: 1 day TTL = 86400s, matches refresh interval)
#   - dlg_backend: Other dialogs like INVITE (default: 12 hours TTL = 43200s)
# TTLs and hash sizes are configurable via environment variables:
#   - DLG_BACKEND_SUB_TTL: TTL in seconds for SUBSCRIBE dialogs (default: 86400)
#   - DLG_BACKEND_TTL: TTL in seconds for other dialogs (default: 43200)
#   - DLG_BACKEND_SUB_HASH_SIZE: Hash table size (power of 2) for SUBSCRIBE dialogs (default: 10 = 2^10 = 1024 buckets)
#   - DLG_BACKEND_HASH_SIZE: Hash table size (power of 2) for other dialogs (default: 11 = 2^11 = 2048 buckets)
# Note: htable 'size' parameter is a power of 2, not the actual bucket count. size=10 means 2^10=1024 buckets.
#!ifdef WITH_K8S
#!trydefenvs DLG_BACKEND_SUB_TTL
#!trydefenvs DLG_BACKEND_TTL
#!trydefenvs DLG_BACKEND_SUB_HASH_SIZE
#!trydefenvs DLG_BACKEND_HASH_SIZE
# Set defaults if env vars not provided
#!ifndef DLG_BACKEND_SUB_TTL
#!define DLG_BACKEND_SUB_TTL 86400
#!endif
#!ifndef DLG_BACKEND_TTL
#!define DLG_BACKEND_TTL 43200
#!endif
#!ifndef DLG_BACKEND_SUB_HASH_SIZE
#!define DLG_BACKEND_SUB_HASH_SIZE 10
#!endif
#!ifndef DLG_BACKEND_HASH_SIZE
#!define DLG_BACKEND_HASH_SIZE 11
#!endif
# Use modparamx() with $def() to expand define values in the htable parameter string
# This avoids the need for sed replacement at container startup
modparamx("htable", "htable", "dlg_backend_sub=>size=$def(DLG_BACKEND_SUB_HASH_SIZE);autoexpire=$def(DLG_BACKEND_SUB_TTL);dmqreplicate=1")
modparamx("htable", "htable", "dlg_backend=>size=$def(DLG_BACKEND_HASH_SIZE);autoexpire=$def(DLG_BACKEND_TTL);dmqreplicate=1")
#!else
# VM mode: use defaults
# size=10 means 2^10=1024 buckets, size=11 means 2^11=2048 buckets
modparam("htable", "htable", "dlg_backend_sub=>size=10;autoexpire=86400;dmqreplicate=1")
modparam("htable", "htable", "dlg_backend=>size=11;autoexpire=43200;dmqreplicate=1")
#!endif
modparam("htable", "enable_dmq", 1)
modparam("htable", "dmq_init_sync", 1)

# --- HTable cache for pod IP to dispatcher FQDN mapping (K8s only) ---
# Cache expires after 60s (must be >= TIMER_INTERVAL to prevent stale entries)
# No DMQ replication needed - this is a local cache rebuilt by TIMER route
#!ifdef WITH_K8S
modparam("htable", "htable", "ip2fqdn=>size=256;autoexpire=60")
# --- HTable for dispatcher diagnostic check (one-time flag) ---
modparam("htable", "htable", "dispatcher_cache=>size=8;autoexpire=3600")
#!endif

