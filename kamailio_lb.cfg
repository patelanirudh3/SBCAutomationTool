####### Routing Logic ########

# ===========================================================================
# RECORD-ROUTE HELPER
# ===========================================================================
# Uses lb_cluster_fqdn from database (via av_lb module) for Record-Route headers.
# This allows the LB to advertise the Azure Load Balancer IP instead of pod IP.
#
# Priority:
# 1. $avp(lb_cluster_fqdn) from database (set by av_lb_load_config)
# 2. Fallback to record_route() which uses listen advertise or pod IP
# ===========================================================================
route[ADD_RECORD_ROUTE] {
    # Check if lb_cluster_fqdn is set (from database via av_lb)
    if ($avp(lb_cluster_fqdn) != $null && $avp(lb_cluster_fqdn) != "") {
        # Build Record-Route URI for record_route_preset()
        # Note: record_route_preset() automatically adds "sip:" prefix and ";lr=on" parameter
        # So we pass: <fqdn>:<port>;transport=tcp (without "sip:" prefix or ";lr")
        $var(lb_port) = $avp(lb_cluster_port);
        if ($var(lb_port) == $null || $var(lb_port) == "" || $var(lb_port) == "0") {
            $var(lb_port) = "5060";
        }
        $var(rr_uri) = $avp(lb_cluster_fqdn) + ":" + $var(lb_port) + ";transport=tcp";
        xlog("L_INFO", "ADD_RECORD_ROUTE: Using lb_cluster_fqdn=$avp(lb_cluster_fqdn), port=$var(lb_port)\n");
        record_route_preset("$var(rr_uri)");
    } else {
        # Fallback: use listen advertise (set by entrypoint from LB_FQDN env var)
        xlog("L_DBG", "ADD_RECORD_ROUTE: lb_cluster_fqdn not set, using listen advertise\n");
        record_route();
    }
}

# ===========================================================================
# DIALOG BACKEND HTABLE HELPERS
# ===========================================================================
# Two htables for dialog-backend affinity with different TTLs:
#   - dlg_backend_sub: SUBSCRIBE dialogs (1 day TTL)
#   - dlg_backend: Other dialogs like INVITE (12 hours TTL)
#
# These helpers abstract access to ensure correct htable is used based on method.
# ===========================================================================

# GET_DLG_BACKEND: Retrieve stored backend for current Call-ID
# Input: $ci (Call-ID), $rm (method) - used to determine which htable to check first
# Output: $var(dlg_be) - backend URI or $null if not found
#         $var(dlg_be_is_sub) - 1 if from SUBSCRIBE htable, 0 otherwise
route[GET_DLG_BACKEND] {
    $var(dlg_be) = $null;
    $var(dlg_be_is_sub) = 0;
    
    # Check method type first to determine which htable to check
    # This is more efficient (typically one lookup instead of two) and ensures
    # SUBSCRIBE methods check SUBSCRIBE htable first, others check regular htable first
    if (is_method("SUBSCRIBE")) {
        # SUBSCRIBE methods use dlg_backend_sub htable
        if ($sht(dlg_backend_sub=>$ci) != $null) {
            $var(dlg_be) = $sht(dlg_backend_sub=>$ci);
            $var(dlg_be_is_sub) = 1;
            return;
        }
    } else {
        # Other methods (INVITE, BYE, etc.) use regular dlg_backend htable
        if ($sht(dlg_backend=>$ci) != $null) {
            $var(dlg_be) = $sht(dlg_backend=>$ci);
            return;
        }
    }
    
    # Fallback: For in-dialog requests, if not found in method-specific htable,
    # check the other htable (e.g., NOTIFY in SUBSCRIBE dialog might be in SUBSCRIBE htable)
    if (has_totag()) {
        if (is_method("SUBSCRIBE")) {
            # Already checked SUBSCRIBE htable above, check regular htable as fallback
            if ($sht(dlg_backend=>$ci) != $null) {
                $var(dlg_be) = $sht(dlg_backend=>$ci);
                return;
            }
        } else {
            # Already checked regular htable above, check SUBSCRIBE htable as fallback
            if ($sht(dlg_backend_sub=>$ci) != $null) {
                $var(dlg_be) = $sht(dlg_backend_sub=>$ci);
                $var(dlg_be_is_sub) = 1;
                return;
            }
        }
    }
}

# SET_DLG_BACKEND: Store backend for current Call-ID in appropriate htable
# Input: $ci (Call-ID), $var(dlg_be_val) - backend URI to store
# For initial requests: uses method to determine htable
# For in-dialog requests: updates existing entry in same htable
route[SET_DLG_BACKEND] {
    # For in-dialog requests, update existing entry in same htable
    if (has_totag()) {
        # Check which htable has the existing entry
        if ($sht(dlg_backend_sub=>$ci) != $null) {
            $sht(dlg_backend_sub=>$ci) = $var(dlg_be_val);
            xlog("L_DBG", "SET_DLG_BACKEND: Updated SUBSCRIBE backend $var(dlg_be_val)\n");
            return;
        }
        if ($sht(dlg_backend=>$ci) != $null) {
            $sht(dlg_backend=>$ci) = $var(dlg_be_val);
            xlog("L_DBG", "SET_DLG_BACKEND: Updated backend $var(dlg_be_val)\n");
            return;
        }
        # No existing entry - fall through to method-based selection
    }
    
    # Initial request or no existing entry: use method to determine htable
    if (is_method("SUBSCRIBE")) {
        $sht(dlg_backend_sub=>$ci) = $var(dlg_be_val);
        xlog("L_DBG", "SET_DLG_BACKEND: Stored SUBSCRIBE backend $var(dlg_be_val) in dlg_backend_sub\n");
    } else {
        $sht(dlg_backend=>$ci) = $var(dlg_be_val);
        xlog("L_DBG", "SET_DLG_BACKEND: Stored backend $var(dlg_be_val) in dlg_backend\n");
    }
}

# TOUCH_DLG_BACKEND: Refresh TTL for existing entry
# Input: $ci (Call-ID)
route[TOUCH_DLG_BACKEND] {
    # Touch whichever htable has the entry to refresh its TTL
    if ($sht(dlg_backend_sub=>$ci) != $null) {
        $sht(dlg_backend_sub=>$ci) = $sht(dlg_backend_sub=>$ci);
        return;
    }
    if ($sht(dlg_backend=>$ci) != $null) {
        $sht(dlg_backend=>$ci) = $sht(dlg_backend=>$ci);
    }
}

# ===========================================================================
# VIA HEADER NOTE
# ===========================================================================
# Via headers are set at the listen socket level via the 'advertise' parameter
# in the listen directive. The entrypoint script queries the database for
# lb_cluster_fqdn and sets it in the listen advertise parameter at startup.
# This ensures both Record-Route and Via headers use the Azure LB IP.
#
# Priority (set by entrypoint script):
# 1. lb_cluster_fqdn from database (av_sip_config table)
# 2. Fallback to LB_FQDN env var
# ===========================================================================

# Helper: Extract original client IP from the bottom Via header
# This is useful when the source IP ($si) has been NAT'd (e.g., by k3d proxy)
# The bottom Via contains the original sender's IP address
# Sets $var(via_src_ip) with the extracted IP
route[GET_VIA_SRC_IP] {
    $var(via_count) = $hdrc(Via);
    if ($var(via_count) > 0) {
        # Get the bottom (last) Via header (index is 0-based)
        $var(last_via_idx) = $var(via_count) - 1;
        $var(bottom_via) = $(hdr(Via)[$var(last_via_idx)]);
        # Via format: "SIP/2.0/TCP 10.129.177.102;branch=..."
        # Extract: get text after "SIP/2.0/xxx " and before ";" or ":"
        # Step 1: Get the host:port part (second space-delimited field)
        $var(via_host_part) = $(var(bottom_via){s.select,1, });
        # Step 2: Remove branch parameter (everything after ";")
        $var(via_src_ip) = $(var(via_host_part){s.select,0,;});
        # Step 3: Remove port if present (everything after ":")
        $var(via_src_ip) = $(var(via_src_ip){s.select,0,:});
        xlog("L_DBG", "GET_VIA_SRC_IP: bottom_via=$var(bottom_via) -> via_src_ip=$var(via_src_ip)\n");
    } else {
        # Fallback to socket source IP if no Via headers
        $var(via_src_ip) = $si;
        xlog("L_DBG", "GET_VIA_SRC_IP: no Via headers, using $si=$var(via_src_ip)\n");
    }
}

# Helper: Find dispatcher FQDN that matches source pod IP
# Sidecar stores pod_ip in dispatcher attrs (e.g., "weight=50;pod_ip=10.42.0.107")
# Strategy: 
#   1. Check htable cache first (ip2fqdn)
#   2. On cache miss, query dispatcher table via SQL
#   3. Cache the result for future lookups
# Sets $var(backend_fqdn) with matching FQDN, or null if not found
#!ifdef WITH_K8S
#!ifdef WITH_MYSQL
route[FIND_BACKEND_FQDN_BY_IP] {
    $var(backend_fqdn) = $null;
    $var(src_ip) = $si;

    # Security: Validate source IP contains only valid IP address characters
    # IP addresses can contain: digits (0-9), dots (.), colons (:), and letters (a-f, A-F for IPv6)
    # This prevents SQL injection if $si is somehow manipulated
    if (!($var(src_ip) =~ "^[0-9a-fA-F:\\.]+$")) {
        xlog("L_WARN", "FIND_BACKEND_FQDN_BY_IP: Invalid IP format: $var(src_ip), skipping SQL query\n");
        return;
    }
    
    # Just check the cache - no DB query!
    # Cache is populated by TIMER route when dispatcher reloads
    # Trust the cache - if not there, it's not a backend
    if ($sht(ip2fqdn=>$var(src_ip)) != $null) {
        $var(backend_fqdn) = $sht(ip2fqdn=>$var(src_ip));
        xlog("L_DBG", "FIND_BACKEND_FQDN_BY_IP: cache HIT - IP $var(src_ip) -> FQDN $var(backend_fqdn)\n");
    } else {
        xlog("L_DBG", "FIND_BACKEND_FQDN_BY_IP: cache MISS for IP $var(src_ip) - not a known backend\n");
    }
}
#!else
# Without MySQL, we can't query dispatcher table - fallback to IP storage
route[FIND_BACKEND_FQDN_BY_IP] {
    $var(backend_fqdn) = $null;
    xlog("L_WARN", "FIND_BACKEND_FQDN_BY_IP: MySQL not enabled, cannot query dispatcher table\n");
}
#!endif
#!endif

# ===========================================================================
# BACKEND IP HELPERS - Generic checks for any number of backends
# ===========================================================================
# These helpers check if an IP is a known backend from the dispatcher table.
# This replaces the hardcoded be_ip1/be_ip2 checks with a dynamic approach
# that supports any number of backends.
#
# Uses dispatcher module's built-in cache (no extra htable needed for VM mode).
# K8s mode uses ip2fqdn htable since dispatcher has FQDNs, not pod IPs.
# ===========================================================================

# Helper: Check if source IP ($si) is a known backend from dispatcher
# Sets $var(is_from_backend) = 1 if source is a backend, 0 otherwise
#
# VM mode: Uses ds_is_in_list() which checks dispatcher's internal cache
# K8s mode: Uses ip2fqdn htable (populated by TIMER route when dispatcher reloads)
#
# No DB queries - we trust the cache! Cache is refreshed via TIMER route (interval configurable via TIMER_INTERVAL env var).
route[IS_FROM_BACKEND] {
    $var(is_from_backend) = 0;

#!ifdef WITH_K8S
    # K8s mode: Check ip2fqdn htable cache (pod IP -> FQDN mapping)
    # Cache is populated by TIMER route when dispatcher reloads
    # Just trust the cache - if not there, it's not a backend
    if ($sht(ip2fqdn=>$si) != $null) {
        $var(is_from_backend) = 1;
        xlog("L_DBG", "IS_FROM_BACKEND: $si is a known backend (ip2fqdn cache)\n");
        return;
    }
#!else
    # VM mode: Use dispatcher's built-in ds_is_in_list() function
    # This uses dispatcher's internal cache - no extra DB queries needed
    # ds_is_in_list(ip, port, setid) - checks if ip:port is in dispatcher set
    if (ds_is_in_list("$si", "", "1")) {
        $var(is_from_backend) = 1;
        xlog("L_DBG", "IS_FROM_BACKEND: $si is a known backend (dispatcher cache hit)\n");
        return;
    }
#!endif

    xlog("L_DBG", "IS_FROM_BACKEND: $si is NOT a known backend\n");
}

# Helper: Check if R-URI host is a known backend
# Sets $var(is_ruri_backend) = 1 if R-URI points to a backend, 0 otherwise
# Input: $var(check_host) - the host to check (set before calling)
#
# VM mode: Uses ds_is_in_list() with dispatcher's internal cache
# K8s mode: Checks FQDN pattern + ip2fqdn cache (populated by TIMER route)
#
# No DB queries - we trust the cache! Cache is refreshed via TIMER route (interval configurable via TIMER_INTERVAL env var).
route[IS_RURI_BACKEND] {
    $var(is_ruri_backend) = 0;

#!ifdef WITH_K8S
    # K8s mode: Check if host matches backend FQDN pattern
    if ($var(check_host) =~ "kamailio-backend.*\\.svc\\.cluster\\.local" ||
        $var(check_host) =~ "kamailio-sm.*\\.svc\\.cluster\\.local") {
        $var(is_ruri_backend) = 1;
        xlog("L_DBG", "IS_RURI_BACKEND: $var(check_host) matches backend FQDN pattern\n");
        return;
    }

    # Also check if it's a pod IP in our cache
    # Cache is populated by TIMER route when dispatcher reloads
    # Just trust the cache - if not there, it's not a backend
    if (is_ipv4($var(check_host))) {
        if ($sht(ip2fqdn=>$var(check_host)) != $null) {
            $var(is_ruri_backend) = 1;
            xlog("L_DBG", "IS_RURI_BACKEND: $var(check_host) is a known backend pod IP (cache)\n");
            return;
        }
    }
#!else
    # VM mode: Use dispatcher's ds_is_in_list() for IP-based backends
    if (is_ipv4($var(check_host))) {
        if (ds_is_in_list("$var(check_host)", "", "1")) {
            $var(is_ruri_backend) = 1;
            xlog("L_DBG", "IS_RURI_BACKEND: $var(check_host) is a known backend IP (dispatcher cache)\n");
            return;
        }
    }
#!endif

    xlog("L_DBG", "IS_RURI_BACKEND: $var(check_host) is NOT a known backend\n");
}

# Helper: standard relay
route[RELAY] {
    # Extract original client IP from bottom Via header (handles NAT scenarios)
    route(GET_VIA_SRC_IP);
        
    # Check if we're sending to front end (by checking destination URI host)
    $var(dst_host) = $(du{uri.host});
    if ($var(dst_host) == $null || $var(dst_host) == "") {
        # If $du is empty, check R-URI instead
        $var(dst_host) = $(ru{uri.host});
    }
    
    # If sending to front end, include only Azure LB IP in X-Forwarded-For header
    if ($var(dst_host) == $avp(fe_ip1) || $var(dst_host) == $avp(fe_ip2)) {
        # Remove any existing X-Forwarded-For header (backend may have added its own)
        # Remove multiple times to ensure all instances are removed
        while ($hdrc(X-Forwarded-For) > 0) {
            remove_hf("X-Forwarded-For");
        }
        # Format: azure-lb-ip only (no backend IP, no client IP)
        if ($avp(lb_cluster_fqdn) != $null && $avp(lb_cluster_fqdn) != "") {
            append_hf("X-Forwarded-For: $avp(lb_cluster_fqdn)\r\n");
            xlog("L_INFO", "RELAY: Set X-Forwarded-For to Azure LB only: $avp(lb_cluster_fqdn) (dst=$var(dst_host), fe_ip1=$avp(fe_ip1), fe_ip2=$avp(fe_ip2))\n");
        } else {
            # Fallback if Azure LB IP not available - don't add header
            xlog("L_WARN", "RELAY: Azure LB IP not available, not adding X-Forwarded-For header\n");
        }
    } else {
        # Not sending to front end — set X-Forwarded-For based on destination type
        remove_hf("X-Forwarded-For");

        # Check if destination is a known backend
        $var(check_host) = $var(dst_host);
        route(IS_RURI_BACKEND);

        if ($var(is_ruri_backend) == 1) {
            # Sending to backend — use original client IP from Via header
            # Backend needs to see the real client IP, not the Azure LB IP
            append_hf("X-Forwarded-For: $var(via_src_ip)\r\n");
            xlog("L_INFO", "RELAY: X-Forwarded-For set to original client IP (to backend): $var(via_src_ip)\n");
        } else {
            # Sending to external server — use Azure LB IP
            # External servers should see the Azure LB as the source
            if ($avp(lb_cluster_fqdn) != $null && $avp(lb_cluster_fqdn) != "") {
                append_hf("X-Forwarded-For: $avp(lb_cluster_fqdn)\r\n");
                xlog("L_INFO", "RELAY: X-Forwarded-For set to Azure LB IP (to external): $avp(lb_cluster_fqdn)\n");
            } else {
                # Fallback to original client IP if Azure LB IP not available
                append_hf("X-Forwarded-For: $var(via_src_ip)\r\n");
                xlog("L_WARN", "RELAY: Azure LB IP not available, using client IP: $var(via_src_ip)\n");
            }
        }
    }
    
    # Enable TCP keepalive on outgoing connection (applies to connection created by t_relay())
    # This ensures kamailio-lb sends keepalive probes on all outgoing TCP connections
    if (proto == TCP) {
        tcp_keepalive_enable("", 60, 5, 5);
    }
    
    if (!t_relay()) {
        sl_reply_error();
    }
    exit;
}

# Initial checks, allow only the feature server source over TCP
route[REQINIT] {
    xlog("L_INFO", "REQINIT: Processing method=$rm from $si:$sp to $Ri:$Rp ru=$ru proto=$pr\n");
    
    # Quietly drop common scanner UAs (keep list aligned with backend)
    if($ua =~ "friendly|scanner|sipcli|sipvicious|VaxSIPUserAgent|pplsip") {
        xlog("L_NOTICE", "REQINIT: Dropping scanner UA=$ua from $si:$sp\n");
        exit;
    }

    if (!mf_process_maxfwd_header("10")) {
        sl_send_reply("483", "Too Many Hops"); exit;
    }

    if (!sanity_check("1511", "7")) {
        xlog("L_ERR", "REQINIT: Malformed SIP from $si:$sp\n"); exit;
    }

    # Respond locally to OPTIONS directed at the LB itself (health checks)
    # - uri==myself: R-URI matches one of our listen addresses
    # - $rU==$null: no username in R-URI (not a user lookup)
    if (is_method("OPTIONS") && uri==myself && $rU==$null) {
        sl_send_reply("200", "Keepalive");
        exit;
    }

#!ifdef WITH_K8S
    # K8s: Allow traffic from any source (NetworkPolicy handles restrictions)
    if (proto != TCP) {
        xlog("L_WARN", "REQINIT: Rejecting non-TCP request proto=$pr from $si:$sp\n");
        sl_send_reply("403", "Forbidden - TCP only"); 
        exit;
    }
    xlog("L_INFO", "REQINIT: K8s mode - accepting TCP request from $si:$sp\n");
#!else
    # VM: Restrict source to the front-end feature server or backend IPs (from dispatcher)
    # Check frontend IPs first
    $var(is_from_fe) = 0;
    if ($si == $avp(fe_ip1) || $si == $avp(fe_ip2)) {
        $var(is_from_fe) = 1;
    }

    # Check if source is a known backend (from dispatcher table)
    route(IS_FROM_BACKEND);

    if (proto != TCP || ($var(is_from_fe) == 0 && $var(is_from_backend) == 0)) {
        xlog("L_WARN", "REQINIT: Rejecting request from unauthorized source $si:$sp (proto=$pr, fe_ip1=$avp(fe_ip1), fe_ip2=$avp(fe_ip2), is_backend=$var(is_from_backend))\n");
        sl_send_reply("403", "Forbidden");
        exit;
    }
    xlog("L_INFO", "REQINIT: VM mode - accepting request from authorized source $si:$sp (is_fe=$var(is_from_fe), is_be=$var(is_from_backend))\n");
#!endif
}

# Handle in-dialog routing (pure pass-through)
route[WITHINDLG] {
    if (!has_totag()) return;   # initial request, not in-dialog

    # Follow Record-Route path and forward the request statefully
    # Check first Route header BEFORE loose_route() processes it to detect if it points to LB
    $var(first_route_host) = $null;
    $var(first_route_points_to_lb) = 0;
    if ($hdrc(Route) > 0) {
        $var(first_route_uri) = $(hdr(Route)[0]{nameaddr.uri});
        if ($var(first_route_uri) != $null && $var(first_route_uri) != "") {
            $var(first_route_host) = $(var(first_route_uri){uri.host});
            xlog("L_INFO", "WITHINDLG: First Route header host: $var(first_route_host), lb_cluster_fqdn=$avp(lb_cluster_fqdn)\n");
            # Check if first Route header points to LB (by IP or FQDN)
            if ($var(first_route_host) == $avp(lb_cluster_fqdn) 
                || $var(first_route_host) == "lb-kamailio-sm.dr.avaya.com") {
                $var(first_route_points_to_lb) = 1;
                xlog("L_INFO", "WITHINDLG: First Route header points to LB: $var(first_route_host)\n");
            }
        }
    }
    
    if (loose_route()) {
        # If we remembered a backend for this dialog, force it
        route(GET_DLG_BACKEND);
	    xlog("L_INFO", "WITHINDLG:loose_route: dialog backend $var(dlg_be), si  $si, URI host $(ru{uri.host}), du=$du\n");

        # If all Route headers are consumed, route to R-URI (e.g., ACK after consuming Route headers)
        # Use dynamic lb_cluster_fqdn from DB (covers Azure LB IP, pod IP, and any FQDN)
        $var(du_host) = $(du{uri.host});
        if ($du == $null || $du == "") {
            $var(ruri_host) = $(ru{uri.host});
            xlog("L_INFO", "WITHINDLG: All Route headers consumed, routing to R-URI $ru (host=$var(ruri_host))\n");
            
            # For ACK, always route to R-URI (follows Record-Route path)
            # Use route(RELAY) for consistency - it handles X-Forwarded-For and relays statefully
            if (is_method("ACK")) {
                setdsturi($ru);
                route(RELAY);
                exit;
            }
            
            # For other methods, route to R-URI if it points to front end or backend
            # Ensure transport=tcp is set (backend Contact may have empty transport parameter)
            # Construct destination URI with transport=tcp
            $var(ruri_port) = $(ru{uri.port});
            if ($var(ruri_port) == $null || $var(ruri_port) == "") {
                $var(ruri_port) = "5060";
            }
            $var(ruri_user) = $(ru{uri.user});
            # Build URI: sip:user@host:port;transport=tcp
            if ($var(ruri_user) != $null && $var(ruri_user) != "") {
                $var(dst_uri) = "sip:" + $var(ruri_user) + "@" + $var(ruri_host) + ":" + $var(ruri_port) + ";transport=tcp";
            } else {
                $var(dst_uri) = "sip:" + $var(ruri_host) + ":" + $var(ruri_port) + ";transport=tcp";
            }
            # Add other URI parameters from R-URI (skip transport-related params)
            $var(ruri_params) = $(ru{uri.params});
            if ($var(ruri_params) != $null && $var(ruri_params) != "") {
                # Only add params that don't contain "transport"
                if (!($var(ruri_params) =~ "transport")) {
                    $var(dst_uri) = $var(dst_uri) + ";" + $var(ruri_params);
                }
            }
            setdsturi($var(dst_uri));
            t_on_failure("RTF_DISPATCH");
            route(RELAY);
            exit;
        }

        # FIX: If first Route header pointed to LB and Route headers remain, process next Route header
        # loose_route() did NOT remove the first Route (Kamailio doesn't recognize Azure LB IP as "myself").
        # So $du points to the LB — we need to skip it and forward to the next Route header.
        # Detection: Check if $du points to LB (by comparing with lb_cluster_fqdn)
        $var(du_points_to_lb) = 0;
        if ($var(du_host) != $null && $var(du_host) != "") {
            if ($var(du_host) == $avp(lb_cluster_fqdn) || $var(du_host) == "lb-kamailio-sm.dr.avaya.com") {
                $var(du_points_to_lb) = 1;
                xlog("L_INFO", "WITHINDLG: $du points to LB (matched lb_cluster_fqdn or hardcoded FQDN)\n");
            }
        }
        
        # If first Route header pointed to LB OR $du points to LB, and Route headers remain, process next Route header
        # NOTE: loose_route() does NOT remove the first Route header when it doesn't match "myself"
        # (Kamailio doesn't recognize the Azure LB IP as itself since no alias is configured).
        # So Route[0] is still the LB's Route — we need Route[1] to get the actual next hop.
        if (($var(first_route_points_to_lb) == 1 || $var(du_points_to_lb) == 1) && $hdrc(Route) > 1) {
            $var(next_route) = $(hdr(Route)[1]{nameaddr.uri});
            if ($var(next_route) != $null && $var(next_route) != "") {
                setdsturi($var(next_route));
                $var(next_route_host) = $(var(next_route){uri.host});
                xlog("L_INFO", "WITHINDLG: First Route pointed to LB (first_route_points_to_lb=$var(first_route_points_to_lb), du_points_to_lb=$var(du_points_to_lb)), forwarding to next Route: $var(next_route) (host=$var(next_route_host))\n");
                t_on_failure("RTF_DISPATCH");
                route(RELAY);
                exit;
            } else {
                xlog("L_WARN", "WITHINDLG: First Route pointed to LB but next Route header is empty/null\n");
            }
        } else {
            xlog("L_INFO", "WITHINDLG: Not processing next Route - first_route_points_to_lb=$var(first_route_points_to_lb), du_points_to_lb=$var(du_points_to_lb), remaining Route headers=$hdrc(Route), du=$du, du_host=$var(du_host)\n");
        }

        # If request comes from feature server and R-URI host is a known backend, route directly
        # Generic check for any backend IP from dispatcher table
        $var(check_host) = $(ru{uri.host});
        route(IS_RURI_BACKEND);

        if (($si == $avp(fe_ip1) || $si == $avp(fe_ip2)) && $var(is_ruri_backend) == 1) {
            # R-URI points to a known backend - construct destination URI with default port
            $var(ruri_port) = $(ru{uri.port});
            if ($var(ruri_port) == $null || $var(ruri_port) == "") {
                $var(ruri_port) = "5060";
            }
            # Construct destination URI from R-URI host (preserving R-URI unchanged)
            # setdsturi() sets $du (destination URI) for routing, NOT $ru (Request-URI)
            # This ensures transport=tcp is explicitly set for backend routing
            $var(be_uri) = "sip:" + $var(check_host) + ":" + $var(ruri_port) + ";transport=tcp";
            setdsturi($var(be_uri));
            xlog("L_INFO", "WITHINDLG: loose_route NOTIFY/REQ from FE, honoring R-URI, send to backend $var(check_host)\n");
            $var(dlg_be_val) = $var(be_uri);
            route(SET_DLG_BACKEND);
        } else if ($var(is_ruri_backend) == 0
            && $var(check_host) != $avp(fe_ip1) && $var(check_host) != $avp(fe_ip2)
            && $var(check_host) != $avp(lb_cluster_fqdn)
            && $var(check_host) != "lb-kamailio-sm.dr.avaya.com") {
            # R-URI points to an external destination (not FE, not backend, not LB)
            # This handles BYE/other in-dialog requests from backend toward external endpoints
            # FIX: Only override $du when no Route headers remain — respect Route set when present
            if ($hdrc(Route) == 0) {
                $var(ruri_port) = $(ru{uri.port});
                if ($var(ruri_port) == $null || $var(ruri_port) == "") {
                    $var(ruri_port) = "5060";
                }
                $var(ruri_user) = $(ru{uri.user});
                if ($var(ruri_user) != $null && $var(ruri_user) != "") {
                    $var(ext_uri) = "sip:" + $var(ruri_user) + "@" + $var(check_host) + ":" + $var(ruri_port) + ";transport=tcp";
                } else {
                    $var(ext_uri) = "sip:" + $var(check_host) + ":" + $var(ruri_port) + ";transport=tcp";
                }
                setdsturi($var(ext_uri));
                xlog("L_INFO", "WITHINDLG: loose_route from backend $si, R-URI points to external $var(check_host), routing to $var(ext_uri)\n");
            } else {
                # Route headers present — $du from loose_route() points to correct next hop, don't override
                xlog("L_INFO", "WITHINDLG: R-URI external ($var(check_host)) but Route headers present, relaying to $du\n");
            }
        } else if ($var(dlg_be) != $null && ds_is_active("1", $var(dlg_be))) {
		    xlog("L_INFO", "WITHINDLG: loose_route: existing backend $var(dlg_be) \n");
        	setdsturi($var(dlg_be));
		    # Touch entry to refresh htable autoexpire
		    route(TOUCH_DLG_BACKEND);
    	} else {
        	if (!ds_select_dst("1", "0")) {
            	sl_send_reply("500", "No backend available");
            	exit;
        	}
        	setdsturi($du);
        	$var(dlg_be_val) = $du;
        	route(SET_DLG_BACKEND);
        	xlog("L_INFO", "WITHINDLG: set backend to $du\n");
    	}

        t_on_failure("RTF_DISPATCH");
        route(RELAY);
        exit;
    }

    # In-dialog request without Route headers (e.g., SUBSCRIBE refresh from front end)
    # Route based on stored dialog backend or R-URI
    xlog("L_INFO", "WITHINDLG: in-dialog request without Route headers, Call-ID=$ci, R-URI=$ru\n");
    
    # Stateful ACK handling pattern (no local replies)
    if (is_method("ACK")) {
        if (!t_check_trans()) {
       	    xlog("L_NOTICE", "WITHINDLG: Statelessly relaying stray ACK: $fu to $ru");
        }
        # Extract original client IP from bottom Via header (handles NAT scenarios)
        route(GET_VIA_SRC_IP);
        remove_hf("X-Forwarded-For");
        append_hf("X-Forwarded-For: $var(via_src_ip):$sp\r\n");
    	t_relay();
    	exit;
    }

    # For in-dialog requests without Route headers, try to route to stored backend or R-URI
    $var(ruri_host) = $(ru{uri.host});
    
    # If R-URI points to a backend FQDN (K8s) or backend IP (VM), route directly
    # Ensure transport=tcp is set (backend Contact may have empty transport parameter)
    $var(ruri_port) = $(ru{uri.port});
    if ($var(ruri_port) == $null || $var(ruri_port) == "") {
        $var(ruri_port) = "5060";
    }
    $var(ruri_user) = $(ru{uri.user});
    # Build URI: sip:user@host:port;transport=tcp
    if ($var(ruri_user) != $null && $var(ruri_user) != "") {
        $var(dst_uri) = "sip:" + $var(ruri_user) + "@" + $var(ruri_host) + ":" + $var(ruri_port) + ";transport=tcp";
    } else {
        $var(dst_uri) = "sip:" + $var(ruri_host) + ":" + $var(ruri_port) + ";transport=tcp";
    }
    # Add other URI parameters from R-URI (skip transport-related params)
    $var(ruri_params) = $(ru{uri.params});
    if ($var(ruri_params) != $null && $var(ruri_params) != "") {
        # Only add params that don't contain "transport"
        if (!($var(ruri_params) =~ "transport")) {
            $var(dst_uri) = $var(dst_uri) + ";" + $var(ruri_params);
        }
    }

    # Check if R-URI host is a known backend (works for both K8s FQDNs and VM IPs)
    $var(check_host) = $var(ruri_host);
    route(IS_RURI_BACKEND);

    if ($var(is_ruri_backend) == 1) {
        setdsturi($var(dst_uri));
        xlog("L_INFO", "WITHINDLG: R-URI points to backend $var(ruri_host), routing directly with transport=tcp\n");
        t_on_failure("RTF_DISPATCH");
        route(RELAY);
        exit;
    }

    # R-URI points to external destination (not backend, not FE, not LB)
    # Route to R-URI directly (e.g., BYE from backend to CM/SBC)
    if ($var(ruri_host) != $avp(fe_ip1) && $var(ruri_host) != $avp(fe_ip2)
        && $var(ruri_host) != $avp(lb_cluster_fqdn)
        && $var(ruri_host) != "lb-kamailio-sm.dr.avaya.com") {
        setdsturi($var(dst_uri));
        xlog("L_INFO", "WITHINDLG: no Route headers, R-URI points to external $var(ruri_host), routing to $var(dst_uri)\n");
        t_on_failure("RTF_DISPATCH");
        route(RELAY);
        exit;
    }
    
    # Try to use stored dialog backend
    route(GET_DLG_BACKEND);
    if ($var(dlg_be) != $null && ds_is_active("1", $var(dlg_be))) {
        xlog("L_INFO", "WITHINDLG: using stored dialog backend $var(dlg_be)\n");
        setdsturi($var(dlg_be));
        # Touch entry to refresh htable autoexpire
        route(TOUCH_DLG_BACKEND);
        t_on_failure("RTF_DISPATCH");
        route(RELAY);
        exit;
    }
    
    # Fallback: use dispatcher to select backend (shouldn't happen for in-dialog, but handle gracefully)
    xlog("L_WARN", "WITHINDLG: no stored backend for Call-ID $ci, using dispatcher\n");
    if (!ds_select_dst("1", "0")) {
        sl_send_reply("500", "No backend available");
        exit;
    }
    setdsturi($du);
    $var(dlg_be_val) = $du;
    route(SET_DLG_BACKEND);
    t_on_failure("RTF_DISPATCH");
    route(RELAY);
    exit;
}


# Pick a dispatcher destination and forward OPTIONS
route[HANDLE_OPTIONS] {
    # Select a destination from dispatcher set 1 (adjust as needed)
    if (!ds_select_dst("1", "4")) {
        xlog("L_ERR", "HANDLE_OPTIONS:DISPATCHER: no destination available for OPTIONS\n");
        sl_send_reply("500", "No Destination");
        exit;
    }

    # Create a transaction and forward
    if (!t_newtran()) {
        sl_send_reply("500", "Transaction Error");
        exit;
    }

    xlog("L_INFO", "HANDLE_OPTIONS: Forwarding OPTIONS to <$du> from $si:$sp\n");
    # Extract original client IP from bottom Via header (handles NAT scenarios)
    route(GET_VIA_SRC_IP);
    remove_hf("X-Forwarded-For");
    append_hf("X-Forwarded-For: $var(via_src_ip):$sp\r\n");
    t_on_reply("OPTIONS_REPLY");   # optional: handle replies from backend
    t_relay();
    exit;
}


# Reply handler must be at TOP LEVEL (not nested)
onreply_route[OPTIONS_REPLY] {
    xlog("L_INFO", "OPTIONS_REPLY: reply $rs from <$si:$sp> relayed\n");
}

# Timer route: Automatically reload dispatcher from database periodically
# This ensures dispatcher picks up new backend pods even if sidecar RPC fails
# Timer interval configurable via TIMER_INTERVAL env var (default 30s, should match sidecar sync)
#!ifdef WITH_K8S
route[TIMER] {
    # Reload dispatcher from database periodically
    # This is a backup in case sidecar RPC FIFO write fails
    xlog("L_INFO", "TIMER: Auto-reloading dispatcher from database\n");
    
    # Check if dispatcher has any destinations before reload
    if (!ds_reload()) {
        xlog("L_ERR", "TIMER: ds_reload() failed - check database connection and dispatcher table\n");
    } else {
        # Log dispatcher status after reload
        xlog("L_INFO", "TIMER: Dispatcher reload completed\n");
    }
    
#!ifdef WITH_K8S
#!ifdef WITH_MYSQL
    # Populate ip2fqdn cache from dispatcher table after reload
    # This ensures we don't need to query DB on cache miss
    # Extract pod_ip from attrs and map to FQDN (destination)
    xlog("L_INFO", "TIMER: Populating ip2fqdn cache from dispatcher\n");
    sql_query("sqlcon", "SELECT destination, attrs FROM dispatcher WHERE setid=1", "ds_result");

    if ($dbr(ds_result=>rows) > 0) {
        $var(i) = 0;
        while ($var(i) < $dbr(ds_result=>rows)) {
            $var(dest) = $dbr(ds_result=>[$var(i),0]);
            $var(attrs) = $dbr(ds_result=>[$var(i),1]);

            # Extract pod_ip from attrs (format: "weight=50;pod_ip=10.42.0.107")
            if ($var(attrs) != $null && $var(attrs) =~ "pod_ip=") {
                # Extract pod_ip value - attrs format: "weight=50;pod_ip=<IP>"
                # Step 1: Get the part after ";" (e.g., "pod_ip=10.42.0.107")
                $var(pod_ip_part) = $(var(attrs){s.select,1,;});
                # Step 2: Get the value after "=" (e.g., "10.42.0.107")
                $var(pod_ip) = $(var(pod_ip_part){s.select,1,=});
                if ($var(pod_ip) != $null && $var(pod_ip) != "") {
                    # Cache pod IP -> FQDN mapping
                    $sht(ip2fqdn=>$var(pod_ip)) = $var(dest);
                    xlog("L_DBG", "TIMER: Cached pod IP $var(pod_ip) -> FQDN $var(dest)\n");
                }
            }

            $var(i) = $var(i) + 1;
        }
        xlog("L_INFO", "TIMER: Populated ip2fqdn cache with $dbr(ds_result=>rows) entries\n");
    }

    sql_result_free("ds_result");
#!endif
#!endif

    # Note: Backend IP checking uses dispatcher's internal cache (VM mode)
    # or ip2fqdn htable (K8s mode) - both populated from dispatcher reload.
    # No DB queries needed on cache miss - just trust the cache!
}
#!endif

# Main request routing

# Main request routing (pure pass-through)
request_route {
    # Diagnostic logging: Log ALL incoming requests at the very start
    xlog("L_INFO", "=== INCOMING REQUEST === method=$rm from $si:$sp to $Ri:$Rp ru=$ru proto=$pr\n");
    
    # Populate AVPs used throughout the routing logic.
    # If WITH_MYSQL is enabled, av_lb binds to av_config and reads FE IPs from DB.
    # Otherwise it uses the static defaults from `modparam("av_lb", ...)`.
    # NOTE: Backend IPs are now loaded from dispatcher table (not av_sip_config).
    # NOTE: DMQ peer is intentionally static (NOT from DB).
    av_lb_load_config();
    
#!ifdef WITH_K8S
    # Diagnostic: Check dispatcher availability on first request (one-time check)
    if ($sht(dispatcher_cache=>dispatcher_checked) == $null) {
        $sht(dispatcher_cache=>dispatcher_checked) = "1";
        if (!ds_select_dst("1", "4")) {
            xlog("L_ERR", "request_route: WARNING - Dispatcher set 1 has no destinations! Check database connection and dispatcher table.\n");
        } else {
            xlog("L_INFO", "request_route: Dispatcher set 1 is available with destinations\n");
        }
    }
#!endif

     # Allow DMQ traffic from peer LBs without IP restriction
    if (is_method("KDMQ")) {
        route(GET_DLG_BACKEND);
        xlog("L_INFO", "DMQ: method=$rm src=$si:$sp dst=$Ri:$Rp ru=$ru du=$du backend=$var(dlg_be)\n");
#!ifdef WITH_K8S
        # K8s: DMQ traffic on port 5090
        if (proto == TCP && $Rp == 5090) {
            dmq_handle_message();
            exit;
        }
#!else
        # VM: DMQ peer is static: set via `modparam("av_lb","dmq_peer_ip", ...)` per LB instance
        if (proto == TCP && $Rp == 5090 && ($si == $avp(dmq_peer_ip) || $si == "127.0.0.1")) {
            dmq_handle_message();
            exit;
        }
#!endif
        sl_send_reply("403", "Forbidden");
        exit;
    }

    route(REQINIT);

    # Enable OS-level TCP keepalive on all connections (inbound and outbound)
    # This is the sole mechanism for dead-peer detection. When a peer dies,
    # the OS closes the socket and Kamailio cleans up the connection.
    # idle=60s, probes=5, interval=5s => dead peer detected in ~85 seconds
    # Global tcp_connection_lifetime=31536000 (~1 year) is just a safety net;
    # connections stay open indefinitely as long as the peer is alive.
    if (proto == TCP && $conid > 0)  {
        tcp_keepalive_enable("", 60, 5, 5);
    }
    
    # Handle Route headers pointing to front end (backend-to-FE requests)
    # Check Route header destination instead of source IP (works for both VM and K8s)
    # In K8s, $si is pod IP which doesn't match $avp(be_ip), so we check Route destination
    $var(route_to_fe) = 0;
    if ($hdrc(Route) > 0) {
        # Extract URI from Route header (format: <sip:host:port;params>)
        # Use nameaddr.uri to parse name-addr format, then uri.host to get host
        $var(route_uri) = $(hdr(Route)[0]{nameaddr.uri});
        
        # Validate Route header is not empty/malformed before extracting host
        if ($var(route_uri) != $null && $var(route_uri) != "") {
            $var(route_host) = $(var(route_uri){uri.host});
            
            # Validate host extraction succeeded
            if ($var(route_host) != $null && $var(route_host) != "") {
                if ($var(route_host) == $avp(fe_ip1) || $var(route_host) == $avp(fe_ip2)) {
                    $var(route_to_fe) = 1;
                    xlog("L_INFO", "request_route: Route header points to FE $var(route_host)\n");
                }
            } else {
                xlog("L_WARN", "request_route: Route header present but host extraction failed, route_uri=$var(route_uri)\n");
            }
        } else {
            xlog("L_WARN", "request_route: Route header present but empty or malformed\n");
        }
    } else {
        # No Route headers - check if R-URI points to front end (backend-to-FE request)
        # This handles cases where backend sends request with R-URI pointing to FE but no Route headers
        $var(ruri_host) = $(ru{uri.host});
        if ($var(ruri_host) == $avp(fe_ip1) || $var(ruri_host) == $avp(fe_ip2)) {
            # R-URI points to front end - this is likely a backend-to-FE request
            # Verify source is a known backend from dispatcher (works for both K8s and VM)
            route(IS_FROM_BACKEND);
            if ($var(is_from_backend) == 1) {
                $var(route_to_fe) = 1;
                xlog("L_INFO", "request_route: No Route headers, but R-URI points to FE $var(ruri_host) from backend $si\n");
            }
#!ifdef WITH_K8S
            # K8s fallback: if backend IP not in cache yet, assume it's from backend
            # This is safe because front ends should not send requests with R-URI pointing to themselves
            if ($var(route_to_fe) == 0) {
                $var(route_to_fe) = 1;
                xlog("L_INFO", "request_route: K8s - No Route headers, R-URI points to FE $var(ruri_host) (assuming backend-to-FE)\n");
            }
#!endif
        }
    }
    # Verify source is a known backend (additional security check)
    if ($var(route_to_fe) == 1) {
        route(IS_FROM_BACKEND);
        if ($var(is_from_backend) == 0) {
#!ifndef WITH_K8S
            # VM mode: strict check - reject if not from known backend
            xlog("L_INFO", "request_route: Route to FE but source $si not a known backend, skipping\n");
            $var(route_to_fe) = 0;
#!else
            # K8s mode: log warning but allow (pod IPs may not be cached yet)
            xlog("L_WARN", "request_route: Route to FE but source $si not in backend cache (may be new pod)\n");
#!endif
        }
    }
    # Handle backend-to-FE requests: either with Route headers (loose_route) or R-URI pointing to FE
    if ($var(route_to_fe) == 1) {
        # If Route headers are present, use loose_route()
        if ($hdrc(Route) > 0 && loose_route()) {
 	    if (!has_totag() && is_method("INVITE|SUBSCRIBE|UPDATE|PUBLISH|NOTIFY")) {
		    $var(rr_count) = $hdrc(Record-Route);
		    $var(last_rr) = "";
		    $var(first_rr) = "";
		    if ($var(rr_count) > 0) {
    			$var(first_rr) = $(hdr(Record-Route)[0]);
    			$var(last_rr) = $(hdr(Record-Route)[$var(rr_count) - 1]);
		    }

		    #if (!($var(first_rr) =~ "10.129.187.13;transport=tcp") && !($var(last_rr) =~ "10.129.187.13;transport=tcp")) {
		    # Ensure we stay in the dialog route set via Record-Route. With "listen ... advertise",
		    # our Record-Route should contain the LB FQDN.
		    if (!($var(first_rr) =~ "lb-kamailio-sm\\.dr\\.avaya\\.com;transport=tcp")
				&& !($var(last_rr) =~ "lb-kamailio-sm\\.dr\\.avaya\\.com;transport=tcp")
				&& !($var(first_rr) =~ $avp(lb_cluster_fqdn))
				&& !($var(last_rr) =~ $avp(lb_cluster_fqdn))) {
			    xlog("L_INFO", "request_route/LR from backend: add record_route\n");
    			route(ADD_RECORD_ROUTE);
		    }
        }

	    #If $du is empty/null (all Route headers consumed), relay to R-URI directly
        if ($du == $null || $du == "") {
            xlog("L_INFO", "request_route/LR: No more Route headers, relaying to R-URI $ru \n");
            route(RELAY);
            exit;
        }

        $var(du_host) = $(du{uri.host});
        xlog("L_INFO", "request_route/LR: $si -> $du (host=$var(du_host))\n");

        # If the next hop is one of the front ends, honor it and DO NOT override
        if ($var(du_host) == $avp(fe_ip1) || $var(du_host) == $avp(fe_ip2)) {
        	xlog("L_INFO", "request_route/LR: honoring Route to front end <$du>\n");
        	# Remember the backend that sent this (for dialog stickiness)
#!ifdef WITH_K8S
            # K8s: Try to find dispatcher FQDN that matches source pod IP
            # Sidecar stores pod_ip in dispatcher attrs, but we can't easily query attrs
            # So we try ds_select_dst with pod IP hash as best-effort match
            route(FIND_BACKEND_FQDN_BY_IP);
            if ($var(backend_fqdn) != $null) {
                $var(dlg_be_val) = $var(backend_fqdn);
                route(SET_DLG_BACKEND);
                xlog("L_INFO", "request_route/LR: Stored backend FQDN $var(dlg_be_val) for Call-ID $ci (source IP $si)\n");
            } else {
                # Fallback: store pod IP format (ds_is_active will fail but stickiness works)
                $var(srcip) = $si;
                $var(dlg_be_val) = "sip:" + $var(srcip) + ":5060;transport=tcp";
                route(SET_DLG_BACKEND);
                xlog("L_WARN", "request_route/LR: Could not find FQDN, stored IP $var(dlg_be_val) for Call-ID $ci\n");
            }
#!else
            # VM: Store backend IP directly (matches dispatcher.list format)
            $var(srcip) = $si;
            $var(dlg_be_val) = "sip:" + $var(srcip) + ":5060;transport=tcp";
            route(SET_DLG_BACKEND);
            xlog("L_INFO", "request_route/LR: Updated sticky backend to $var(dlg_be_val)\n");
#!endif
        	t_on_failure("RTF_DISPATCH");
        	route(RELAY);
        	exit;
	    }
	
	    # If we remembered a backend for this dialog, force it
        route(GET_DLG_BACKEND);
        if ($var(dlg_be) != $null && ds_is_active("1", $var(dlg_be))) {
            xlog("L_INFO", "request_route/LR: existing backend $var(dlg_be) \n");
            setdsturi($var(dlg_be));
        } else {
            if (!ds_select_dst("1", "0")) {
                sl_send_reply("500", "No backend available");
                exit;
            }
            setdsturi($du);
            $var(dlg_be_val) = $du;
            route(SET_DLG_BACKEND);
            xlog("L_INFO", "request_route/LR: set backend to $du \n");
        }

        xlog("L_INFO", "request_route/LR: for backend, loose-route to <$du>\n");
        t_on_failure("RTF_DISPATCH");
        route(RELAY); 
        exit;
        }
        
        # Backend-to-FE request with Route headers but loose_route() failed
        # This shouldn't happen, but handle gracefully
        xlog("L_WARN", "request_route: route_to_fe=1 but loose_route() failed, falling through\n");
    }
    
    # Check for backend-to-FE requests BEFORE handling in-dialog requests
    # This ensures in-dialog backend-to-FE requests (like NOTIFY) are routed correctly
    if ($var(route_to_fe) == 1) {
        # Backend-to-FE request with no Route headers - route directly to R-URI (which points to FE)
        $var(ruri_host) = $(ru{uri.host});
        xlog("L_INFO", "request_route: Backend-to-FE request (in-dialog), routing to R-URI $ru (FE=$var(ruri_host))\n");
        
        # Add Record-Route if this is a dialog-forming method (even for in-dialog, if needed)
        if (is_method("INVITE|SUBSCRIBE|UPDATE|PUBLISH|NOTIFY")) {
            $var(rr_count) = $hdrc(Record-Route);
            $var(last_rr) = "";
            $var(first_rr) = "";
            if ($var(rr_count) > 0) {
                $var(first_rr) = $(hdr(Record-Route)[0]);
                $var(last_rr) = $(hdr(Record-Route)[$var(rr_count) - 1]);
            }
            if (!($var(first_rr) =~ "lb-kamailio-sm\\.dr\\.avaya\\.com;transport=tcp")
                && !($var(last_rr) =~ "lb-kamailio-sm\\.dr\\.avaya\\.com;transport=tcp")
                && !($var(first_rr) =~ $avp(lb_cluster_fqdn))
                && !($var(last_rr) =~ $avp(lb_cluster_fqdn))) {
                xlog("L_INFO", "request_route: Adding Record-Route for backend-to-FE request\n");
                route(ADD_RECORD_ROUTE);
            }
        }
        
        # Remember the backend that sent this (for dialog stickiness)
#!ifdef WITH_K8S
        # K8s: Try to find dispatcher FQDN that matches source pod IP
        route(FIND_BACKEND_FQDN_BY_IP);
        if ($var(backend_fqdn) != $null) {
            $var(dlg_be_val) = $var(backend_fqdn);
            route(SET_DLG_BACKEND);
            xlog("L_INFO", "request_route: Stored backend FQDN $var(dlg_be_val) for Call-ID $ci (source IP $si)\n");
        } else {
            # Fallback: store pod IP format
            $var(srcip) = $si;
            $var(dlg_be_val) = "sip:" + $var(srcip) + ":5060;transport=tcp";
            route(SET_DLG_BACKEND);
            xlog("L_WARN", "request_route: Could not find FQDN, stored IP $var(dlg_be_val) for Call-ID $ci\n");
        }
#!else
        # VM: Store backend IP directly
        $var(srcip) = $si;
        $var(dlg_be_val) = "sip:" + $var(srcip) + ":5060;transport=tcp";
        route(SET_DLG_BACKEND);
        xlog("L_INFO", "request_route: Updated sticky backend to $var(dlg_be_val)\n");
#!endif
        
        # Route directly to R-URI (which points to front end)
        setdsturi($ru);
        t_on_failure("RTF_DISPATCH");
        route(RELAY);
        exit;
    }

    # In-dialog requests first (we forward them in route[WITHINDLG])
    route(WITHINDLG);

    # Record-Route only for dialog-forming methods (do NOT record-route OPTIONS)
    if (is_method("INVITE|SUBSCRIBE|PUBLISH|NOTIFY|REFER")) {
	    $var(rr_count) = $hdrc(Record-Route);
            $var(last_rr) = "";
            $var(first_rr) = "";
            if ($var(rr_count) > 0) {
                $var(first_rr) = $(hdr(Record-Route)[0]);
                $var(last_rr) = $(hdr(Record-Route)[$var(rr_count) - 1]);
            }
#!ifdef WITH_K8S
            # K8s: Add record route using lb_cluster_fqdn from DB (or fallback to listen advertise)
            # Check if we're already in the Record-Route to avoid duplicates
            if (!($var(first_rr) =~ $avp(lb_cluster_fqdn)) && !($var(last_rr) =~ $avp(lb_cluster_fqdn))) {
                route(ADD_RECORD_ROUTE);
            }
#!else
	        # VM: Ensure we stay in the dialog route set via Record-Route (LB FQDN).
            if (!($var(first_rr) =~ "lb-kamailio-sm\\.dr\\.avaya\\.com;transport=tcp")
				&& !($var(last_rr) =~ "lb-kamailio-sm\\.dr\\.avaya\\.com;transport=tcp")
				&& !($var(first_rr) =~ $avp(lb_cluster_fqdn))
				&& !($var(last_rr) =~ $avp(lb_cluster_fqdn))) {
	            xlog("L_INFO", "request_route: add record_route\n");
                route(ADD_RECORD_ROUTE);
            }
#!endif
    }
    
    if (is_method("OPTIONS")) {
        route(HANDLE_OPTIONS);
    }

#!ifndef WITH_K8S
    # --- Honor Request-URI for initial requests coming without any Route headers ---
    # Triggers only if: no To-tag (initial request), no Route, and INVITE
    # Only honor if R-URI host is one of the front-end IPs you expect
    if (!has_totag()) {
        if ($hdrc(Route) == 0) {
            # Only the dialog-forming methods we care about
            if (is_method("INVITE") || is_method("SUBSCRIBE") || is_method("PUBLISH")
            	|| is_method("REFER") || is_method("UPDATE") || is_method("NOTIFY")) {
            	# Extract R-URI host once (avoid parser ambiguity)
            	$var(ruri_host) = $(ru{uri.host});
            	# Only honor if host is one of your front-end IPs
	    	    if ($var(ruri_host) == $avp(fe_ip1) || $var(ruri_host) == $avp(fe_ip2)) {
                    # Keep LB on dialog path (recommended)
                    xlog("L_INFO", "request_route: add record_route\n");
                    route(ADD_RECORD_ROUTE);
                    # Explicit next hop to FE based on Request-URI host
                    setdsturi("sip:$var(ruri_host):5060;transport=tcp");
                    xlog("L_INFO", "request_route: set dsturi to $var(ruri_host)\n");
	  	            # Remember the chosen FE next-hop for this dialog (so later BYE/etc. don't see <null>)
                    $var(dlg_be_val) = $du;
                    route(SET_DLG_BACKEND);
                    xlog("L_INFO", "request_route: HONOR initial RURI, add record route and set -> $du (host=$var(ruri_host))\n");
                    route(RELAY);
                    exit;
                }
            }
        }
    }
#!endif

    # For every initial request (INVITE, REGISTER, OPTIONS, etc.):
    # select a backend and relay it. No local responses.
    if (!ds_select_dst("1", "0")) {             # hash on callId
        sl_send_reply("404", "No destination");  # only if selection failed
        exit;
    }

    # Create dialog & remember chosen backend 
    if (is_method("INVITE|SUBSCRIBE|PUBLISH|REFER|NOTIFY|UPDATE")) {
        dlg_manage();
        $var(dlg_be_val) = $du;
        route(SET_DLG_BACKEND);
	    xlog("L_INFO", "request_route: set backend to $var(dlg_be_val)\n");
    }

    remove_hf_value("Route");
    t_on_failure("RTF_DISPATCH");   # failover logic stays (optional)
    route(RELAY);
    exit;
}

# Failover: try next backend on 500 or local timeout
failure_route[RTF_DISPATCH] {
    if (t_is_canceled()) exit;

    if (t_branch_timeout() && !t_branch_replied()) {
        if (ds_next_dst()) {
            xlog("L_INFO", "RTF_DISPATCH: timeout -> next $du\n");
            $var(dlg_be_val) = $du;
            route(SET_DLG_BACKEND);
            t_on_failure("RTF_DISPATCH");
            route(RELAY); exit;
        } else {
	    xlog("L_ERR", "RTF_DISPATCH: timeout -> no next backend available\n");
	}
    }
 
    
    if (t_check_status("408|430|500|503|504")) {
       if (ds_next_dst()) {
            xlog("L_INFO", "RTF_DISPATCH: $T_reply_code -> next $du\n");
            $var(dlg_be_val) = $du;
            route(SET_DLG_BACKEND);
            t_on_failure("RTF_DISPATCH");
            route(RELAY); exit;
        } else {
	    xlog("L_ERR", "RTF_DISPATCH: $T_reply_code -> no next backend available\n");
	}
    }
}

# ===========================================================================
# TCP CONNECTION CLOSE EVENT
# ===========================================================================
# Triggered when a TCP connection is closed (requires tcpops closed_event=1).
# Logs diagnostic info to help debug unexpected connection resets.
# Available variables: $conid (connection ID), $si:$sp (remote), $Ri:$Rp (local)
# ===========================================================================
event_route[tcp:closed] {
    xlog("L_WARN", "TCP CLOSED: conid=$conid src=$si:$sp dst=$Ri:$Rp proto=$pr\n");
}
