#!KAMAILIO
#
# Front-end SIP Proxy for feature server (TCP) -> backend services (TCP)
#
# - Round-robin initial dispatch to backend
# - Dialog stickiness using dialog module
# - OPTIONS health checks
# - HA failover

# ===========================================================================
# DEPLOYMENT CONFIGURATION
# ===========================================================================
# Choose ONE deployment mode:
#
# *** Kubernetes deployment (uses environment variables):
#!define WITH_K8S
#
# ===========================================================================

# ===========================================================================
# DEBUG CONFIGURATION
# ===========================================================================
#!define WITH_DEBUG
#!ifdef WITH_DEBUG
#!define DBGLEVEL 3
#!else
#!define DBGLEVEL 2
#!endif

# ===========================================================================
# DATABASE CONFIGURATION
# ===========================================================================
# Enable MySQL for dynamic configuration loading
#!define WITH_MYSQL
#!ifdef WITH_K8S
#!defenvs DBURL=DB_URL
#!endif

####### Global Parameters ########

# --- K8s: listen on all interfaces ---
#!ifdef WITH_K8S
# LB FQDN will be set by entrypoint script if LB_FQDN env var is present
# Entrypoint script will modify this section to add advertise parameter
listen=tcp:0.0.0.0:5060 advertise 10.133.63.109:5060
listen=tcp:0.0.0.0:5090 advertise 10.133.63.109:5090
#!endif

disable_tcp=no

# TCP buffer tuning for DMQ replication (default ~16KB can overflow with htable sync)
tcp_rd_buf_size=65536      # 64KB read buffer
tcp_wq_max=1048576         # 1MB max write queue per connection

# TCP connection lifetime: maximum time a TCP connection can live (default: 120s)
# Set to ~1 year so connections effectively stay open forever.
# Actual dead-peer detection is handled by OS-level TCP keepalive (via tcpops).
tcp_connection_lifetime=31536000

# Logging
debug=DBGLEVEL
memdbg=5
memlog=5
#!ifdef WITH_K8S
# K8s: log to stderr (wrapper script writes to /var/log/kamailio/kamailio.log and stdout)
log_stderror=yes
#!else
log_stderror=no
#!endif
log_facility=LOG_LOCAL0
log_prefix="{$mt $hdr(CSeq) $ci} "

# Performance (adjust as needed)
children=8

# (Optional) add your DNS aliases if needed
# alias="sip.yourdomain.com:5060"
#alias="lb-kamailio-sm.dr.avaya.com:5060"
#alias="lb-kamailio-sm.dr.avaya.com:5090"

use_dns_cache = no       # Disable Kamailio's internal DNS cache
use_dns_failover = no    # Optional: disable DNS failover logic
dns_try_ipv6 = no        # Optional: skip IPv6 lookups if not needed

